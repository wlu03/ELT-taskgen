models:
- name: customer_rollup
  description: Per-customer completed-order rollup. One row per customer, including customers with no orders.
  columns:
  - name: customer_id
    description: Unique customer identifier.
  - name: completed_orders
    description: Count of DISTINCT completed orders; 0 if none.
  - name: total_spend
    description: Sum of quantity * unit_price over items of completed orders; 0 if none.
- name: event_wide
  description: One wide row per event with its measurement. One row per event.
  columns:
  - name: event_id
    description: Unique event identifier.
  - name: big_count
    description: 64-bit counter, passed through.
  - name: label
    description: Event label, passed through.
  - name: occurred_at
    description: Event timestamp, passed through.
  - name: tz_stamp
    description: Offset-bearing ISO text, passed through.
  - name: metric_value
    description: Measured value; NULL when unmeasured.
  - name: big_note
    description: Measurement note; NULL when unmeasured.
