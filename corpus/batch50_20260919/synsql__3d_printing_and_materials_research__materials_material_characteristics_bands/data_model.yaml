models:
- columns:
  - description: Identifier of the materials row. One row per value.
    name: parent_key
    type: integer
  - description: material_name of the materials row, copied unchanged.
    name: parent_name
    type: text
  - description: 'material_type of the materials row, copied unchanged. Declared domain: [''ABS'', ''PLA'', ''PETG''].'
    name: parent_status
    type: text
  - description: 'Number of material_characteristics rows for this materials row; 0 when there are none. Every linked material_characteristics row counts, whatever its characteristic_name value. A materials row kept with no material_characteristics row reports 0 here, never 1: its placeholder holds no material_characteristics row to count.'
    name: link_count
    type: bigint
  - description: Of those, how many have characteristic_name in ['melting point']. 0, never missing, when none do.
    name: passing_count
    type: bigint
  - description: How many have characteristic_name in ['density']. 0 when none do.
    name: failing_count
    type: bigint
  - description: How many DISTINCT characteristic_name values occur among them.
    name: distinct_status_count
    type: bigint
  - description: passing_count divided by link_count as a FRACTION between 0 and 1 (not a percentage), rounded to 4 decimals, 0.0 when there are no links.
    name: passing_ratio
    type: float
  - description: 'Band of passing_ratio, decided on the rounded passing_ratio value this mart reports: ''no_activity'' when there are no links, ''high'' at 0.8 or ABOVE (0.8 itself is high), ''medium'' from 0.5 up to but not including 0.8 (0.5 itself is medium), ''low'' below 0.5. Boundaries are inclusive of the HIGHER band.'
    name: adoption_band
    type: text
  - description: 'parent_status mapped value by value: ''ABS'' becomes ''active''; ''PLA'' becomes ''other_1''; any other value — including legal values of the column that the mapping does not name — becomes ''unmapped''. Never NULL.'
    name: status_group
    type: text
  description: Per-materials banding of linked material_characteristics activity in the 3d_printing_and_materials_research scenario, over the value domain the source schema itself declares.
  grain: One row per materials (material_id), INCLUDING materials rows with no linked material_characteristics rows.
  key_columns:
  - parent_key
  name: materials_material_characteristics_bands
  source_relationships:
  - child_columns:
    - material_id
    child_table: data_uploads
    parent_columns:
    - material_id
    parent_table: materials
    required: false
  - child_columns:
    - property_id
    child_table: data_uploads
    parent_columns:
    - property_id
    parent_table: mechanical_properties
    required: false
  - child_columns:
    - setting_id
    child_table: data_uploads
    parent_columns:
    - setting_id
    parent_table: printing_settings
    required: false
  - child_columns:
    - user_id
    child_table: data_uploads
    parent_columns:
    - user_id
    parent_table: users
    required: false
  - child_columns:
    - upload_id
    child_table: data_versions
    parent_columns:
    - upload_id
    parent_table: data_uploads
    required: false
  - child_columns:
    - material_id
    child_table: material_characteristics
    parent_columns:
    - material_id
    parent_table: materials
    required: false
  - child_columns:
    - material_id
    child_table: material_reviews
    parent_columns:
    - material_id
    parent_table: materials
    required: false
  - child_columns:
    - user_id
    child_table: material_reviews
    parent_columns:
    - user_id
    parent_table: users
    required: false
  - child_columns:
    - material_id
    child_table: mechanical_properties
    parent_columns:
    - material_id
    parent_table: materials
    required: false
  - child_columns:
    - setting_id
    child_table: mechanical_properties
    parent_columns:
    - setting_id
    parent_table: printing_settings
    required: false
  - child_columns:
    - setting_id
    child_table: printing_statistics
    parent_columns:
    - setting_id
    parent_table: printing_settings
    required: false
  - child_columns:
    - setting_id
    child_table: roughness_values
    parent_columns:
    - setting_id
    parent_table: printing_settings
    required: false
  - child_columns:
    - setting_id
    child_table: setting_reviews
    parent_columns:
    - setting_id
    parent_table: printing_settings
    required: false
  - child_columns:
    - user_id
    child_table: setting_reviews
    parent_columns:
    - user_id
    parent_table: users
    required: false
  transformation:
    steps:
    - description: Read source table materials.
      operation: source
      order: 1
      source_inputs:
      - materials
    - description: Read source table material_characteristics.
      operation: source
      order: 2
      source_inputs:
      - material_characteristics
    - carried_fields:
      - parent_key
      - parent_name
      - parent_status
      description: One row per materials row, keyed by material_id.
      operation: derive
      order: 3
      source_inputs:
      - materials
    - carried_fields:
      - material_id
      condition:
        public_identifiers:
        - material_characteristics
        - material_id
        - parent_key
      description: 'Bring in material_characteristics (hop 1 of 1): rows with no matching material_characteristics row are RETAINED and report the declared defaults.'
      join_preservation: left
      operation: join
      order: 4
      source_inputs:
      - material_characteristics
    - carried_fields:
      - parent_key
      - parent_name
      - parent_status
      - link_count
      - passing_count
      - failing_count
      - distinct_status_count
      description: 'One output row per parent_key, carrying parent_name, parent_status beside the keys: a key value identifies one source row for the carried columns, so they take one value per key and never split a group, reporting link_count, passing_count, failing_count, distinct_status_count for that row''s matching rows. A group with no qualifying rows still appears, reporting 0; a retained row with no matching rows has nothing to count, so its counts are 0, never 1.'
      operation: filtered_aggregate
      order: 5
    - carried_fields:
      - parent_key
      - parent_name
      - parent_status
      - link_count
      - passing_count
      - failing_count
      - distinct_status_count
      description: Name the mart columns.
      operation: derive
      order: 6
    - carried_fields:
      - parent_key
      - parent_name
      - parent_status
      - link_count
      - passing_count
      - failing_count
      - distinct_status_count
      - passing_ratio
      description: 'Guarded ratios: passing_ratio — passing_count divided by link_count as a FRACTION between 0 and 1 (not a percentage), rounded to 4 decimals, 0.0 when there are no links.'
      operation: ratio
      order: 7
      semantic_parameters:
        null_result: 0.0 when the denominator is 0 or NULL
        rounding: ROUND to 4 decimal places
        units: fraction
    - carried_fields:
      - parent_key
      - parent_name
      - parent_status
      - link_count
      - passing_count
      - failing_count
      - distinct_status_count
      - passing_ratio
      - adoption_band
      description: 'adoption_band — Band of passing_ratio, decided on the rounded passing_ratio value this mart reports: ''no_activity'' when there are no links, ''high'' at 0.8 or ABOVE (0.8 itself is high), ''medium'' from 0.5 up to but not including 0.8 (0.5 itself is medium), ''low'' below 0.5. Boundaries are inclusive of the HIGHER band.'
      operation: conditional
      order: 8
      semantic_parameters:
        boundary: a value exactly at 0.8 is 'high'; a value exactly at 0.5 is 'medium'
        domain: ABS, PLA, PETG
    - carried_fields:
      - parent_key
      - parent_name
      - parent_status
      - link_count
      - passing_count
      - failing_count
      - distinct_status_count
      - passing_ratio
      - adoption_band
      - status_group
      description: 'status_group — parent_status mapped value by value: ''ABS'' becomes ''active''; ''PLA'' becomes ''other_1''; any other value — including legal values of the column that the mapping does not name — becomes ''unmapped''. Never NULL.'
      operation: conditional
      order: 9
      semantic_parameters:
        boundary: categorical mapping; no numeric boundary
        domain: ABS, PLA, PETG
    - carried_fields:
      - parent_key
      description: 'Deterministic output order: sort by parent_key.'
      operation: tie_break
      order: 10
- columns:
  - description: Identifier of the users row.
    name: entity_key
    type: integer
  - description: '''present'' for a linked setting_reviews row whose rating has a value; ''absent'' when rating is missing, including a users row with no linked setting_reviews row. A linked setting_reviews row whose rating has a value belongs only to the present state and never to the absent state.'
    name: measure_state
    type: text
  - description: user_name of the users row, copied unchanged.
    name: entity_name
    type: text
  - description: Number of linked setting_reviews rows in this entity/state cell; a absent cell holding real setting_reviews rows whose rating is missing COUNTS those rows, and only the placeholder cell of an users row with no linked setting_reviews row at all reports 0.
    name: row_count
    type: bigint
  - description: Number of unique non-missing rating values in this cell; each unique non-missing value is counted once, however many rows repeat it; 0 whenever the cell holds no rating value at all — both for an users row with no linked setting_reviews row and for an absent cell whose rows all have a missing rating.
    name: distinct_amount_count
    type: bigint
  - description: Sum of rating in this cell; 0 for a no-activity cell that has no rows at all, and 0 when none of the cell's rows carries an rating value.
    name: total_amount
    type: integer
  - description: Largest rating in this cell; 0 for a no-activity cell that has no rows at all, and 0 when none of the cell's rows carries an rating value.
    name: max_amount
    type: integer
  - description: max_amount divided by total_amount as a fraction, rounded to 4 decimal places; 0.0 when total_amount is 0.
    name: max_amount_share
    type: float
  description: Per-(users, measure state) distribution of linked setting_reviews rows in the 3d_printing_and_materials_research scenario.
  grain: One row per (user_id, measure state) pair represented among linked setting_reviews rows; the absent state includes missing rating values and a no-activity row for a users row with no links. A linked setting_reviews row whose rating has a value belongs only to the present state and never to the absent state.
  key_columns:
  - entity_key
  - measure_state
  name: users_setting_reviews_distribution
  source_relationships:
  - child_columns:
    - material_id
    child_table: data_uploads
    parent_columns:
    - material_id
    parent_table: materials
    required: false
  - child_columns:
    - property_id
    child_table: data_uploads
    parent_columns:
    - property_id
    parent_table: mechanical_properties
    required: false
  - child_columns:
    - setting_id
    child_table: data_uploads
    parent_columns:
    - setting_id
    parent_table: printing_settings
    required: false
  - child_columns:
    - user_id
    child_table: data_uploads
    parent_columns:
    - user_id
    parent_table: users
    required: false
  - child_columns:
    - upload_id
    child_table: data_versions
    parent_columns:
    - upload_id
    parent_table: data_uploads
    required: false
  - child_columns:
    - material_id
    child_table: material_characteristics
    parent_columns:
    - material_id
    parent_table: materials
    required: false
  - child_columns:
    - material_id
    child_table: material_reviews
    parent_columns:
    - material_id
    parent_table: materials
    required: false
  - child_columns:
    - user_id
    child_table: material_reviews
    parent_columns:
    - user_id
    parent_table: users
    required: false
  - child_columns:
    - material_id
    child_table: mechanical_properties
    parent_columns:
    - material_id
    parent_table: materials
    required: false
  - child_columns:
    - setting_id
    child_table: mechanical_properties
    parent_columns:
    - setting_id
    parent_table: printing_settings
    required: false
  - child_columns:
    - setting_id
    child_table: printing_statistics
    parent_columns:
    - setting_id
    parent_table: printing_settings
    required: false
  - child_columns:
    - setting_id
    child_table: roughness_values
    parent_columns:
    - setting_id
    parent_table: printing_settings
    required: false
  - child_columns:
    - setting_id
    child_table: setting_reviews
    parent_columns:
    - setting_id
    parent_table: printing_settings
    required: false
  - child_columns:
    - user_id
    child_table: setting_reviews
    parent_columns:
    - user_id
    parent_table: users
    required: false
  transformation:
    steps:
    - description: Read source table users.
      operation: source
      order: 1
      source_inputs:
      - users
    - description: Read source table setting_reviews.
      operation: source
      order: 2
      source_inputs:
      - setting_reviews
    - carried_fields:
      - entity_key
      - entity_name
      description: Carry each user_id and its user_name into the measure-state calculation.
      operation: derive
      order: 3
      source_inputs:
      - users
    - carried_fields:
      - entity_key
      - entity_name
      - user_id
      condition:
        public_identifiers:
        - setting_reviews
        - user_id
        - entity_key
      description: Bring the linked setting_reviews rows into each users entity; retain an entity with no linked row so its absent state is visible.
      join_preservation: left
      operation: join
      order: 4
      source_inputs:
      - setting_reviews
    - carried_fields:
      - entity_key
      - entity_name
      description: 'Keep the present measure-state rows: a real setting_reviews row whose rating has a value.'
      operation: filter
      order: 5
    - carried_fields:
      - entity_key
      - entity_name
      - row_count
      - distinct_amount_count
      - total_amount
      - max_amount
      description: One row per users entity that has at least one row in the present measure state, and no row here for an entity with none, reporting row count, how many different non-missing rating values occur (each different value counted once, however many rows repeat it), total rating, and largest rating.
      operation: distinct
      order: 6
    - carried_fields:
      - entity_key
      - entity_name
      - row_count
      - distinct_amount_count
      - total_amount
      - max_amount
      - max_amount_share
      description: max_amount_share is max_amount divided by total_amount as a fraction, rounded to 4 decimal places; 0.0 when total_amount is 0.
      operation: ratio
      order: 7
      semantic_parameters:
        null_result: 0.0 when total_amount is 0
        rounding: ROUND to 4 decimal places
        units: fraction
    - carried_fields:
      - entity_key
      - measure_state
      - entity_name
      - row_count
      - distinct_amount_count
      - total_amount
      - max_amount
      - max_amount_share
      description: Label these measures as the present measure state.
      operation: derive
      order: 8
    - carried_fields:
      - entity_key
      - entity_name
      description: 'Keep the absent measure-state rows: rating is missing, including the retained placeholder for a users row with no setting_reviews rows. A real setting_reviews row whose rating has a value belongs only to the present state and never to this absent state.'
      operation: filter
      order: 9
    - carried_fields:
      - entity_key
      - entity_name
      - row_count
      - distinct_amount_count
      - total_amount
      - max_amount
      description: One row per users entity that has at least one row in the absent measure state, and no row here for an entity with none, reporting row count, how many different non-missing rating values occur (each different value counted once, however many rows repeat it), total rating, and largest rating.
      operation: distinct
      order: 10
    - carried_fields:
      - entity_key
      - entity_name
      - row_count
      - distinct_amount_count
      - total_amount
      - max_amount
      - max_amount_share
      description: max_amount_share is max_amount divided by total_amount as a fraction, rounded to 4 decimal places; 0.0 when total_amount is 0.
      operation: ratio
      order: 11
      semantic_parameters:
        null_result: 0.0 when total_amount is 0
        rounding: ROUND to 4 decimal places
        units: fraction
    - carried_fields:
      - entity_key
      - measure_state
      - entity_name
      - row_count
      - distinct_amount_count
      - total_amount
      - max_amount
      - max_amount_share
      description: Label these measures as the absent measure state.
      operation: derive
      order: 12
    - carried_fields:
      - entity_key
      - measure_state
      - entity_name
      - row_count
      - distinct_amount_count
      - total_amount
      - max_amount
      - max_amount_share
      description: 'Stack the present-state summary and the absent-state summary into one output list: every present-state row and every absent-state row is its own output row, an entity with rows in both states appears twice, once per state, and the two summaries are never matched to each other.'
      operation: union
      order: 13
      semantic_parameters:
        mode: all
    - carried_fields:
      - entity_key
      - measure_state
      description: 'Deterministic output order: entity, then measure state.'
      operation: tie_break
      order: 14
