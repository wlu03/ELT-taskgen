aws_s3:
  AWS_ACCESS_KEY_ID: test
  AWS_DEFAULT_REGION: us-west-2
  AWS_ENDPOINT_URL: http://elt-localstack:4566
  AWS_SECRET_ACCESS_KEY: test
  data:
  - path: s3://dlt--personio-bucket/absences.jsonl
    sync_mode: full_refresh_append
    table: absences
  - path: s3://dlt--personio-bucket/attendances.jsonl
    sync_mode: full_refresh_append
    table: attendances
  - path: s3://dlt--personio-bucket/custom_reports.jsonl
    sync_mode: full_refresh_append
    table: custom_reports
  - path: s3://dlt--personio-bucket/document_categories.jsonl
    sync_mode: full_refresh_append
    table: document_categories
custom_api:
  config:
    configuration: {}
    sync_mode: full_refresh_append
    tables:
    - absence_types
flat_files:
- format: csv
  path: http://elt-files:8080/dlt__personio/projects.csv
  sync_mode: full_refresh_append
  table: projects
mongodb:
  config:
    connection_string: mongodb://elt-mongodb:27017/?directConnection=true
    database: dlt__personio
    sync_mode: full_refresh_append
    tables:
    - employees_absences_balance
postgres:
  config:
    database: dlt__personio
    host: elt-postgres
    password: testelt
    port: 5432
    schema: public
    sync_mode: full_refresh_append
    tables:
    - custom_reports_list
    - employees
    user: postgres
snowflake:
  config:
    account: ''
    database: dlt__personio
    password: ''
    role: ''
    schema: AIRBYTE_SCHEMA
    username: ''
    warehouse: ''
