      order: 4
      source_inputs:
      - employees_absences_balance
    - carried_fields:
      - id
      - employees_absences_balance_count
      - last_last_modified_at
      description: 'One output row per id, reporting employees_absences_balance_count for that row''s matching rows. last_last_modified_at is taken from the employees side only: its value comes from last_modified_at on the employees rows, never from the matching rows. An employees row with no matching rows still reports whatever last_modified_at holds on the employees side.'
      operation: aggregate
      order: 5
    - carried_fields:
      - id
      - employees_absences_balance_count
      - last_last_modified_at
      description: Name the mart columns.
      operation: derive
      order: 6
    - carried_fields:
      - id
      description: 'Deterministic output order: sort by id.'
      operation: tie_break
      order: 7
- columns:
