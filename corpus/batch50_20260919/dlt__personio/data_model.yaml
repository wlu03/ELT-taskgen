models:
- columns:
  - description: Identifier of the employees row.
    name: entity_key
    type: bigint
  - description: '''present'' for a linked employees_absences_balance row whose absence_balance_days has a value; ''absent'' when absence_balance_days is missing, including a employees row with no linked employees_absences_balance row. A linked employees_absences_balance row whose absence_balance_days has a value belongs only to the present state and never to the absent state.'
    name: measure_state
    type: text
  - description: employee_division of the employees row, copied unchanged.
    name: entity_name
    type: text
  - description: Number of linked employees_absences_balance rows in this entity/state cell; an absent cell holding real employees_absences_balance rows whose absence_balance_days is missing COUNTS those rows, and only the placeholder cell of an employees row with no linked employees_absences_balance row at all reports 0.
    name: row_count
    type: bigint
  - description: Number of unique non-missing absence_balance_days values in this cell; each unique non-missing value is counted once, however many rows repeat it; 0 whenever the cell holds no absence_balance_days value at all — both for an employees row with no linked employees_absences_balance row and for an absent cell whose rows all have a missing absence_balance_days.
    name: distinct_amount_count
    type: bigint
  - description: Sum of absence_balance_days in this cell; 0 for a no-activity cell that has no rows at all, and 0 when none of the cell's rows carries an absence_balance_days value.
    name: total_amount
    type: decimal
  - description: Largest absence_balance_days in this cell; 0 for a no-activity cell that has no rows at all, and 0 when none of the cell's rows carries an absence_balance_days value.
    name: max_amount
    type: decimal
  - description: max_amount divided by total_amount as a fraction, rounded to 4 decimal places; 0.0 when total_amount is 0.
    name: max_amount_share
    type: float
  description: Per-(employees, measure state) distribution of extracted employees_absences_balance records.
  grain: One row per (id, measure state) pair represented among linked employees_absences_balance rows; the absent state includes missing absence_balance_days values and a no-activity row for a employees row with no links. A linked employees_absences_balance row whose absence_balance_days has a value belongs only to the present state and never to the absent state.
  key_columns:
  - entity_key
  - measure_state
  name: employees_absences_balance_distribution
  source_relationships:
  - child_columns:
    - _custom_reports_list_id
    child_table: custom_reports
    parent_columns:
    - id
    parent_table: custom_reports_list
    required: true
  - child_columns:
    - _employees_id
    child_table: employees_absences_balance
    parent_columns:
    - id
    parent_table: employees
    required: true
  transformation:
    steps:
    - description: Read source table employees.
      operation: source
      order: 1
      source_inputs:
      - employees
    - description: Read source table employees_absences_balance.
      operation: source
      order: 2
      source_inputs:
      - employees_absences_balance
    - carried_fields:
      - entity_key
      - entity_name
      description: Carry each id and its employee_division into the measure-state calculation.
      operation: derive
      order: 3
      source_inputs:
      - employees
    - carried_fields:
      - entity_key
      - entity_name
      - id
      - _employees_id
      condition:
        public_identifiers:
        - employees_absences_balance
        - _employees_id
        - entity_key
      description: Bring the linked employees_absences_balance rows into each employees entity; retain an entity with no linked row so its absent state is visible.
      join_preservation: left
      operation: join
      order: 4
      source_inputs:
      - employees_absences_balance
    - carried_fields:
      - entity_key
      - entity_name
      description: 'Keep the present measure-state rows: a real employees_absences_balance row whose absence_balance_days has a value.'
      operation: filter
      order: 5
    - carried_fields:
      - entity_key
      - entity_name
      - row_count
      - distinct_amount_count
      - total_amount
      - max_amount
      description: One row per employees entity that has at least one row in the present measure state, and no row here for an entity with none, reporting row count, how many different non-missing absence_balance_days values occur (each different value counted once, however many rows repeat it), total absence_balance_days, and largest absence_balance_days.
      operation: distinct
      order: 6
    - carried_fields:
      - entity_key
      - entity_name
      - row_count
      - distinct_amount_count
      - total_amount
      - max_amount
      - max_amount_share
      description: max_amount_share is max_amount divided by total_amount as a fraction, rounded to 4 decimal places; 0.0 when total_amount is 0.
      operation: ratio
      order: 7
      semantic_parameters:
        null_result: 0.0 when total_amount is 0
        rounding: ROUND to 4 decimal places
        units: fraction
    - carried_fields:
      - entity_key
      - measure_state
      - entity_name
      - row_count
      - distinct_amount_count
      - total_amount
      - max_amount
      - max_amount_share
      description: Label these measures as the present measure state.
      operation: derive
      order: 8
    - carried_fields:
      - entity_key
      - entity_name
      description: 'Keep the absent measure-state rows: absence_balance_days is missing, including the retained placeholder for a employees row with no employees_absences_balance rows. A real employees_absences_balance row whose absence_balance_days has a value belongs only to the present state and never to this absent state.'
      operation: filter
      order: 9
    - carried_fields:
      - entity_key
      - entity_name
      - row_count
      - distinct_amount_count
      - total_amount
      - max_amount
      description: One row per employees entity that has at least one row in the absent measure state, and no row here for an entity with none, reporting row count, how many different non-missing absence_balance_days values occur (each different value counted once, however many rows repeat it), total absence_balance_days, and largest absence_balance_days.
      operation: distinct
      order: 10
    - carried_fields:
      - entity_key
      - entity_name
      - row_count
      - distinct_amount_count
      - total_amount
      - max_amount
      - max_amount_share
      description: max_amount_share is max_amount divided by total_amount as a fraction, rounded to 4 decimal places; 0.0 when total_amount is 0.
      operation: ratio
      order: 11
      semantic_parameters:
        null_result: 0.0 when total_amount is 0
        rounding: ROUND to 4 decimal places
        units: fraction
    - carried_fields:
      - entity_key
      - measure_state
      - entity_name
      - row_count
      - distinct_amount_count
      - total_amount
      - max_amount
      - max_amount_share
      description: Label these measures as the absent measure state.
      operation: derive
      order: 12
    - carried_fields:
      - entity_key
      - measure_state
      - entity_name
      - row_count
      - distinct_amount_count
      - total_amount
      - max_amount
      - max_amount_share
      description: 'Stack the present-state summary and the absent-state summary into one output list: every present-state row and every absent-state row is its own output row, an entity with rows in both states appears twice, once per state, and the two summaries are never matched to each other.'
      operation: union
      order: 13
      semantic_parameters:
        mode: all
    - carried_fields:
      - entity_key
      - measure_state
      description: 'Deterministic output order: entity, then measure state.'
      operation: tie_break
      order: 14
- columns:
  - description: Identifier of the employees row. One row per value.
    name: parent_key
    type: bigint
  - description: employee_division of the employees row, copied unchanged.
    name: parent_name
    type: text
  - description: The largest absence_balance_days itself; 0 when the parent has no employees_absences_balance rows, and 0 when none of its rows carries a absence_balance_days value.
    name: top_measure
    type: decimal
  - description: 'How many employees_absences_balance rows are tied at that largest absence_balance_days. 1 when exactly one row carries that largest absence_balance_days; 0 when there are no rows or when none of the rows carries a absence_balance_days value; a row with no absence_balance_days value never ties: only a row whose absence_balance_days value equals the largest value among the parent''s rows holds the maximum, so the winning row of a parent whose rows all lack a value — the row the tie-break alone selects — is not counted here.'
    name: tied_count
    type: bigint
  - description: 'Number of employees_absences_balance rows for this employees row; 0 when there are none. Every linked employees_absences_balance row counts, whether or not it carries an absence_balance_days value. An employees row kept with no employees_absences_balance row reports 0 here, never 1: its placeholder holds no employees_absences_balance row to count.'
    name: child_count
    type: bigint
  - description: Sum of absence_balance_days over all of them; 0 when the parent has no employees_absences_balance rows, and 0 when none of its rows carries a absence_balance_days value (rows with no absence_balance_days value add nothing).
    name: total_measure
    type: decimal
  - description: The absence_policy_headline of the employees_absences_balance row with the LARGEST absence_balance_days for this employees row. Ties in absence_balance_days are broken by taking the SMALLEST absence_policy_headline under a plain case-sensitive comparison of the stored text (the warehouse default order, in which every uppercase letter sorts before every lowercase one) — a row with no absence_policy_headline value sorts after every labelled row. A row with no absence_balance_days value still ranks, after every row that has one, so a parent holding at least one employees_absences_balance row always has a winning row — when NONE of its rows carries a absence_balance_days value the winner is the one the tie-break alone selects, not the no-rows default. The literal '(none)' when the parent has no employees_absences_balance rows at all, and '(none)' when the winning row has no absence_policy_headline value.
    name: top_label
    type: text
  - description: top_measure divided by total_measure as a FRACTION between 0 and 1 (not a percentage), rounded to 4 decimals, 0.0 when total_measure is 0.
    name: top_measure_share
    type: float
  - description: '''empty'' when no row holds a maximum at all — the parent has no employees_absences_balance rows, or none of its rows carries a absence_balance_days value — ''unique'' when exactly one row holds the maximum, ''tied'' when two or more do. Equivalently, tie_state follows tied_count: ''empty'' when tied_count is 0, ''unique'' when it is 1, ''tied'' when it is 2 or more. A row holds the maximum only when it carries a absence_balance_days value equal to the largest absence_balance_days value among the parent''s rows; a row with no absence_balance_days value never holds the maximum. So a parent whose employees_absences_balance rows all lack a absence_balance_days value has no row holding the maximum and is ''empty'', with tied_count 0, even though the ranking still selects a winning row for it by the tie-break alone, which top_label names.'
    name: tie_state
    type: text
  description: 'Per-employees extremes over extracted employees_absences_balance records: WHICH record is largest, not how large it is.'
  grain: One row per employees (id), INCLUDING employees rows with no linked employees_absences_balance rows.
  key_columns:
  - parent_key
  name: employees_absences_balance_top
  source_relationships:
  - child_columns:
    - _custom_reports_list_id
    child_table: custom_reports
    parent_columns:
    - id
    parent_table: custom_reports_list
    required: true
  - child_columns:
    - _employees_id
    child_table: employees_absences_balance
    parent_columns:
    - id
    parent_table: employees
    required: true
  transformation:
    steps:
    - description: Read source table employees.
      operation: source
      order: 1
      source_inputs:
      - employees
    - description: Read source table employees_absences_balance.
      operation: source
      order: 2
      source_inputs:
      - employees_absences_balance
    - carried_fields:
      - parent_key
      - parent_name
      description: One row per employees row, keyed by id.
      operation: derive
      order: 3
      source_inputs:
      - employees
    - carried_fields:
      - _employees_id
      - id
      condition:
        public_identifiers:
        - employees_absences_balance
        - _employees_id
        - parent_key
      description: 'Bring in employees_absences_balance: a employees row with no employees_absences_balance rows still appears, with the declared defaults.'
      join_preservation: left
      operation: join
      order: 4
      source_inputs:
      - employees_absences_balance
    - carried_fields:
      - parent_key
      description: Rank the joined rows within each group under an explicit total order (measure first, then the declared tie-break), so the extremal row is a function of the input and not of row order.
      operation: window
      order: 5
    - carried_fields:
      - parent_key
      - parent_name
      - top_measure
      - tied_count
      - child_count
      - total_measure
      description: 'One output row per parent_key, carrying parent_name beside the keys: a key value identifies one source row for the carried columns, so they take one value per key and never split a group, reporting top_measure, tied_count, child_count, total_measure for that row''s matching rows. A group with no qualifying rows still appears, reporting 0; a retained row with no matching rows has nothing to count, so its counts are 0, never 1.'
      operation: filtered_aggregate
      order: 6
    - carried_fields:
      - parent_key
      - top_label
      description: Keep the single row per parent_key at which the ordering measure is largest, ties broken by the smallest absence_policy_headline under a plain case-sensitive comparison of the stored text (the warehouse default order, in which every uppercase letter sorts before every lowercase one) (a row with no absence_policy_headline value sorts after every row that has one), and take top_label from that winning row. EVERY row of the group ranks, including a row whose ordering measure has no value — such a row sorts after every row that has one — so a group with at least one row always has a winning row, and the declared defaults belong to a group with NO rows.
      operation: extrema
      order: 7
    - carried_fields:
      - parent_key
      condition:
        public_identifiers:
        - parent_key
      description: Attach the extremal row's attributes to the grouped measures. LEFT, so a group with no rows at all keeps its measures.
      join_preservation: left
      operation: join
      order: 8
    - carried_fields:
      - parent_key
      - parent_name
      - top_measure
      - tied_count
      - child_count
      - total_measure
      - top_label
      description: Name the mart columns; top_measure, total_measure report their declared defaults — never NULL — for a group with no matching rows. For top_measure, total_measure, the default also applies to a group none of whose real rows carries an input value.
      operation: derive
      order: 9
    - carried_fields:
      - parent_key
      - parent_name
      - top_measure
      - tied_count
      - child_count
      - total_measure
      - top_label
      - top_measure_share
      description: 'Guarded ratios: top_measure_share — top_measure divided by total_measure as a FRACTION between 0 and 1 (not a percentage), rounded to 4 decimals, 0.0 when total_measure is 0.'
      operation: ratio
      order: 10
      semantic_parameters:
        null_result: 0.0 when the denominator is 0 or NULL
        rounding: ROUND to 4 decimal places
        units: fraction
    - carried_fields:
      - parent_key
      - parent_name
      - top_measure
      - tied_count
      - child_count
      - total_measure
      - top_label
      - top_measure_share
      - tie_state
      description: 'tie_state — ''empty'' when no row holds a maximum at all — the parent has no employees_absences_balance rows, or none of its rows carries a absence_balance_days value — ''unique'' when exactly one row holds the maximum, ''tied'' when two or more do. Equivalently, tie_state follows tied_count: ''empty'' when tied_count is 0, ''unique'' when it is 1, ''tied'' when it is 2 or more. A row holds the maximum only when it carries a absence_balance_days value equal to the largest absence_balance_days value among the parent''s rows; a row with no absence_balance_days value never holds the maximum. So a parent whose employees_absences_balance rows all lack a absence_balance_days value has no row holding the maximum and is ''empty'', with tied_count 0, even though the ranking still selects a winning row for it by the tie-break alone, which top_label names.'
      operation: conditional
      order: 11
      semantic_parameters:
        boundary: categorical mapping; no numeric boundary
    - carried_fields:
      - parent_key
      description: 'Deterministic output order: sort by parent_key.'
      operation: tie_break
      order: 12
- columns:
  - description: employees primary key column 'id'
    name: id
    type: bigint
  - description: number of 'employees_absences_balance' records extracted for this 'employees' (0 when none)
    name: employees_absences_balance_count
    type: bigint
  - description: latest 'last_modified_at' seen for this 'employees' record (the incremental cursor of the resource)
    name: last_last_modified_at
    type: timestamp
  description: one row per 'employees' record extracted from the API
  grain: one row per employees (id)
  key_columns:
  - id
  name: dim_employees
  source_relationships:
  - child_columns:
    - _custom_reports_list_id
    child_table: custom_reports
    parent_columns:
    - id
    parent_table: custom_reports_list
    required: true
  - child_columns:
    - _employees_id
    child_table: employees_absences_balance
    parent_columns:
    - id
    parent_table: employees
    required: true
  transformation:
    steps:
    - description: Read source table employees.
      operation: source
      order: 1
      source_inputs:
      - employees
    - description: Read source table employees_absences_balance.
      operation: source
      order: 2
      source_inputs:
      - employees_absences_balance
    - carried_fields:
      - id
      description: Form the mart key columns id from source table employees.
      operation: derive
      order: 3
      source_inputs:
      - employees
    - carried_fields:
      - id
      - _employees_id
      condition:
        public_identifiers:
        - employees_absences_balance
        - _employees_id
        - id
      description: 'Bring in employees_absences_balance: every employees record appears whether or not it has matching employees_absences_balance records.'
      join_preservation: left
