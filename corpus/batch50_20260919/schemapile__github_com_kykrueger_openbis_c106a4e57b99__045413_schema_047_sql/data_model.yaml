  - description: Identifier of the samples row. One row per value.
    name: parent_key
    type: text
  - description: code of the samples row, copied unchanged.
    name: parent_name
    type: text
  - description: 'Number of attachments rows for this samples row; 0 when there are none. A samples row kept with no attachments row reports 0 here, never 1: its placeholder holds no attachments row to count.'
    name: event_count
    type: bigint
  - description: Sum of version over all matching attachments rows; 0 when there are no rows.
    name: lifetime_amount
    type: integer
  - description: id of the row with the latest registration_timestamp; ties take the smallest id under a plain case-sensitive comparison of the stored text (the warehouse default order, in which every uppercase letter sorts before every lowercase one). It is the literal '(none)' when there are no rows.
    name: latest_row_id
    type: text
  - description: version from that same latest row; 0 when there are no rows.
    name: latest_amount
    type: integer
  - description: file_name from that same latest row; '(none)' when there are no rows.
    name: latest_label
    type: text
  - description: latest_amount divided by lifetime_amount as a fraction, rounded to 4 decimal places; 0.0 when lifetime_amount is 0.
    name: latest_amount_share
    type: float
