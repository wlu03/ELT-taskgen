  transformation:
    steps:
    - description: Read source table sample_types.
      operation: source
      order: 1
      source_inputs:
      - sample_types
    - description: Read source table sample_type_property_types.
      operation: source
      order: 2
      source_inputs:
      - sample_type_property_types
    - carried_fields:
      - entity_key
      - entity_name
      description: Carry each id and its code into the measure-state calculation.
      operation: derive
      order: 3
      source_inputs:
      - sample_types
    - carried_fields:
      - entity_key
      - entity_name
      - id
      - saty_id
      condition:
        public_identifiers:
        - sample_type_property_types
        - saty_id
        - entity_key
      description: Bring the linked sample_type_property_types rows into each sample_types entity; retain an entity with no linked row so its absent state is visible.
      join_preservation: left
      operation: join
      order: 4
      source_inputs:
      - sample_type_property_types
    - carried_fields:
      - entity_key
      - entity_name
      description: 'Keep the present measure-state rows: a real sample_type_property_types row; ordinal is required on every such row.'
      operation: filter
      order: 5
    - carried_fields:
      - entity_key
      - entity_name
      - row_count
      - distinct_amount_count
      - total_amount
      - max_amount
      description: One row per sample_types entity that has at least one row in the present measure state, and no row here for an entity with none, reporting row count, how many different ordinal values occur (each different value counted once, however many rows repeat it), total ordinal, and largest ordinal.
      operation: distinct
      order: 6
    - carried_fields:
      - entity_key
      - entity_name
      - row_count
      - distinct_amount_count
      - total_amount
      - max_amount
      - max_amount_share
      description: max_amount_share is max_amount divided by total_amount as a fraction, rounded to 4 decimal places; 0.0 when total_amount is 0.
      operation: ratio
      order: 7
      semantic_parameters:
        null_result: 0.0 when total_amount is 0
        rounding: ROUND to 4 decimal places
        units: fraction
    - carried_fields:
      - entity_key
      - measure_state
      - entity_name
      - row_count
      - distinct_amount_count
      - total_amount
      - max_amount
      - max_amount_share
      description: Label these measures as the present measure state.
      operation: derive
      order: 8
    - carried_fields:
      - entity_key
      - entity_name
      description: 'Keep the absent measure-state rows: the retained placeholder for a sample_types row with no sample_type_property_types rows; no real row can enter this state because ordinal is required.'
      operation: filter
      order: 9
    - carried_fields:
      - entity_key
      - entity_name
      - row_count
      - distinct_amount_count
      - total_amount
      - max_amount
      description: One row per sample_types entity with no linked sample_type_property_types row at all, whose retained placeholder is its one row in the absent measure state, and no row here for an entity that has a linked sample_type_property_types row, reporting a row count of 0, 0 different ordinal values, a total ordinal of 0 and a largest ordinal of 0.
      operation: distinct
      order: 10
    - carried_fields:
      - entity_key
      - entity_name
      - row_count
      - distinct_amount_count
      - total_amount
      - max_amount
      - max_amount_share
      description: max_amount_share is max_amount divided by total_amount as a fraction, rounded to 4 decimal places; 0.0 when total_amount is 0.
      operation: ratio
      order: 11
      semantic_parameters:
        null_result: 0.0 when total_amount is 0
        rounding: ROUND to 4 decimal places
        units: fraction
    - carried_fields:
      - entity_key
      - measure_state
      - entity_name
      - row_count
      - distinct_amount_count
      - total_amount
      - max_amount
      - max_amount_share
      description: Label these measures as the absent measure state.
      operation: derive
      order: 12
    - carried_fields:
      - entity_key
      - measure_state
      - entity_name
      - row_count
      - distinct_amount_count
      - total_amount
      - max_amount
      - max_amount_share
      description: 'Stack the present-state summary and the absent-state summary into one output list: every present-state row and every absent-state row is its own output row, an entity with rows in both states appears twice, once per state, and the two summaries are never matched to each other.'
      operation: union
      order: 13
      semantic_parameters:
        mode: all
    - carried_fields:
      - entity_key
      - measure_state
      description: 'Deterministic output order: entity, then measure state.'
      operation: tie_break
      order: 14
- columns:
  - description: Identifier of the property_types row. One row per value.
    name: parent_key
    type: text
  - description: code of the property_types row, copied unchanged.
    name: parent_name
    type: text
  - description: The largest ordinal itself; 0 when the parent has no sample_type_property_types rows.
    name: top_measure
    type: integer
  - description: How many sample_type_property_types rows are tied at that largest ordinal. 1 when exactly one row carries that largest ordinal; 0 when there are no rows.
    name: tied_count
    type: bigint
  - description: 'Number of sample_type_property_types rows for this property_types row; 0 when there are none. A property_types row kept with no sample_type_property_types row reports 0 here, never 1: its placeholder holds no sample_type_property_types row to count.'
    name: child_count
    type: bigint
  - description: Sum of ordinal over all of them; 0 when the parent has no sample_type_property_types rows.
    name: total_measure
    type: integer
  - description: The section of the sample_type_property_types row with the LARGEST ordinal for this property_types row. Ties in ordinal are broken by taking the SMALLEST section under a plain case-sensitive comparison of the stored text (the warehouse default order, in which every uppercase letter sorts before every lowercase one) — a row with no section value sorts after every labelled row; rows tied on both are resolved by the smallest id under a plain case-sensitive comparison of the stored text (the warehouse default order, in which every uppercase letter sorts before every lowercase one). The literal '(none)' when the parent has no sample_type_property_types rows at all, and '(none)' when the winning row has no section value.
    name: top_label
    type: text
  - description: The id of that same extremal row — the winner under the SAME total order, so it is the identifier of a real sample_type_property_types row whenever the parent has any. It is the literal '(none)' when there are no rows, and only then. It identifies WHICH row won, so a tie resolved the wrong way is visible even when two rows share a label.
    name: top_row_id
    type: text
  - description: top_measure divided by total_measure as a FRACTION between 0 and 1 (not a percentage), rounded to 4 decimals, 0.0 when total_measure is 0.
    name: top_measure_share
    type: float
  - description: '''empty'' when no row holds a maximum at all — the parent has no sample_type_property_types rows — ''unique'' when exactly one row holds the maximum, ''tied'' when two or more do. Equivalently, tie_state follows tied_count: ''empty'' when tied_count is 0, ''unique'' when it is 1, ''tied'' when it is 2 or more.'
    name: tie_state
    type: text
  description: 'Per-property_types extremes over linked sample_type_property_types rows in the 045413_schema-047.sql schema: WHICH row is largest, not how large it is.'
  grain: One row per property_types (id), INCLUDING property_types rows with no linked sample_type_property_types rows.
