  transformation:
    steps:
    - description: Read source table property_types.
      operation: source
      order: 1
      source_inputs:
      - property_types
    - description: Read source table sample_type_property_types.
      operation: source
      order: 2
      source_inputs:
      - sample_type_property_types
    - carried_fields:
      - parent_key
      - parent_name
      description: One row per property_types row, keyed by id.
      operation: derive
      order: 3
      source_inputs:
      - property_types
    - carried_fields:
      - prty_id
      - id
      condition:
        public_identifiers:
        - sample_type_property_types
        - prty_id
        - parent_key
      description: 'Bring in sample_type_property_types: a property_types row with no sample_type_property_types rows still appears, with the declared defaults.'
      join_preservation: left
      operation: join
      order: 4
      source_inputs:
      - sample_type_property_types
    - carried_fields:
      - parent_key
      description: Rank the joined rows within each group under an explicit total order (measure first, then the declared tie-break), so the extremal row is a function of the input and not of row order.
      operation: window
      order: 5
    - carried_fields:
      - parent_key
      - parent_name
      - top_measure
      - tied_count
      - child_count
      - total_measure
      description: 'One output row per parent_key, carrying parent_name beside the keys: a key value identifies one source row for the carried columns, so they take one value per key and never split a group, reporting top_measure, tied_count, child_count, total_measure for that row''s matching rows. A group with no qualifying rows still appears, reporting 0; a retained row with no matching rows has nothing to count, so its counts are 0, never 1.'
      operation: filtered_aggregate
      order: 6
    - carried_fields:
      - parent_key
      - top_label
      - top_row_id
      description: Keep the single row per parent_key at which the ordering measure is largest, ties broken by the smallest section under a plain case-sensitive comparison of the stored text (the warehouse default order, in which every uppercase letter sorts before every lowercase one) (a row with no section value sorts after every row that has one), then the smallest id under a plain case-sensitive comparison of the stored text (the warehouse default order, in which every uppercase letter sorts before every lowercase one), and take top_label, top_row_id from that winning row. The ordering measure is required on every real input row, so a non-empty group always has a winning row; the declared defaults belong only to a group with NO rows.
      operation: extrema
      order: 7
    - carried_fields:
      - parent_key
      condition:
        public_identifiers:
        - parent_key
      description: Attach the extremal row's attributes to the grouped measures. LEFT, so a group with no rows at all keeps its measures.
      join_preservation: left
      operation: join
      order: 8
    - carried_fields:
      - parent_key
      - parent_name
      - top_measure
      - tied_count
      - child_count
      - total_measure
      - top_label
      - top_row_id
      description: Name the mart columns; top_measure, total_measure report their declared defaults — never NULL — for a group with no matching rows.
      operation: derive
      order: 9
    - carried_fields:
      - parent_key
      - parent_name
      - top_measure
      - tied_count
      - child_count
      - total_measure
      - top_label
      - top_row_id
      - top_measure_share
      description: 'Guarded ratios: top_measure_share — top_measure divided by total_measure as a FRACTION between 0 and 1 (not a percentage), rounded to 4 decimals, 0.0 when total_measure is 0.'
      operation: ratio
      order: 10
      semantic_parameters:
        null_result: 0.0 when the denominator is 0 or NULL
        rounding: ROUND to 4 decimal places
        units: fraction
    - carried_fields:
      - parent_key
      - parent_name
      - top_measure
      - tied_count
      - child_count
      - total_measure
      - top_label
      - top_row_id
      - top_measure_share
      - tie_state
      description: 'tie_state — ''empty'' when no row holds a maximum at all — the parent has no sample_type_property_types rows — ''unique'' when exactly one row holds the maximum, ''tied'' when two or more do. Equivalently, tie_state follows tied_count: ''empty'' when tied_count is 0, ''unique'' when it is 1, ''tied'' when it is 2 or more.'
      operation: conditional
      order: 11
      semantic_parameters:
        boundary: categorical mapping; no numeric boundary
    - carried_fields:
      - parent_key
      description: 'Deterministic output order: sort by parent_key.'
      operation: tie_break
      order: 12
