  transformation:
    steps:
    - description: Read source table sessions.
      operation: source
      order: 1
      source_inputs:
      - sessions
    - description: Read source table wifi_stats.
      operation: source
      order: 2
      source_inputs:
      - wifi_stats
    - carried_fields:
      - parent_key
      - parent_name
      description: One row per sessions row, keyed by id.
      operation: derive
      order: 3
      source_inputs:
      - sessions
    - carried_fields:
      - session_id
      - id
      condition:
        public_identifiers:
        - wifi_stats
        - session_id
        - parent_key
      description: Bring in wifi_stats; a sessions row with no matching wifi_stats row is retained and receives the stated empty snapshot values.
      join_preservation: left
      operation: join
      order: 4
      source_inputs:
      - wifi_stats
    - carried_fields:
      - parent_key
      - parent_name
      - event_count
      - lifetime_amount
      description: 'One output row per parent_key, carrying parent_name beside the keys: a key value identifies one source row for the carried columns, so they take one value per key and never split a group, reporting event_count, lifetime_amount for that row''s matching rows.'
      operation: aggregate
      order: 5
    - carried_fields:
      - parent_key
      - latest_row_id
      - latest_amount
      - latest_label
      description: Keep the single row per parent_key at which the ordering measure is largest, ties broken by the smallest id, and take latest_row_id, latest_amount, latest_label from that winning row. EVERY row of the group ranks, including a row whose ordering measure has no value — such a row sorts after every row that has one — so a group with at least one row always has a winning row, and the declared defaults belong to a group with NO rows.
      operation: extrema
      order: 6
    - carried_fields:
      - parent_key
      condition:
        public_identifiers:
        - parent_key
      description: Attach the extremal row's attributes to the grouped measures. LEFT, so a group with no rows at all keeps its measures.
      join_preservation: left
      operation: join
      order: 7
    - carried_fields:
      - parent_key
      - parent_name
      - event_count
      - lifetime_amount
      - latest_row_id
      - latest_amount
      - latest_label
      description: Name the mart columns; lifetime_amount reports its declared default — never NULL — for a group with no matching rows. For lifetime_amount, the default also applies to a group none of whose real rows carries an input value.
      operation: derive
      order: 8
    - carried_fields:
      - parent_key
      - parent_name
      - event_count
      - lifetime_amount
      - latest_row_id
      - latest_amount
      - latest_label
      - latest_amount_share
      description: 'Guarded ratios: latest_amount_share — latest_amount divided by lifetime_amount as a fraction, rounded to 4 decimal places; 0.0 when lifetime_amount is 0. The division uses latest_amount as this mart reports it, after its default of 0 for a winning row whose r_speed is missing, so such a row gives 0.0.'
      operation: ratio
      order: 9
      semantic_parameters:
        null_result: 0.0 when the denominator is 0 or NULL
        rounding: ROUND to 4 decimal places
        units: fraction
    - carried_fields:
      - parent_key
      description: 'Deterministic output order: sort by parent_key.'
      operation: tie_break
      order: 10
- columns:
  - description: Identifier of the pcap_flow row.
    name: entity_key
    type: bigint
  - description: '''present'' for a linked pcap_throughput row whose value has a value; ''absent'' when value is missing, including a pcap_flow row with no linked pcap_throughput row. A linked pcap_throughput row whose value has a value belongs only to the present state and never to the absent state.'
    name: measure_state
    type: text
  - description: destination_ip of the pcap_flow row, copied unchanged.
    name: entity_name
    type: text
  - description: Number of linked pcap_throughput rows in this entity/state cell; a absent cell holding real pcap_throughput rows whose value is missing COUNTS those rows, and only the placeholder cell of a pcap_flow row with no linked pcap_throughput row at all reports 0.
    name: row_count
    type: bigint
  - description: Number of unique non-missing value values in this cell; each unique non-missing value is counted once, however many rows repeat it; 0 whenever the cell holds no value value at all — both for a pcap_flow row with no linked pcap_throughput row and for an absent cell whose rows all have a missing value.
    name: distinct_amount_count
    type: bigint
  - description: Sum of value in this cell; 0 for a no-activity cell that has no rows at all, and 0 when none of the cell's rows carries an value value.
    name: total_amount
    type: float
  - description: Largest value in this cell; 0 for a no-activity cell that has no rows at all, and 0 when none of the cell's rows carries an value value.
    name: max_amount
    type: float
  - description: max_amount divided by total_amount as a fraction, rounded to 4 decimal places; 0.0 when total_amount is 0.
    name: max_amount_share
    type: float
  description: Per-(pcap_flow, measure state) distribution of linked pcap_throughput activity in the 162575_init-hostview.sql schema.
  grain: One row per (id, measure state) pair represented among linked pcap_throughput rows; the absent state includes missing value values and a no-activity row for a pcap_flow row with no links. A linked pcap_throughput row whose value has a value belongs only to the present state and never to the absent state.
