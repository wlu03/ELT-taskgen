models:
- columns:
  - description: Identifier of the sessions row. One row per value.
    name: parent_key
    type: bigint
  - description: start_event of the sessions row, copied unchanged.
    name: parent_name
    type: text
  - description: 'Number of wifi_stats rows for this sessions row; 0 when there are none. Every linked wifi_stats row counts, whether or not it carries a r_speed value. A sessions row kept with no wifi_stats row reports 0 here, never 1: its placeholder holds no wifi_stats row to count.'
    name: event_count
    type: bigint
  - description: Sum of r_speed over all matching wifi_stats rows; 0 when there are no rows and when none of those rows carries an r_speed value; a row with no r_speed value adds nothing, so a group with some values sums the values it has.
    name: lifetime_amount
    type: bigint
  - description: 'id of the row with the latest logged_at; ties take the smallest id. It is 0 when there are no rows. Every wifi_stats row of the sessions row ranks, whether or not it carries a r_speed value: the latest logged_at wins even when that row''s r_speed is missing.'
    name: latest_row_id
    type: bigint
  - description: r_speed from that same latest row; 0 when there are no rows or when the winning value is missing.
    name: latest_amount
    type: bigint
  - description: guid from that same latest row; '(none)' when there are no rows or when the winning value is missing.
    name: latest_label
    type: text
  - description: latest_amount divided by lifetime_amount as a fraction, rounded to 4 decimal places; 0.0 when lifetime_amount is 0. The division uses latest_amount as this mart reports it, after its default of 0 for a winning row whose r_speed is missing, so such a row gives 0.0.
    name: latest_amount_share
    type: float
  description: Per-sessions latest-row snapshot over linked wifi_stats activity in the 162575_init-hostview.sql schema.
