models:
- columns:
  - description: Identifier of the films row.
    name: entity_key
    type: integer
  - description: '''passing'' for image_type values [''poster'']; ''failing'' for values [''still'', ''behind-the-scenes'']; ''no_activity'' when the films row has no linked images row. A linked images row whose image_type has no value belongs to no cohort: it is not counted in any cell, and it does not make the films row ''no_activity''.'
    name: cohort
    type: text
  - description: title of the films row, copied unchanged.
    name: entity_name
    type: text
  - description: Number of images rows in this entity/cohort cell.
    name: link_count
    type: bigint
  - description: Number of distinct image_type values represented in this cell.
    name: distinct_status_count
    type: bigint
  - description: Sum of file_size in this cell; 0 for a no-activity cell that has no rows at all, and 0 when none of the cell's rows carries an file_size value.
    name: total_amount
    type: float
  - description: Largest file_size in this cell; 0 for a no-activity cell that has no rows at all, and 0 when none of the cell's rows carries an file_size value.
    name: max_amount
    type: float
  - description: max_amount divided by total_amount as a fraction, rounded to 4 decimal places; 0.0 when total_amount is 0.
    name: max_amount_share
    type: float
  description: Per-(films, status cohort) summary of linked images rows in the __film_production_and_financial_performance_analysis__ scenario, with passing and failing cohorts kept separate.
  grain: One row per (film_id, status cohort) pair represented among linked images rows, plus one no-activity row for a films row with no linked images row at all. A films row whose linked images rows all lack a image_type value is in no cohort and gets no no-activity row, so it has no row in this mart.
  key_columns:
  - entity_key
  - cohort
  name: films_images_cohorts
  source_relationships:
  - child_columns:
    - film_id
    child_table: access_logs
    parent_columns:
    - film_id
    parent_table: films
    required: false
  - child_columns:
    - user_id
    child_table: access_logs
    parent_columns:
    - user_id
    parent_table: users
    required: false
  - child_columns:
    - bond_actor_id
    child_table: films
    parent_columns:
    - actor_id
    parent_table: actors
    required: false
  - child_columns:
    - composer_id
    child_table: films
    parent_columns:
    - composer_id
    parent_table: composers
    required: false
  - child_columns:
    - director_id
    child_table: films
    parent_columns:
    - director_id
    parent_table: directors
    required: false
  - child_columns:
    - producer_id
    child_table: films
    parent_columns:
    - producer_id
    parent_table: producers
    required: false
  - child_columns:
    - writer_id
    child_table: films
    parent_columns:
    - writer_id
    parent_table: writers
    required: false
  - child_columns:
    - film_id
    child_table: financials
    parent_columns:
    - film_id
    parent_table: films
    required: false
  - child_columns:
    - film_id
    child_table: images
    parent_columns:
    - film_id
    parent_table: films
    required: false
  transformation:
    steps:
    - description: Read source table films.
      operation: source
      order: 1
      source_inputs:
      - films
    - description: Read source table images.
      operation: source
      order: 2
      source_inputs:
      - images
    - carried_fields:
      - entity_key
      - entity_name
      description: Carry each film_id and its title into the cohort calculation.
      operation: derive
      order: 3
      source_inputs:
      - films
    - carried_fields:
      - entity_key
      - entity_name
      - film_id
      condition:
        public_identifiers:
        - images
        - film_id
        - entity_key
      description: Bring the linked images rows into each films entity before assigning status cohorts.
      join_preservation: left
      operation: join
      order: 4
      source_inputs:
      - images
    - carried_fields:
      - entity_key
      - entity_name
      condition:
        literal_values:
        - poster
      description: Keep rows whose image_type belongs to the passing cohort values ['poster'].
      operation: filter
      order: 5
    - carried_fields:
      - entity_key
      - entity_name
      - link_count
      - distinct_status_count
      - total_amount
      - max_amount
      description: One row per films entity that has at least one linked images row in the passing cohort, reporting the number of those rows, how many different image_type values occur among them, the total of their file_size, and their largest file_size. The total and the largest value read only the rows that carry a file_size value; a cohort whose rows all lack one reports 0 for both, never empty.
      operation: distinct
      order: 6
    - carried_fields:
      - entity_key
      - entity_name
      - link_count
      - distinct_status_count
      - total_amount
      - max_amount
      - max_amount_share
      description: max_amount_share is max_amount divided by total_amount as a fraction, rounded to 4 decimal places; 0.0 when total_amount is 0.
      operation: ratio
      order: 7
      semantic_parameters:
        null_result: 0.0 when total_amount is 0
        rounding: ROUND to 4 decimal places
        units: fraction
    - carried_fields:
      - entity_key
      - cohort
      - entity_name
      - link_count
      - distinct_status_count
      - total_amount
      - max_amount
      - max_amount_share
      description: Label these measures as the passing cohort.
      operation: derive
      order: 8
    - carried_fields:
      - entity_key
      - entity_name
      condition:
        literal_values:
        - still
        - behind-the-scenes
      description: Keep rows whose image_type belongs to the failing cohort values ['still', 'behind-the-scenes'].
      operation: filter
      order: 9
    - carried_fields:
      - entity_key
      - entity_name
      - link_count
      - distinct_status_count
      - total_amount
      - max_amount
      description: One row per films entity that has at least one linked images row in the failing cohort, reporting the number of those rows, how many different image_type values occur among them, the total of their file_size, and their largest file_size. The total and the largest value read only the rows that carry a file_size value; a cohort whose rows all lack one reports 0 for both, never empty.
      operation: distinct
      order: 10
    - carried_fields:
      - entity_key
      - entity_name
      - link_count
      - distinct_status_count
      - total_amount
      - max_amount
      - max_amount_share
      description: max_amount_share is max_amount divided by total_amount as a fraction, rounded to 4 decimal places; 0.0 when total_amount is 0.
      operation: ratio
      order: 11
      semantic_parameters:
        null_result: 0.0 when total_amount is 0
        rounding: ROUND to 4 decimal places
        units: fraction
    - carried_fields:
      - entity_key
      - cohort
      - entity_name
      - link_count
      - distinct_status_count
      - total_amount
      - max_amount
      - max_amount_share
      description: Label these measures as the failing cohort.
      operation: derive
      order: 12
    - carried_fields:
      - entity_key
      - entity_name
      description: Keep the placeholder row for a films entity with no linked images row at all; a films entity that has linked images rows gets no placeholder, even when every one of those rows lacks a image_type value.
      operation: filter
      order: 13
    - carried_fields:
      - entity_key
      - entity_name
      - link_count
      - distinct_status_count
      - total_amount
      - max_amount
      description: One row per films entity with no linked images row at all, reporting 0 rows, 0 different image_type values, a file_size total of 0 and a largest file_size of 0.
      operation: distinct
      order: 14
    - carried_fields:
      - entity_key
      - entity_name
      - link_count
      - distinct_status_count
      - total_amount
      - max_amount
      - max_amount_share
      description: max_amount_share is max_amount divided by total_amount as a fraction, rounded to 4 decimal places; 0.0 when total_amount is 0.
      operation: ratio
      order: 15
      semantic_parameters:
        null_result: 0.0 when total_amount is 0
        rounding: ROUND to 4 decimal places
        units: fraction
    - carried_fields:
      - entity_key
      - cohort
      - entity_name
      - link_count
      - distinct_status_count
      - total_amount
      - max_amount
      - max_amount_share
      description: Label these measures as the no_activity cohort.
      operation: derive
      order: 16
    - carried_fields:
      - entity_key
      - cohort
      - entity_name
      - link_count
      - distinct_status_count
      - total_amount
      - max_amount
      - max_amount_share
      description: Combine the disjoint passing and failing cohort summaries.
      operation: union
      order: 17
      semantic_parameters:
        mode: all
    - carried_fields:
      - entity_key
      - cohort
      - entity_name
      - link_count
      - distinct_status_count
      - total_amount
      - max_amount
      - max_amount_share
      description: Add the no-activity summaries, so an entity with no linked rows is retained as one explicit cohort row.
      operation: union
      order: 18
      semantic_parameters:
        mode: all
    - carried_fields:
      - entity_key
      - cohort
      description: 'Deterministic output order: entity, then cohort.'
      operation: tie_break
      order: 19
- columns:
  - description: Identifier of the users row. One row per value.
    name: parent_key
    type: integer
  - description: user_name of the users row, copied unchanged.
    name: parent_name
    type: text
  - description: 'role of the users row, copied unchanged. Declared domain: [''producer'', ''director'', ''analyst''].'
    name: parent_status
    type: text
  - description: 'Number of access_logs rows for this users row; 0 when there are none. Every linked access_logs row counts, whatever its access_type value. An users row kept with no access_logs row reports 0 here, never 1: its placeholder holds no access_logs row to count.'
    name: link_count
    type: bigint
  - description: Of those, how many have access_type in ['view']. 0, never missing, when none do.
    name: passing_count
    type: bigint
  - description: How many have access_type in ['edit']. 0 when none do.
    name: failing_count
    type: bigint
  - description: How many DISTINCT access_type values occur among them.
    name: distinct_status_count
    type: bigint
  - description: passing_count divided by link_count as a FRACTION between 0 and 1 (not a percentage), rounded to 4 decimals, 0.0 when there are no links.
    name: passing_ratio
    type: float
  - description: 'Band of passing_ratio, decided on the rounded passing_ratio value this mart reports: ''no_activity'' when there are no links, ''high'' at 0.8 or ABOVE (0.8 itself is high), ''medium'' from 0.5 up to but not including 0.8 (0.5 itself is medium), ''low'' below 0.5. Boundaries are inclusive of the HIGHER band.'
    name: adoption_band
    type: text
  - description: 'parent_status mapped value by value: ''producer'' becomes ''active''; ''director'' becomes ''other_1''; any other value — including legal values of the column that the mapping does not name — becomes ''unmapped''. Never NULL.'
    name: status_group
    type: text
  description: Per-users banding of linked access_logs activity in the __film_production_and_financial_performance_analysis__ scenario, over the value domain the source schema itself declares.
  grain: One row per users (user_id), INCLUDING users rows with no linked access_logs rows.
  key_columns:
  - parent_key
  name: users_access_logs_bands
  source_relationships:
  - child_columns:
    - film_id
    child_table: access_logs
    parent_columns:
    - film_id
    parent_table: films
    required: false
  - child_columns:
    - user_id
    child_table: access_logs
    parent_columns:
    - user_id
    parent_table: users
    required: false
  - child_columns:
    - bond_actor_id
    child_table: films
    parent_columns:
    - actor_id
    parent_table: actors
    required: false
  - child_columns:
    - composer_id
    child_table: films
    parent_columns:
    - composer_id
    parent_table: composers
    required: false
  - child_columns:
    - director_id
    child_table: films
    parent_columns:
    - director_id
    parent_table: directors
    required: false
  - child_columns:
    - producer_id
    child_table: films
    parent_columns:
    - producer_id
    parent_table: producers
    required: false
  - child_columns:
    - writer_id
    child_table: films
    parent_columns:
    - writer_id
    parent_table: writers
    required: false
  - child_columns:
    - film_id
    child_table: financials
    parent_columns:
    - film_id
    parent_table: films
    required: false
  - child_columns:
    - film_id
    child_table: images
    parent_columns:
    - film_id
    parent_table: films
    required: false
  transformation:
    steps:
    - description: Read source table users.
      operation: source
      order: 1
      source_inputs:
      - users
    - description: Read source table access_logs.
      operation: source
      order: 2
      source_inputs:
      - access_logs
    - carried_fields:
      - parent_key
      - parent_name
      - parent_status
      description: One row per users row, keyed by user_id.
      operation: derive
      order: 3
      source_inputs:
      - users
    - carried_fields:
      - user_id
      condition:
        public_identifiers:
        - access_logs
        - user_id
        - parent_key
      description: 'Bring in access_logs (hop 1 of 1): rows with no matching access_logs row are RETAINED and report the declared defaults.'
      join_preservation: left
      operation: join
      order: 4
      source_inputs:
      - access_logs
    - carried_fields:
      - parent_key
      - parent_name
      - parent_status
      - link_count
      - passing_count
      - failing_count
      - distinct_status_count
      description: 'One output row per parent_key, carrying parent_name, parent_status beside the keys: a key value identifies one source row for the carried columns, so they take one value per key and never split a group, reporting link_count, passing_count, failing_count, distinct_status_count for that row''s matching rows. A group with no qualifying rows still appears, reporting 0; a retained row with no matching rows has nothing to count, so its counts are 0, never 1.'
      operation: filtered_aggregate
      order: 5
    - carried_fields:
      - parent_key
      - parent_name
      - parent_status
      - link_count
      - passing_count
      - failing_count
      - distinct_status_count
      description: Name the mart columns.
      operation: derive
      order: 6
    - carried_fields:
      - parent_key
      - parent_name
      - parent_status
      - link_count
      - passing_count
      - failing_count
      - distinct_status_count
      - passing_ratio
      description: 'Guarded ratios: passing_ratio — passing_count divided by link_count as a FRACTION between 0 and 1 (not a percentage), rounded to 4 decimals, 0.0 when there are no links.'
      operation: ratio
      order: 7
      semantic_parameters:
        null_result: 0.0 when the denominator is 0 or NULL
        rounding: ROUND to 4 decimal places
        units: fraction
    - carried_fields:
      - parent_key
      - parent_name
      - parent_status
      - link_count
      - passing_count
      - failing_count
      - distinct_status_count
      - passing_ratio
      - adoption_band
      description: 'adoption_band — Band of passing_ratio, decided on the rounded passing_ratio value this mart reports: ''no_activity'' when there are no links, ''high'' at 0.8 or ABOVE (0.8 itself is high), ''medium'' from 0.5 up to but not including 0.8 (0.5 itself is medium), ''low'' below 0.5. Boundaries are inclusive of the HIGHER band.'
      operation: conditional
      order: 8
      semantic_parameters:
        boundary: a value exactly at 0.8 is 'high'; a value exactly at 0.5 is 'medium'
        domain: producer, director, analyst
    - carried_fields:
      - parent_key
      - parent_name
      - parent_status
      - link_count
      - passing_count
      - failing_count
      - distinct_status_count
      - passing_ratio
      - adoption_band
      - status_group
      description: 'status_group — parent_status mapped value by value: ''producer'' becomes ''active''; ''director'' becomes ''other_1''; any other value — including legal values of the column that the mapping does not name — becomes ''unmapped''. Never NULL.'
      operation: conditional
      order: 9
      semantic_parameters:
        boundary: categorical mapping; no numeric boundary
        domain: producer, director, analyst
    - carried_fields:
      - parent_key
      description: 'Deterministic output order: sort by parent_key.'
      operation: tie_break
      order: 10
