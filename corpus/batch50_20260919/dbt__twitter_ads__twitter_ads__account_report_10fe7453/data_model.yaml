  - child_columns:
    - promoted_tweet_id
    child_table: promoted_tweet_report
    parent_columns:
    - id
    parent_table: promoted_tweet_history
    required: false
  transformation:
    steps:
    - description: Read source table promoted_tweet_report.
      operation: source
      order: 1
      source_inputs:
      - promoted_tweet_report
    - description: Read source table account_history.
      operation: source
      order: 2
      source_inputs:
      - account_history
    - carried_fields:
      - account_id
      - placement
      - date_day
      description: 'Form the mart key columns account_id, placement, date_day from source table promoted_tweet_report. date_day is not copied from a promoted_tweet_report column but computed from promoted_tweet_report: It is date truncated to the start of its calendar day at 00:00:00 and remains part of the mart grain.'
