models:
- columns:
  - description: The ID of the account.
    name: account_id
    type: text
  - description: Where on Twitter the ad is being displayed. Possible values include 'ALL_ON_TWITTER', 'PUBLISHER_NETWORK', 'TWITTER_PROFILE', 'TWITTER_SEARCH', 'TWITTER_TIMELINE', and 'TAP_*', which are more granular options for `PUBLISHER_NETWORK`.
    name: placement
    type: text
  - description: The date of the performance. It is date truncated to the start of its calendar day at 00:00:00 and remains part of the mart grain.
    name: date_day
    type: timestamp
  - description: Name of the account. Taken as the `name` of the matching `account_history` record.
    name: account_name
    type: text
  - description: The approval status of the account. Taken as the `approval_status` of the matching `account_history` record.
    name: approval_status
    type: text
  - description: The ID of the related business. Taken as the `business_id` of the matching `account_history` record.
    name: business_id
    type: text
  - description: The name of the related business. Taken as the `business_name` of the matching `account_history` record.
    name: business_name
    type: text
  - description: The timestamp the account was created. Taken as the `created_at` of the matching `account_history` record.
    name: created_timestamp
    type: timestamp
  - description: The industry of the accounts. Taken as the `industry_type` of the matching `account_history` record.
    name: industry_type
    type: text
  - description: Whether the record has been deleted or not. Taken as the `deleted` of the matching `account_history` record.
    name: is_deleted
    type: boolean
  - description: The timezone the account is set to. Taken as the `timezone` of the matching `account_history` record.
    name: timezone
    type: text
  - description: The timestamp the account's timezone was last changed. Taken as the `timezone_switch_at` of the matching `account_history` record.
    name: timezone_switched_timestamp
    type: timestamp
  - description: The timestamp the account was last updated. Taken as the `updated_at` of the matching `account_history` record.
    name: updated_timestamp
    type: timestamp
  - description: 'The clicks for th account on that day. Includes clicks on the URL (shortened or regular links), profile pic, screen name, username, detail, hashtags, and likes. Per-input source lineage: `clicks` is the value of source column `promoted_tweet_report.clicks`, added up over the source rows that share the mart row''s grain.'
    name: clicks
    type: bigint
  - description: 'The number of conversions of type CUSTOM. Included by the `twitter_ads__conversion_fields` variable by default. Per-input source lineage: `conversion_custom_metric` is the value of source column `promoted_tweet_report.conversion_custom_metric`, added up over the source rows that share the mart row''s grain.'
    name: conversion_custom_metric
    type: bigint
  - description: 'The sale amount corresponding to PURCHASE conversion events. Included by the `twitter_ads__conversion_sale_amount_fields` variable by default. Per-input source lineage: `conversion_custom_sale_amount` is the value of source column `promoted_tweet_report.conversion_custom_sale_amount`, added up over the source rows that share the mart row''s grain.'
    name: conversion_custom_sale_amount
    type: float
  - description: 'Total number of purchases. The sum of post view, post engagement, and assisted purchases for both your website and mobile app. Included by the `twitter_ads__conversion_fields` variable by default. Per-input source lineage: `conversion_purchases_metric` is the value of source column `promoted_tweet_report.conversion_purchases_metric`, added up over the source rows that share the mart row''s grain.'
    name: conversion_purchases_metric
    type: bigint
  - description: 'The sale amount corresponding to PURCHASE conversion events. Included by the `twitter_ads__conversion_sale_amount_fields` variable by default. Per-input source lineage: `conversion_purchases_sale_amount` is the value of source column `promoted_tweet_report.conversion_purchases_sale_amount`, added up over the source rows that share the mart row''s grain.'
    name: conversion_purchases_sale_amount
    type: float
  - description: 'The impressions for the account on that day.  This is the number of users who see a Promoted Ad either in their home timeline or search results. Per-input source lineage: `impressions` is the value of source column `promoted_tweet_report.impressions`, added up over the source rows that share the mart row''s grain.'
    name: impressions
    type: bigint
  - description: 'The spend for the account on that day. Units: converted out of promoted_tweet_report.billed_charge_local_micro — each source value is divided by 1,000,000 and rounded to 2 decimal places, and those values are then added together, a source row with no value adding nothing to the total, and a mart row whose source rows all lack a value reports an empty total, not 0. Per-input source lineage: `billed_charge_local_micro` is the value of source column `promoted_tweet_report.billed_charge_local_micro`.'
    name: spend
    type: float
  - description: 'The spend (in micros) for the account on that day. Per-input source lineage: `spend_micro` is the value of source column `promoted_tweet_report.billed_charge_local_micro`, added up over the source rows that share the mart row''s grain.'
    name: spend_micro
    type: bigint
  - description: 'The url clicks for the account on that day. Per-input source lineage: `url_clicks` is the value of source column `promoted_tweet_report.url_clicks`, added up over the source rows that share the mart row''s grain.'
    name: url_clicks
    type: bigint
  description: 'Each record in this table represents the daily performance of ads at the account level, within a placement in Twitter.

