  transformation:
    steps:
    - description: Read source table engineering_year_level.
      operation: source
      order: 1
      source_inputs:
      - engineering_year_level
    - description: Read source table engineering_subject_list.
      operation: source
      order: 2
      source_inputs:
      - engineering_subject_list
    - carried_fields:
      - entity_key
      - entity_name
      description: Carry each year_level_id and its year_level_name into the measure-state calculation.
      operation: derive
      order: 3
      source_inputs:
      - engineering_year_level
    - carried_fields:
      - entity_key
      - entity_name
      - year_level_id
      condition:
        public_identifiers:
        - engineering_subject_list
        - year_level_id
        - entity_key
      description: Bring the linked engineering_subject_list rows into each engineering_year_level entity; retain an entity with no linked row so its absent state is visible.
      join_preservation: left
      operation: join
      order: 4
      source_inputs:
      - engineering_subject_list
    - carried_fields:
      - entity_key
      - entity_name
      description: 'Keep the present measure-state rows: a real engineering_subject_list row; subject_list_is_active is required on every such row.'
      operation: filter
      order: 5
    - carried_fields:
      - entity_key
      - entity_name
      - row_count
      - distinct_amount_count
      - total_amount
      - max_amount
      description: One row per engineering_year_level entity that has at least one row in the present measure state, and no row here for an entity with none, reporting row count, how many different subject_list_is_active values occur (each different value counted once, however many rows repeat it), total subject_list_is_active, and largest subject_list_is_active.
      operation: distinct
      order: 6
    - carried_fields:
      - entity_key
      - entity_name
      - row_count
      - distinct_amount_count
      - total_amount
      - max_amount
      - max_amount_share
      description: max_amount_share is max_amount divided by total_amount as a fraction, rounded to 4 decimal places; 0.0 when total_amount is 0.
      operation: ratio
      order: 7
      semantic_parameters:
        null_result: 0.0 when total_amount is 0
        rounding: ROUND to 4 decimal places
        units: fraction
    - carried_fields:
      - entity_key
      - measure_state
      - entity_name
      - row_count
      - distinct_amount_count
      - total_amount
      - max_amount
      - max_amount_share
      description: Label these measures as the present measure state.
      operation: derive
      order: 8
    - carried_fields:
      - entity_key
      - entity_name
      description: 'Keep the absent measure-state rows: the retained placeholder for a engineering_year_level row with no engineering_subject_list rows; no real row can enter this state because subject_list_is_active is required.'
      operation: filter
      order: 9
    - carried_fields:
      - entity_key
      - entity_name
      - row_count
      - distinct_amount_count
      - total_amount
      - max_amount
      description: One row per engineering_year_level entity with no linked engineering_subject_list row at all, whose retained placeholder is its one row in the absent measure state, and no row here for an entity that has a linked engineering_subject_list row, reporting a row count of 0, 0 different subject_list_is_active values, a total subject_list_is_active of 0 and a largest subject_list_is_active of 0.
      operation: distinct
      order: 10
    - carried_fields:
      - entity_key
      - entity_name
      - row_count
      - distinct_amount_count
      - total_amount
      - max_amount
      - max_amount_share
      description: max_amount_share is max_amount divided by total_amount as a fraction, rounded to 4 decimal places; 0.0 when total_amount is 0.
      operation: ratio
      order: 11
      semantic_parameters:
        null_result: 0.0 when total_amount is 0
        rounding: ROUND to 4 decimal places
        units: fraction
    - carried_fields:
      - entity_key
      - measure_state
      - entity_name
      - row_count
      - distinct_amount_count
      - total_amount
      - max_amount
      - max_amount_share
      description: Label these measures as the absent measure state.
      operation: derive
      order: 12
    - carried_fields:
      - entity_key
      - measure_state
      - entity_name
      - row_count
      - distinct_amount_count
      - total_amount
      - max_amount
      - max_amount_share
      description: 'Stack the present-state summary and the absent-state summary into one output list: every present-state row and every absent-state row is its own output row, an entity with rows in both states appears twice, once per state, and the two summaries are never matched to each other.'
      operation: union
      order: 13
      semantic_parameters:
        mode: all
    - carried_fields:
      - entity_key
      - measure_state
      description: 'Deterministic output order: entity, then measure state.'
      operation: tie_break
      order: 14
- columns:
  - description: Identifier of the engineering_topic row. One row per value.
    name: parent_key
    type: integer
  - description: topic_description of the engineering_topic row, copied unchanged.
    name: parent_name
    type: text
  - description: The largest courseware_date_added itself; 0 when the parent has no engineering_courseware rows.
    name: top_measure
    type: integer
  - description: How many engineering_courseware rows are tied at that largest courseware_date_added. 1 when exactly one row carries that largest courseware_date_added; 0 when there are no rows.
    name: tied_count
    type: bigint
  - description: 'Number of engineering_courseware rows for this engineering_topic row; 0 when there are none. An engineering_topic row kept with no engineering_courseware row reports 0 here, never 1: its placeholder holds no engineering_courseware row to count.'
    name: child_count
    type: bigint
  - description: Sum of courseware_date_added over all of them; 0 when the parent has no engineering_courseware rows.
    name: total_measure
    type: integer
  - description: The courseware_description of the engineering_courseware row with the LARGEST courseware_date_added for this engineering_topic row. Ties in courseware_date_added are broken by taking the SMALLEST courseware_description under a plain case-sensitive comparison of the stored text (the warehouse default order, in which every uppercase letter sorts before every lowercase one) — a row with no courseware_description value sorts after every labelled row; rows tied on both are resolved by the smallest courseware_id. The literal '(none)' when the parent has no engineering_courseware rows at all, and '(none)' when the winning row has no courseware_description value.
    name: top_label
    type: text
  - description: The courseware_id of that same extremal row — the winner under the SAME total order, so it is the identifier of a real engineering_courseware row whenever the parent has any. It is 0 when there are no rows, and only then. It identifies WHICH row won, so a tie resolved the wrong way is visible even when two rows share a label.
    name: top_row_id
    type: integer
  - description: top_measure divided by total_measure as a FRACTION between 0 and 1 (not a percentage), rounded to 4 decimals, 0.0 when total_measure is 0.
    name: top_measure_share
    type: float
  - description: '''empty'' when no row holds a maximum at all — the parent has no engineering_courseware rows — ''unique'' when exactly one row holds the maximum, ''tied'' when two or more do. Equivalently, tie_state follows tied_count: ''empty'' when tied_count is 0, ''unique'' when it is 1, ''tied'' when it is 2 or more.'
    name: tie_state
    type: text
  description: 'Per-engineering_topic extremes over linked engineering_courseware rows in the 605358_dbase_structure.sql schema: WHICH row is largest, not how large it is.'
  grain: One row per engineering_topic (topic_id), INCLUDING engineering_topic rows with no linked engineering_courseware rows.
  key_columns:
  - parent_key
  name: engineering_topic_engineering_courseware_top
