  - description: Number of unique subject_list_is_active values in this cell; each unique value is counted once, however many rows repeat it; 0 for a no-activity absent cell.
    name: distinct_amount_count
    type: bigint
  - description: Sum of subject_list_is_active in this cell; 0 for a no-activity absent cell.
    name: total_amount
    type: integer
  - description: Largest subject_list_is_active in this cell; 0 for a no-activity absent cell.
    name: max_amount
    type: integer
  - description: max_amount divided by total_amount as a fraction, rounded to 4 decimal places; 0.0 when total_amount is 0.
    name: max_amount_share
    type: float
