      source_inputs:
      - rendering_logs
    - carried_fields:
      - entity_key
      - entity_name
      condition:
        literal_values:
        - rendering time
      description: Keep rows whose performance_data belongs to the passing cohort values ['rendering time'].
      operation: filter
      order: 5
    - carried_fields:
      - entity_key
      - entity_name
      - link_count
      - distinct_status_count
      - total_amount
      - max_amount
      description: One row per rendering_settings entity that has at least one linked rendering_logs row in the passing cohort, reporting the number of those rows, how many different performance_data values occur among them, the total of their object_count, and their largest object_count. The total and the largest value read only the rows that carry an object_count value; a cohort whose rows all lack one reports 0 for both, never empty.
      operation: distinct
      order: 6
    - carried_fields:
