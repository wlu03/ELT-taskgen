  transformation:
    steps:
    - description: Read source table rendering_settings.
      operation: source
      order: 1
      source_inputs:
      - rendering_settings
    - description: Read source table rendering_logs.
      operation: source
      order: 2
      source_inputs:
      - rendering_logs
    - description: Read source table cameras.
      operation: source
      order: 3
      source_inputs:
      - cameras
    - carried_fields:
      - parent_key
      - parent_name
      description: One row per rendering_settings row, keyed by rendering_id.
      operation: derive
      order: 4
      source_inputs:
      - rendering_settings
    - carried_fields:
      - rendering_id
      condition:
        public_identifiers:
        - rendering_logs
        - rendering_id
        - parent_key
      description: 'Hop 1: bring in rendering_logs against the grain. One rendering_settings row may have many rendering_logs rows, and a rendering_settings row with no rendering_logs rows at all is RETAINED.'
      join_preservation: left
      operation: join
      order: 5
      source_inputs:
      - rendering_logs
    - carried_fields:
      - camera_id
      - camera_used
      condition:
        public_identifiers:
        - cameras
        - camera_id
      description: 'Hop 2: bring in cameras, matching each linked rendering_logs row''s camera_used to the camera_id of a cameras row. A rendering_logs row whose cameras row is missing still counts as a link and is RETAINED.'
      join_preservation: left
      operation: join
      order: 6
      source_inputs:
      - cameras
    - carried_fields:
      - parent_key
      - parent_name
      - link_count
      - distinct_child_count
      - active_link_count
      - total_amount
      - active_amount
      - max_amount
      description: 'One output row per parent_key, carrying parent_name beside the keys: a key value identifies one source row for the carried columns, so they take one value per key and never split a group, reporting link_count, distinct_child_count, active_link_count, total_amount, active_amount, max_amount for that row''s matching rows. A group with no qualifying rows still appears, reporting 0; a retained row with no matching rows has nothing to count, so its counts are 0, never 1.'
      operation: filtered_aggregate
      order: 7
    - carried_fields:
      - parent_key
      - parent_name
      - link_count
      - distinct_child_count
      - active_link_count
      - total_amount
      - active_amount
      - max_amount
      description: Name the mart columns; total_amount, active_amount, max_amount report their declared defaults — never NULL — for a group with no matching rows. For total_amount, active_amount, max_amount, the default also applies to a group none of whose real rows carries an input value.
      operation: derive
      order: 8
    - carried_fields:
      - parent_key
      - parent_name
      - link_count
      - distinct_child_count
      - active_link_count
      - total_amount
      - active_amount
      - max_amount
      - active_amount_ratio
      description: 'Guarded ratios: active_amount_ratio — active_amount divided by total_amount, expressed as a FRACTION between 0 and 1 (not a percentage), rounded to 4 decimal places, and reported as 0.0 when total_amount is 0.'
      operation: ratio
      order: 9
      semantic_parameters:
        null_result: 0.0 when the denominator is 0 or NULL
        rounding: ROUND to 4 decimal places
        units: fraction
    - carried_fields:
      - parent_key
      - parent_name
      - link_count
      - distinct_child_count
      - active_link_count
      - total_amount
      - active_amount
      - max_amount
      - active_amount_ratio
      - size_band
      description: 'size_band — Size band of link_count: ''none'' at exactly 0, ''small'' for 1-2 INCLUSIVE of 2, ''medium'' for 3-5 INCLUSIVE of 5, ''large'' above 5. Every value falls in exactly one band.'
      operation: conditional
      order: 10
      semantic_parameters:
        boundary: a value exactly at 2 is 'small'; a value exactly at 5 is 'medium'
    - carried_fields:
      - parent_key
      - parent_name
      - link_count
      - distinct_child_count
      - active_link_count
      - total_amount
      - active_amount
      - max_amount
      - active_amount_ratio
      - size_band
      - has_links
      description: has_links — 'yes' when this parent has at least one link, 'no' otherwise. Never NULL.
      operation: conditional
      order: 11
      semantic_parameters:
        boundary: a value exactly at 0 is 'no'
    - carried_fields:
      - parent_key
      description: 'Deterministic output order: sort by parent_key.'
      operation: tie_break
      order: 12
- columns:
  - description: Identifier of the rendering_settings row.
    name: entity_key
    type: integer
  - description: '''passing'' for performance_data values [''rendering time'']; ''failing'' for values [''memory usage'']; ''no_activity'' when the rendering_settings row has no linked rendering_logs row. A linked rendering_logs row whose performance_data has no value belongs to no cohort: it is not counted in any cell, and it does not make the rendering_settings row ''no_activity''.'
    name: cohort
    type: text
  - description: name of the rendering_settings row, copied unchanged.
    name: entity_name
    type: text
  - description: Number of rendering_logs rows in this entity/cohort cell.
    name: link_count
    type: bigint
  - description: Number of distinct performance_data values represented in this cell.
    name: distinct_status_count
    type: bigint
  - description: Sum of object_count in this cell; 0 for a no-activity cell that has no rows at all, and 0 when none of the cell's rows carries an object_count value.
    name: total_amount
    type: integer
  - description: Largest object_count in this cell; 0 for a no-activity cell that has no rows at all, and 0 when none of the cell's rows carries an object_count value.
    name: max_amount
    type: integer
  - description: max_amount divided by total_amount as a fraction, rounded to 4 decimal places; 0.0 when total_amount is 0.
    name: max_amount_share
    type: float
  description: Per-(rendering_settings, status cohort) summary of linked rendering_logs rows in the 3d_graphics_material_properties_and_rendering scenario, with passing and failing cohorts kept separate.
  grain: One row per (rendering_id, status cohort) pair represented among linked rendering_logs rows, plus one no-activity row for a rendering_settings row with no linked rendering_logs row at all. A rendering_settings row whose linked rendering_logs rows all lack a performance_data value is in no cohort and gets no no-activity row, so it has no row in this mart.
  key_columns:
  - entity_key
  - cohort
  name: rendering_settings_rendering_logs_cohorts
