models:
- columns:
  - description: Identifier of the rendering_settings row. One row per value.
    name: parent_key
    type: integer
  - description: name of the rendering_settings row, copied unchanged.
    name: parent_name
    type: text
  - description: Number of rendering_logs rows linked to this rendering_settings row. 0 when there are none.
    name: link_count
    type: bigint
  - description: Number of DISTINCT cameras rows reached through those links. Two links pointing at the same child count ONCE. 0 when there are no links. A link whose cameras row is missing reaches no cameras row and adds nothing to this count.
    name: distinct_child_count
    type: bigint
  - description: Number of linked rendering_logs rows whose performance_data is one of ['rendering time']. A parent whose links ALL fail that test reports 0, not a missing row.
    name: active_link_count
    type: bigint
  - description: Sum of object_count over every linked row; 0 when there are no links, and 0 when none of the linked rows carries a object_count value.
    name: total_amount
    type: integer
  - description: Sum of object_count over links whose performance_data is one of ['rendering time']; 0 when none qualify, and 0 when every qualifying row lacks a object_count value.
    name: active_amount
    type: integer
  - description: Largest object_count among the linked rows; 0 when there are no links, and 0 when none of the linked rows carries a object_count value.
    name: max_amount
    type: integer
  - description: active_amount divided by total_amount, expressed as a FRACTION between 0 and 1 (not a percentage), rounded to 4 decimal places, and reported as 0.0 when total_amount is 0.
    name: active_amount_ratio
    type: float
  - description: 'Size band of link_count: ''none'' at exactly 0, ''small'' for 1-2 INCLUSIVE of 2, ''medium'' for 3-5 INCLUSIVE of 5, ''large'' above 5. Every value falls in exactly one band.'
    name: size_band
    type: text
  - description: '''yes'' when this parent has at least one link, ''no'' otherwise. Never NULL.'
    name: has_links
    type: text
  description: Per-rendering_settings roll-up of linked rendering_logs activity in the 3d_graphics_material_properties_and_rendering scenario, including the fan-out onto cameras.
