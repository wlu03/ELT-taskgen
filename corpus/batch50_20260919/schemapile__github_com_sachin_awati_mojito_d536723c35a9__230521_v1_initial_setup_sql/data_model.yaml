models:
- columns:
  - description: Identifier of the user row. One row per value.
    name: parent_key
    type: bigint
  - description: common_name of the user row, copied unchanged.
    name: parent_name
    type: text
  - description: 'Number of translation_kit_text_unit rows for this user row; 0 when there are none. Every linked translation_kit_text_unit row counts, whether or not it carries a detected_language_probability value. An user row kept with no translation_kit_text_unit row reports 0 here, never 1: its placeholder holds no translation_kit_text_unit row to count.'
    name: event_count
    type: bigint
  - description: Sum of detected_language_probability over all matching translation_kit_text_unit rows; 0 when there are no rows and when none of those rows carries an detected_language_probability value; a row with no detected_language_probability value adds nothing, so a group with some values sums the values it has.
    name: lifetime_amount
    type: float
  - description: 'id of the row with the latest created_date; ties take the smallest id. It is 0 when there are no rows. Every translation_kit_text_unit row of the user row ranks, whether or not it carries a detected_language_probability value: the latest created_date wins even when that row''s detected_language_probability is missing.'
    name: latest_row_id
    type: bigint
  - description: detected_language_probability from that same latest row; 0 when there are no rows or when the winning value is missing.
    name: latest_amount
    type: float
  - description: detected_language from that same latest row; '(none)' when there are no rows or when the winning value is missing.
    name: latest_label
    type: text
  - description: latest_amount divided by lifetime_amount as a fraction, rounded to 4 decimal places; 0.0 when lifetime_amount is 0. The division uses latest_amount as this mart reports it, after its default of 0 for a winning row whose detected_language_probability is missing, so such a row gives 0.0.
    name: latest_amount_share
    type: float
