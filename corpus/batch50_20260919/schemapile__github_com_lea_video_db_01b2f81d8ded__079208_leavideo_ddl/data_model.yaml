models:
- columns:
  - description: Identifier of the picture row.
    name: entity_key
    type: integer
  - description: '''present'' for a linked video row; ''absent'' only for a picture row with no linked video row. lengthseconds is required on every real video row.'
    name: measure_state
    type: text
  - description: format of the picture row, copied unchanged.
    name: entity_name
    type: text
  - description: Number of linked video rows in this entity/state cell; 0 for a no-activity absent cell.
    name: row_count
    type: bigint
  - description: Number of unique lengthseconds values in this cell; each unique value is counted once, however many rows repeat it; 0 for a no-activity absent cell.
    name: distinct_amount_count
    type: bigint
  - description: Sum of lengthseconds in this cell; 0 for a no-activity absent cell.
    name: total_amount
    type: integer
  - description: Largest lengthseconds in this cell; 0 for a no-activity absent cell.
    name: max_amount
    type: integer
  - description: max_amount divided by total_amount as a fraction, rounded to 4 decimal places; 0.0 when total_amount is 0.
    name: max_amount_share
    type: float
  description: Per-(picture, measure state) distribution of linked video activity in the 079208_leavideo.ddl schema.
