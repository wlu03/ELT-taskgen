models:
- columns:
  - description: Identifier of the filmography_cast_members row. One row per value.
    name: parent_key
    type: text
  - description: biography of the filmography_cast_members row, copied unchanged.
    name: parent_name
    type: text
  - description: Number of DISTINCT filmography_details rows linked to this filmography_cast_members row. 0 when there are none. filmography_details declares no primary key upstream and byte-identical duplicate rows occur in the source; they count ONCE.
    name: link_count
    type: bigint
  - description: Number of DISTINCT composer_biographies rows reached through those links. Two links pointing at the same child count ONCE. 0 when there are no links. A link whose composer_biographies row is missing reaches no composer_biographies row and adds nothing to this count.
    name: distinct_child_count
    type: bigint
  - description: Number of linked filmography_details rows whose film_color is one of ['black-and-white'], each counted once even if the row repeats. A parent whose links ALL fail that test reports 0, not a missing row.
    name: active_link_count
    type: bigint
  - description: Sum of film_duration over every DISTINCT linked row; 0 when there are no links, and 0 when none of the linked rows carries a film_duration value.
    name: total_amount
    type: integer
  - description: Sum of film_duration over links whose film_color is one of ['black-and-white'], each counted once even if the row repeats; 0 when none qualify, and 0 when every qualifying row lacks a film_duration value.
    name: active_amount
    type: integer
  - description: Largest film_duration among the linked rows; 0 when there are no links, and 0 when none of the linked rows carries a film_duration value.
    name: max_amount
    type: integer
  - description: active_amount divided by total_amount, expressed as a FRACTION between 0 and 1 (not a percentage), rounded to 4 decimal places, and reported as 0.0 when total_amount is 0.
    name: active_amount_ratio
    type: float
  - description: 'Size band of link_count: ''none'' at exactly 0, ''small'' for 1-2 INCLUSIVE of 2, ''medium'' for 3-5 INCLUSIVE of 5, ''large'' above 5. Every value falls in exactly one band.'
    name: size_band
    type: text
  - description: '''yes'' when this parent has at least one link, ''no'' otherwise. Never NULL.'
    name: has_links
    type: text
  description: Per-filmography_cast_members roll-up of linked filmography_details rows in the ROGER_VINCENT_FILMOGRAPHY database, following the link on to composer_biographies.
  grain: One row per filmography_cast_members (actor_name), INCLUDING filmography_cast_members rows with no linked filmography_details rows.
  key_columns:
  - parent_key
  name: filmography_cast_members_filmography_details_rollup
  source_relationships:
  - child_columns:
    - cast_member
    child_table: filmography_details
    parent_columns:
    - actor_name
    parent_table: filmography_cast_members
    required: true
  - child_columns:
    - film_composer
    child_table: filmography_details
    parent_columns:
    - composer_name
    parent_table: composer_biographies
    required: false
  - child_columns:
    - film_director
    child_table: filmography_details
    parent_columns:
    - full_name
    parent_table: film_directors
    required: true
  - child_columns:
    - film_screenwriter
    child_table: filmography_details
    parent_columns:
    - full_name
    parent_table: film_industry_professionals
    required: false
  transformation:
    steps:
    - description: Read source table filmography_cast_members.
      operation: source
      order: 1
      source_inputs:
      - filmography_cast_members
    - description: Read source table filmography_details.
      operation: source
      order: 2
      source_inputs:
      - filmography_details
    - description: Read source table composer_biographies.
      operation: source
      order: 3
      source_inputs:
      - composer_biographies
    - carried_fields:
      - csfd_film_id
      - cast_member
      - film_composer
      - film_color
      - film_duration
      description: filmography_details declares no primary key upstream, so byte-identical duplicate rows can occur; every such row counts ONCE, however many copies arrive.
      operation: dedupe
      order: 4
      source_inputs:
      - filmography_details
    - carried_fields:
      - parent_key
      - parent_name
      description: One row per filmography_cast_members row, keyed by actor_name.
      operation: derive
      order: 5
      source_inputs:
      - filmography_cast_members
    - carried_fields:
      - cast_member
      - actor_name
      condition:
        public_identifiers:
        - filmography_details
        - cast_member
        - parent_key
      description: 'Hop 1: bring in filmography_details against the grain. One filmography_cast_members row may have many filmography_details rows, and a filmography_cast_members row with no filmography_details rows at all is RETAINED.'
      join_preservation: left
      operation: join
      order: 6
      source_inputs:
      - filmography_details
    - carried_fields:
      - composer_name
      - film_composer
      condition:
        public_identifiers:
        - composer_biographies
        - composer_name
      description: 'Hop 2: bring in composer_biographies, matching each linked filmography_details row''s film_composer to the composer_name of a composer_biographies row. A filmography_details row whose composer_biographies row is missing still counts as a link and is RETAINED.'
      join_preservation: left
      operation: join
      order: 7
      source_inputs:
      - composer_biographies
    - carried_fields:
      - parent_key
      - parent_name
      - link_count
      - distinct_child_count
      - active_link_count
      - total_amount
      - active_amount
      - max_amount
      description: 'One output row per parent_key, carrying parent_name beside the keys: a key value identifies one source row for the carried columns, so they take one value per key and never split a group, reporting link_count, distinct_child_count, active_link_count, total_amount, active_amount, max_amount for that row''s matching rows. A group with no qualifying rows still appears, reporting 0; a retained row with no matching rows has nothing to count, so its counts are 0, never 1.'
      operation: filtered_aggregate
      order: 8
    - carried_fields:
      - parent_key
      - parent_name
      - link_count
      - distinct_child_count
      - active_link_count
      - total_amount
      - active_amount
      - max_amount
      description: Name the mart columns; total_amount, active_amount, max_amount report their declared defaults — never NULL — for a group with no matching rows. For total_amount, active_amount, max_amount, the default also applies to a group none of whose real rows carries an input value.
      operation: derive
      order: 9
    - carried_fields:
      - parent_key
      - parent_name
      - link_count
      - distinct_child_count
      - active_link_count
      - total_amount
      - active_amount
      - max_amount
      - active_amount_ratio
      description: 'Guarded ratios: active_amount_ratio — active_amount divided by total_amount, expressed as a FRACTION between 0 and 1 (not a percentage), rounded to 4 decimal places, and reported as 0.0 when total_amount is 0.'
      operation: ratio
      order: 10
      semantic_parameters:
        null_result: 0.0 when the denominator is 0 or NULL
        rounding: ROUND to 4 decimal places
        units: fraction
    - carried_fields:
      - parent_key
      - parent_name
      - link_count
      - distinct_child_count
      - active_link_count
      - total_amount
      - active_amount
      - max_amount
      - active_amount_ratio
      - size_band
      description: 'size_band — Size band of link_count: ''none'' at exactly 0, ''small'' for 1-2 INCLUSIVE of 2, ''medium'' for 3-5 INCLUSIVE of 5, ''large'' above 5. Every value falls in exactly one band.'
      operation: conditional
      order: 11
      semantic_parameters:
        boundary: a value exactly at 2 is 'small'; a value exactly at 5 is 'medium'
    - carried_fields:
      - parent_key
      - parent_name
      - link_count
      - distinct_child_count
      - active_link_count
      - total_amount
      - active_amount
      - max_amount
      - active_amount_ratio
      - size_band
      - has_links
      description: has_links — 'yes' when this parent has at least one link, 'no' otherwise. Never NULL.
      operation: conditional
      order: 12
      semantic_parameters:
        boundary: a value exactly at 0 is 'no'
    - carried_fields:
      - parent_key
      description: 'Deterministic output order: sort by parent_key.'
      operation: tie_break
      order: 13
- columns:
  - description: Identifier of the filmography_cast_members row.
    name: entity_key
    type: text
  - description: '''passing'' for film_color values [''black-and-white'']; ''failing'' for values [''color'']; ''no_activity'' when the filmography_cast_members row has no linked filmography_details row. A linked filmography_details row whose film_color has no value belongs to no cohort: it is not counted in any cell, and it does not make the filmography_cast_members row ''no_activity''.'
    name: cohort
    type: text
  - description: biography of the filmography_cast_members row, copied unchanged.
    name: entity_name
    type: text
  - description: Number of filmography_details rows in this entity/cohort cell.
    name: link_count
    type: bigint
  - description: Number of distinct film_color values represented in this cell.
    name: distinct_status_count
    type: bigint
  - description: Sum of film_duration in this cell; 0 for a no-activity cell that has no rows at all, and 0 when none of the cell's rows carries an film_duration value.
    name: total_amount
    type: integer
  - description: Largest film_duration in this cell; 0 for a no-activity cell that has no rows at all, and 0 when none of the cell's rows carries an film_duration value.
    name: max_amount
    type: integer
  - description: max_amount divided by total_amount as a fraction, rounded to 4 decimal places; 0.0 when total_amount is 0.
    name: max_amount_share
    type: float
  description: Per-(filmography_cast_members, observed status cohort) summary of linked filmography_details rows in the ROGER_VINCENT_FILMOGRAPHY database.
  grain: One row per (actor_name, status cohort) pair represented among linked filmography_details rows, plus one no-activity row for a filmography_cast_members row with no linked filmography_details row at all. A filmography_cast_members row whose linked filmography_details rows all lack a film_color value is in no cohort and gets no no-activity row, so it has no row in this mart.
  key_columns:
  - entity_key
  - cohort
  name: filmography_cast_members_filmography_details_cohorts
  source_relationships:
  - child_columns:
    - cast_member
    child_table: filmography_details
    parent_columns:
    - actor_name
    parent_table: filmography_cast_members
    required: true
  - child_columns:
    - film_composer
    child_table: filmography_details
    parent_columns:
    - composer_name
    parent_table: composer_biographies
    required: false
  - child_columns:
    - film_director
    child_table: filmography_details
    parent_columns:
    - full_name
    parent_table: film_directors
    required: true
  - child_columns:
    - film_screenwriter
    child_table: filmography_details
    parent_columns:
    - full_name
    parent_table: film_industry_professionals
    required: false
  transformation:
    steps:
    - description: Read source table filmography_cast_members.
      operation: source
      order: 1
      source_inputs:
      - filmography_cast_members
    - description: Read source table filmography_details.
      operation: source
      order: 2
      source_inputs:
      - filmography_details
    - carried_fields:
      - entity_key
      - entity_name
      description: Carry each actor_name and its biography into the cohort calculation.
      operation: derive
      order: 3
      source_inputs:
      - filmography_cast_members
    - carried_fields:
      - entity_key
      - entity_name
      - actor_name
      - cast_member
      condition:
        public_identifiers:
        - filmography_details
        - cast_member
        - entity_key
      description: Bring the linked filmography_details rows into each filmography_cast_members entity before assigning status cohorts.
      join_preservation: left
      operation: join
      order: 4
      source_inputs:
      - filmography_details
    - carried_fields:
      - entity_key
      - entity_name
      condition:
        literal_values:
        - black-and-white
      description: Keep rows whose film_color belongs to the passing cohort values ['black-and-white'].
      operation: filter
      order: 5
    - carried_fields:
      - entity_key
      - entity_name
      - link_count
      - distinct_status_count
      - total_amount
      - max_amount
      description: One row per filmography_cast_members entity that has at least one linked filmography_details row in the passing cohort, reporting the number of those rows, how many different film_color values occur among them, the total of their film_duration, and their largest film_duration. The total and the largest value read only the rows that carry a film_duration value; a cohort whose rows all lack one reports 0 for both, never empty.
      operation: distinct
      order: 6
    - carried_fields:
      - entity_key
      - entity_name
      - link_count
      - distinct_status_count
      - total_amount
      - max_amount
      - max_amount_share
      description: max_amount_share is max_amount divided by total_amount as a fraction, rounded to 4 decimal places; 0.0 when total_amount is 0.
      operation: ratio
      order: 7
      semantic_parameters:
        null_result: 0.0 when total_amount is 0
        rounding: ROUND to 4 decimal places
        units: fraction
    - carried_fields:
      - entity_key
      - cohort
      - entity_name
      - link_count
      - distinct_status_count
      - total_amount
      - max_amount
      - max_amount_share
      description: Label these measures as the passing cohort.
      operation: derive
      order: 8
    - carried_fields:
      - entity_key
      - entity_name
      condition:
        literal_values:
        - color
      description: Keep rows whose film_color belongs to the failing cohort values ['color'].
      operation: filter
      order: 9
    - carried_fields:
      - entity_key
      - entity_name
      - link_count
      - distinct_status_count
      - total_amount
      - max_amount
      description: One row per filmography_cast_members entity that has at least one linked filmography_details row in the failing cohort, reporting the number of those rows, how many different film_color values occur among them, the total of their film_duration, and their largest film_duration. The total and the largest value read only the rows that carry a film_duration value; a cohort whose rows all lack one reports 0 for both, never empty.
      operation: distinct
      order: 10
    - carried_fields:
      - entity_key
      - entity_name
      - link_count
      - distinct_status_count
      - total_amount
      - max_amount
      - max_amount_share
      description: max_amount_share is max_amount divided by total_amount as a fraction, rounded to 4 decimal places; 0.0 when total_amount is 0.
      operation: ratio
      order: 11
      semantic_parameters:
        null_result: 0.0 when total_amount is 0
        rounding: ROUND to 4 decimal places
        units: fraction
    - carried_fields:
      - entity_key
      - cohort
      - entity_name
      - link_count
      - distinct_status_count
      - total_amount
      - max_amount
      - max_amount_share
      description: Label these measures as the failing cohort.
      operation: derive
      order: 12
    - carried_fields:
      - entity_key
      - entity_name
      description: Keep the placeholder row for a filmography_cast_members entity with no linked filmography_details row at all; a filmography_cast_members entity that has linked filmography_details rows gets no placeholder, even when every one of those rows lacks a film_color value.
      operation: filter
      order: 13
    - carried_fields:
      - entity_key
      - entity_name
      - link_count
      - distinct_status_count
      - total_amount
      - max_amount
      description: One row per filmography_cast_members entity with no linked filmography_details row at all, reporting 0 rows, 0 different film_color values, a film_duration total of 0 and a largest film_duration of 0.
      operation: distinct
      order: 14
    - carried_fields:
      - entity_key
      - entity_name
      - link_count
      - distinct_status_count
      - total_amount
      - max_amount
      - max_amount_share
      description: max_amount_share is max_amount divided by total_amount as a fraction, rounded to 4 decimal places; 0.0 when total_amount is 0.
      operation: ratio
      order: 15
      semantic_parameters:
        null_result: 0.0 when total_amount is 0
        rounding: ROUND to 4 decimal places
        units: fraction
    - carried_fields:
      - entity_key
      - cohort
      - entity_name
      - link_count
      - distinct_status_count
      - total_amount
      - max_amount
      - max_amount_share
      description: Label these measures as the no_activity cohort.
      operation: derive
      order: 16
    - carried_fields:
      - entity_key
      - cohort
      - entity_name
      - link_count
      - distinct_status_count
      - total_amount
      - max_amount
      - max_amount_share
      description: Combine the disjoint passing and failing cohort summaries.
      operation: union
      order: 17
      semantic_parameters:
        mode: all
    - carried_fields:
      - entity_key
      - cohort
      - entity_name
      - link_count
      - distinct_status_count
      - total_amount
      - max_amount
      - max_amount_share
      description: Add the no-activity summaries, so an entity with no linked rows is retained as one explicit cohort row.
      operation: union
      order: 18
      semantic_parameters:
        mode: all
    - carried_fields:
      - entity_key
      - cohort
      description: 'Deterministic output order: entity, then cohort.'
      operation: tie_break
      order: 19
