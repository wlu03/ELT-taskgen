models:
- columns:
  - description: Identifier of the users row. One row per value.
    name: parent_key
    type: integer
  - description: user_name of the users row, copied unchanged.
    name: parent_name
    type: text
  - description: Number of user_actions rows linked to this users row. 0 when there are none.
    name: link_count
    type: bigint
  - description: Number of DISTINCT scenes rows reached through those links. Two links pointing at the same child count ONCE. 0 when there are no links. A link whose scenes row is missing reaches no scenes row and adds nothing to this count.
    name: distinct_child_count
    type: bigint
  - description: Number of linked user_actions rows whose action_type is one of ['create']. A parent whose links ALL fail that test reports 0, not a missing row.
    name: active_link_count
    type: bigint
  - description: Sum of object_id over every linked row; 0 when there are no links, and 0 when none of the linked rows carries a object_id value.
    name: total_amount
    type: integer
  - description: Sum of object_id over links whose action_type is one of ['create']; 0 when none qualify, and 0 when every qualifying row lacks a object_id value.
    name: active_amount
    type: integer
  - description: Largest object_id among the linked rows; 0 when there are no links, and 0 when none of the linked rows carries a object_id value.
    name: max_amount
    type: integer
  - description: active_amount divided by total_amount, expressed as a FRACTION between 0 and 1 (not a percentage), rounded to 4 decimal places, and reported as 0.0 when total_amount is 0.
    name: active_amount_ratio
    type: float
  - description: 'Size band of link_count: ''none'' at exactly 0, ''small'' for 1-2 INCLUSIVE of 2, ''medium'' for 3-5 INCLUSIVE of 5, ''large'' above 5. Every value falls in exactly one band.'
    name: size_band
    type: text
  - description: '''yes'' when this parent has at least one link, ''no'' otherwise. Never NULL.'
    name: has_links
    type: text
  description: Per-users roll-up of linked user_actions activity in the 3d_object_positioning_and_animation_data scenario, including the fan-out onto scenes.
  grain: One row per users (user_id), INCLUDING users rows with no linked user_actions rows.
  key_columns:
  - parent_key
  name: users_user_actions_rollup
  source_relationships:
  - child_columns:
    - created_by
    child_table: animation_types
    parent_columns:
    - user_id
    parent_table: users
    required: false
  - child_columns:
    - updated_by
    child_table: animation_types
    parent_columns:
    - user_id
    parent_table: users
    required: false
  - child_columns:
    - created_by
    child_table: object_versions
    parent_columns:
    - user_id
    parent_table: users
    required: false
  - child_columns:
    - created_by
    child_table: scene_objects
    parent_columns:
    - user_id
    parent_table: users
    required: false
  - child_columns:
    - scene_id
    child_table: scene_objects
    parent_columns:
    - scene_id
    parent_table: scenes
    required: false
  - child_columns:
    - updated_by
    child_table: scene_objects
    parent_columns:
    - user_id
    parent_table: users
    required: false
  - child_columns:
    - created_by
    child_table: scenes
    parent_columns:
    - user_id
    parent_table: users
    required: false
  - child_columns:
    - updated_by
    child_table: scenes
    parent_columns:
    - user_id
    parent_table: users
    required: false
  - child_columns:
    - scene_id
    child_table: user_actions
    parent_columns:
    - scene_id
    parent_table: scenes
    required: false
  - child_columns:
    - user_id
    child_table: user_actions
    parent_columns:
    - user_id
    parent_table: users
    required: false
  transformation:
    steps:
    - description: Read source table users.
      operation: source
      order: 1
      source_inputs:
      - users
    - description: Read source table user_actions.
      operation: source
      order: 2
      source_inputs:
      - user_actions
    - description: Read source table scenes.
      operation: source
      order: 3
      source_inputs:
      - scenes
    - carried_fields:
      - parent_key
      - parent_name
      description: One row per users row, keyed by user_id.
      operation: derive
      order: 4
      source_inputs:
      - users
    - carried_fields:
      - user_id
      condition:
        public_identifiers:
        - user_actions
        - user_id
        - parent_key
      description: 'Hop 1: bring in user_actions against the grain. One users row may have many user_actions rows, and a users row with no user_actions rows at all is RETAINED.'
      join_preservation: left
      operation: join
      order: 5
      source_inputs:
      - user_actions
    - carried_fields:
      - scene_id
      condition:
        public_identifiers:
        - scenes
        - scene_id
      description: 'Hop 2: bring in scenes, matching each linked user_actions row''s scene_id to the scene_id of a scenes row. A user_actions row whose scenes row is missing still counts as a link and is RETAINED.'
      join_preservation: left
      operation: join
      order: 6
      source_inputs:
      - scenes
    - carried_fields:
      - parent_key
      - parent_name
      - link_count
      - distinct_child_count
      - active_link_count
      - total_amount
      - active_amount
      - max_amount
      description: 'One output row per parent_key, carrying parent_name beside the keys: a key value identifies one source row for the carried columns, so they take one value per key and never split a group, reporting link_count, distinct_child_count, active_link_count, total_amount, active_amount, max_amount for that row''s matching rows. A group with no qualifying rows still appears, reporting 0; a retained row with no matching rows has nothing to count, so its counts are 0, never 1.'
      operation: filtered_aggregate
      order: 7
    - carried_fields:
      - parent_key
      - parent_name
      - link_count
      - distinct_child_count
      - active_link_count
      - total_amount
      - active_amount
      - max_amount
      description: Name the mart columns; total_amount, active_amount, max_amount report their declared defaults — never NULL — for a group with no matching rows. For total_amount, active_amount, max_amount, the default also applies to a group none of whose real rows carries an input value.
      operation: derive
      order: 8
    - carried_fields:
      - parent_key
      - parent_name
      - link_count
      - distinct_child_count
      - active_link_count
      - total_amount
      - active_amount
      - max_amount
      - active_amount_ratio
      description: 'Guarded ratios: active_amount_ratio — active_amount divided by total_amount, expressed as a FRACTION between 0 and 1 (not a percentage), rounded to 4 decimal places, and reported as 0.0 when total_amount is 0.'
      operation: ratio
      order: 9
      semantic_parameters:
        null_result: 0.0 when the denominator is 0 or NULL
        rounding: ROUND to 4 decimal places
        units: fraction
    - carried_fields:
      - parent_key
      - parent_name
      - link_count
      - distinct_child_count
      - active_link_count
      - total_amount
      - active_amount
      - max_amount
      - active_amount_ratio
      - size_band
      description: 'size_band — Size band of link_count: ''none'' at exactly 0, ''small'' for 1-2 INCLUSIVE of 2, ''medium'' for 3-5 INCLUSIVE of 5, ''large'' above 5. Every value falls in exactly one band.'
      operation: conditional
      order: 10
      semantic_parameters:
        boundary: a value exactly at 2 is 'small'; a value exactly at 5 is 'medium'
    - carried_fields:
      - parent_key
      - parent_name
      - link_count
      - distinct_child_count
      - active_link_count
      - total_amount
      - active_amount
      - max_amount
      - active_amount_ratio
      - size_band
      - has_links
      description: has_links — 'yes' when this parent has at least one link, 'no' otherwise. Never NULL.
      operation: conditional
      order: 11
      semantic_parameters:
        boundary: a value exactly at 0 is 'no'
    - carried_fields:
      - parent_key
      description: 'Deterministic output order: sort by parent_key.'
      operation: tie_break
      order: 12
- columns:
  - description: Identifier of the users row.
    name: entity_key
    type: integer
  - description: '''passing'' for action_type values [''create'']; ''failing'' for values [''update'', ''delete'']; ''no_activity'' when the users row has no linked user_actions row. A linked user_actions row whose action_type has no value belongs to no cohort: it is not counted in any cell, and it does not make the users row ''no_activity''.'
    name: cohort
    type: text
  - description: user_name of the users row, copied unchanged.
    name: entity_name
    type: text
  - description: Number of user_actions rows in this entity/cohort cell.
    name: link_count
    type: bigint
  - description: Number of distinct action_type values represented in this cell.
    name: distinct_status_count
    type: bigint
  - description: Sum of object_id in this cell; 0 for a no-activity cell that has no rows at all, and 0 when none of the cell's rows carries an object_id value.
    name: total_amount
    type: integer
  - description: Largest object_id in this cell; 0 for a no-activity cell that has no rows at all, and 0 when none of the cell's rows carries an object_id value.
    name: max_amount
    type: integer
  - description: max_amount divided by total_amount as a fraction, rounded to 4 decimal places; 0.0 when total_amount is 0.
    name: max_amount_share
    type: float
  description: Per-(users, status cohort) summary of linked user_actions rows in the 3d_object_positioning_and_animation_data scenario, with passing and failing cohorts kept separate.
  grain: One row per (user_id, status cohort) pair represented among linked user_actions rows, plus one no-activity row for a users row with no linked user_actions row at all. A users row whose linked user_actions rows all lack a action_type value is in no cohort and gets no no-activity row, so it has no row in this mart.
  key_columns:
  - entity_key
  - cohort
  name: users_user_actions_cohorts
  source_relationships:
  - child_columns:
    - created_by
    child_table: animation_types
    parent_columns:
    - user_id
    parent_table: users
    required: false
  - child_columns:
    - updated_by
    child_table: animation_types
    parent_columns:
    - user_id
    parent_table: users
    required: false
  - child_columns:
    - created_by
    child_table: object_versions
    parent_columns:
    - user_id
    parent_table: users
    required: false
  - child_columns:
    - created_by
    child_table: scene_objects
    parent_columns:
    - user_id
    parent_table: users
    required: false
  - child_columns:
    - scene_id
    child_table: scene_objects
    parent_columns:
    - scene_id
    parent_table: scenes
    required: false
  - child_columns:
    - updated_by
    child_table: scene_objects
    parent_columns:
    - user_id
    parent_table: users
    required: false
  - child_columns:
    - created_by
    child_table: scenes
    parent_columns:
    - user_id
    parent_table: users
    required: false
  - child_columns:
    - updated_by
    child_table: scenes
    parent_columns:
    - user_id
    parent_table: users
    required: false
  - child_columns:
    - scene_id
    child_table: user_actions
    parent_columns:
    - scene_id
    parent_table: scenes
    required: false
  - child_columns:
    - user_id
    child_table: user_actions
    parent_columns:
    - user_id
    parent_table: users
    required: false
  transformation:
    steps:
    - description: Read source table users.
      operation: source
      order: 1
      source_inputs:
      - users
    - description: Read source table user_actions.
      operation: source
      order: 2
      source_inputs:
      - user_actions
    - carried_fields:
      - entity_key
      - entity_name
      description: Carry each user_id and its user_name into the cohort calculation.
      operation: derive
      order: 3
      source_inputs:
      - users
    - carried_fields:
      - entity_key
      - entity_name
      - user_id
      condition:
        public_identifiers:
        - user_actions
        - user_id
        - entity_key
      description: Bring the linked user_actions rows into each users entity before assigning status cohorts.
      join_preservation: left
      operation: join
      order: 4
      source_inputs:
      - user_actions
    - carried_fields:
      - entity_key
      - entity_name
      condition:
        literal_values:
        - create
      description: Keep rows whose action_type belongs to the passing cohort values ['create'].
      operation: filter
      order: 5
    - carried_fields:
      - entity_key
      - entity_name
      - link_count
      - distinct_status_count
      - total_amount
      - max_amount
      description: One row per users entity that has at least one linked user_actions row in the passing cohort, reporting the number of those rows, how many different action_type values occur among them, the total of their object_id, and their largest object_id. The total and the largest value read only the rows that carry an object_id value; a cohort whose rows all lack one reports 0 for both, never empty.
      operation: distinct
      order: 6
    - carried_fields:
      - entity_key
      - entity_name
      - link_count
      - distinct_status_count
      - total_amount
      - max_amount
      - max_amount_share
      description: max_amount_share is max_amount divided by total_amount as a fraction, rounded to 4 decimal places; 0.0 when total_amount is 0.
      operation: ratio
      order: 7
      semantic_parameters:
        null_result: 0.0 when total_amount is 0
        rounding: ROUND to 4 decimal places
        units: fraction
    - carried_fields:
      - entity_key
      - cohort
      - entity_name
      - link_count
      - distinct_status_count
      - total_amount
      - max_amount
      - max_amount_share
      description: Label these measures as the passing cohort.
      operation: derive
      order: 8
    - carried_fields:
      - entity_key
      - entity_name
      condition:
        literal_values:
        - update
        - delete
      description: Keep rows whose action_type belongs to the failing cohort values ['update', 'delete'].
      operation: filter
      order: 9
    - carried_fields:
      - entity_key
      - entity_name
      - link_count
      - distinct_status_count
      - total_amount
      - max_amount
      description: One row per users entity that has at least one linked user_actions row in the failing cohort, reporting the number of those rows, how many different action_type values occur among them, the total of their object_id, and their largest object_id. The total and the largest value read only the rows that carry an object_id value; a cohort whose rows all lack one reports 0 for both, never empty.
      operation: distinct
      order: 10
    - carried_fields:
      - entity_key
      - entity_name
      - link_count
      - distinct_status_count
      - total_amount
      - max_amount
      - max_amount_share
      description: max_amount_share is max_amount divided by total_amount as a fraction, rounded to 4 decimal places; 0.0 when total_amount is 0.
      operation: ratio
      order: 11
      semantic_parameters:
        null_result: 0.0 when total_amount is 0
        rounding: ROUND to 4 decimal places
        units: fraction
    - carried_fields:
      - entity_key
      - cohort
      - entity_name
      - link_count
      - distinct_status_count
      - total_amount
      - max_amount
      - max_amount_share
      description: Label these measures as the failing cohort.
      operation: derive
      order: 12
    - carried_fields:
      - entity_key
      - entity_name
      description: Keep the placeholder row for a users entity with no linked user_actions row at all; a users entity that has linked user_actions rows gets no placeholder, even when every one of those rows lacks a action_type value.
      operation: filter
      order: 13
    - carried_fields:
      - entity_key
      - entity_name
      - link_count
      - distinct_status_count
      - total_amount
      - max_amount
      description: One row per users entity with no linked user_actions row at all, reporting 0 rows, 0 different action_type values, a object_id total of 0 and a largest object_id of 0.
      operation: distinct
      order: 14
    - carried_fields:
      - entity_key
      - entity_name
      - link_count
      - distinct_status_count
      - total_amount
      - max_amount
      - max_amount_share
      description: max_amount_share is max_amount divided by total_amount as a fraction, rounded to 4 decimal places; 0.0 when total_amount is 0.
      operation: ratio
      order: 15
      semantic_parameters:
        null_result: 0.0 when total_amount is 0
        rounding: ROUND to 4 decimal places
        units: fraction
    - carried_fields:
      - entity_key
      - cohort
      - entity_name
      - link_count
      - distinct_status_count
      - total_amount
      - max_amount
      - max_amount_share
      description: Label these measures as the no_activity cohort.
      operation: derive
      order: 16
    - carried_fields:
      - entity_key
      - cohort
      - entity_name
      - link_count
      - distinct_status_count
      - total_amount
      - max_amount
      - max_amount_share
      description: Combine the disjoint passing and failing cohort summaries.
      operation: union
      order: 17
      semantic_parameters:
        mode: all
    - carried_fields:
      - entity_key
      - cohort
      - entity_name
      - link_count
      - distinct_status_count
      - total_amount
      - max_amount
      - max_amount_share
      description: Add the no-activity summaries, so an entity with no linked rows is retained as one explicit cohort row.
      operation: union
      order: 18
      semantic_parameters:
        mode: all
    - carried_fields:
      - entity_key
      - cohort
      description: 'Deterministic output order: entity, then cohort.'
      operation: tie_break
      order: 19
