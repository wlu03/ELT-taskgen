      - entity_name
      description: Carry each id and its auth into the measure-state calculation.
      operation: derive
      order: 3
      source_inputs:
      - teams
    - carried_fields:
      - entity_key
      - entity_name
      - id
      - team_id
      condition:
        public_identifiers:
        - workers
        - team_id
        - entity_key
      description: Bring the linked workers rows into each teams entity; retain an entity with no linked row so its absent state is visible.
      join_preservation: left
      operation: join
      order: 4
      source_inputs:
      - workers
    - carried_fields:
      - entity_key
      - entity_name
      description: 'Keep the present measure-state rows: a real workers row whose active_containers has a value.'
      operation: filter
      order: 5
    - carried_fields:
      - entity_key
      - entity_name
      - row_count
      - distinct_amount_count
      - total_amount
      - max_amount
      description: One row per teams entity that has at least one row in the present measure state, and no row here for an entity with none, reporting row count, how many different non-missing active_containers values occur (each different value counted once, however many rows repeat it), total active_containers, and largest active_containers.
      operation: distinct
      order: 6
    - carried_fields:
      - entity_key
      - entity_name
      - row_count
      - distinct_amount_count
      - total_amount
      - max_amount
