- columns:
  - description: Identifier of the resources row. One row per value.
    name: parent_key
    type: integer
  - description: check_error of the resources row, copied unchanged.
    name: parent_name
    type: text
  - description: The largest check_order itself; 0 when the parent has no versioned_resources rows.
    name: top_measure
    type: integer
  - description: How many versioned_resources rows are tied at that largest check_order. 1 when exactly one row carries that largest check_order; 0 when there are no rows.
    name: tied_count
    type: bigint
  - description: 'Number of versioned_resources rows for this resources row; 0 when there are none. A resources row kept with no versioned_resources row reports 0 here, never 1: its placeholder holds no versioned_resources row to count.'
    name: child_count
    type: bigint
  - description: Sum of check_order over all of them; 0 when the parent has no versioned_resources rows.
    name: total_measure
    type: integer
  - description: The metadata of the versioned_resources row with the LARGEST check_order for this resources row. Ties in check_order are broken by taking the SMALLEST metadata under a plain case-sensitive comparison of the stored text (the warehouse default order, in which every uppercase letter sorts before every lowercase one); rows tied on both are resolved by the smallest id. The literal '(none)' when the parent has no versioned_resources rows at all.
    name: top_label
    type: text
  - description: The id of that same extremal row — the winner under the SAME total order, so it is the identifier of a real versioned_resources row whenever the parent has any. It is 0 when there are no rows, and only then. It identifies WHICH row won, so a tie resolved the wrong way is visible even when two rows share a label.
    name: top_row_id
    type: integer
  - description: top_measure divided by total_measure as a FRACTION between 0 and 1 (not a percentage), rounded to 4 decimals, 0.0 when total_measure is 0.
    name: top_measure_share
    type: float
  - description: '''empty'' when no row holds a maximum at all — the parent has no versioned_resources rows — ''unique'' when exactly one row holds the maximum, ''tied'' when two or more do. Equivalently, tie_state follows tied_count: ''empty'' when tied_count is 0, ''unique'' when it is 1, ''tied'' when it is 2 or more.'
    name: tie_state
    type: text
  description: 'Per-resources extremes over linked versioned_resources rows in the 402976_1510262030_initial_schema.up.sql schema: WHICH row is largest, not how large it is.'
