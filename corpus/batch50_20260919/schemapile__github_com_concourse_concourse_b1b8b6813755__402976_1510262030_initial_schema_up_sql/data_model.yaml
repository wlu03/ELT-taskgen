  - description: Identifier of the workers row. One row per value.
    name: parent_key
    type: text
  - description: addr of the workers row, copied unchanged.
    name: parent_name
    type: text
  - description: 'Number of containers rows for this workers row; 0 when there are none. Every linked containers row counts, whether or not it carries an image_check_container_id value. A workers row kept with no containers row reports 0 here, never 1: its placeholder holds no containers row to count.'
    name: event_count
    type: bigint
  - description: Sum of image_check_container_id over all matching containers rows; 0 when there are no rows and when none of those rows carries an image_check_container_id value; a row with no image_check_container_id value adds nothing, so a group with some values sums the values it has.
    name: lifetime_amount
    type: integer
  - description: 'id of the row with the latest best_if_used_by; ties take the smallest id. It is 0 when there are no rows. Every containers row of the workers row ranks, whether or not it carries a image_check_container_id value: the latest best_if_used_by wins even when that row''s image_check_container_id is missing.'
    name: latest_row_id
    type: integer
  - description: image_check_container_id from that same latest row; 0 when there are no rows or when the winning value is missing.
    name: latest_amount
    type: integer
  - description: handle from that same latest row; '(none)' when there are no rows.
    name: latest_label
    type: text
  - description: latest_amount divided by lifetime_amount as a fraction, rounded to 4 decimal places; 0.0 when lifetime_amount is 0. The division uses latest_amount as this mart reports it, after its default of 0 for a winning row whose image_check_container_id is missing, so such a row gives 0.0.
    name: latest_amount_share
    type: float
  description: Per-workers latest-row snapshot over linked containers activity in the 402976_1510262030_initial_schema.up.sql schema.
