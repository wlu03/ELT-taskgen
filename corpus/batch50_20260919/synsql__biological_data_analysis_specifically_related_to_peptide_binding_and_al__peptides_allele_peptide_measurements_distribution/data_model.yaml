models:
- columns:
  - description: Identifier of the peptides row.
    name: entity_key
    type: integer
  - description: '''present'' for a linked allele_peptide_measurements row whose measurement_value has a value; ''absent'' when measurement_value is missing, including a peptides row with no linked allele_peptide_measurements row. A linked allele_peptide_measurements row whose measurement_value has a value belongs only to the present state and never to the absent state.'
    name: measure_state
    type: text
  - description: sequence of the peptides row, copied unchanged.
    name: entity_name
    type: text
  - description: Number of linked allele_peptide_measurements rows in this entity/state cell; an absent cell holding real allele_peptide_measurements rows whose measurement_value is missing COUNTS those rows, and only the placeholder cell of a peptides row with no linked allele_peptide_measurements row at all reports 0.
    name: row_count
    type: bigint
  - description: Number of unique non-missing measurement_value values in this cell; each unique non-missing value is counted once, however many rows repeat it; 0 whenever the cell holds no measurement_value value at all — both for a peptides row with no linked allele_peptide_measurements row and for an absent cell whose rows all have a missing measurement_value.
    name: distinct_amount_count
    type: bigint
  - description: Sum of measurement_value in this cell; 0 for a no-activity cell that has no rows at all, and 0 when none of the cell's rows carries an measurement_value value.
    name: total_amount
    type: integer
  - description: Largest measurement_value in this cell; 0 for a no-activity cell that has no rows at all, and 0 when none of the cell's rows carries an measurement_value value.
    name: max_amount
    type: integer
  - description: max_amount divided by total_amount as a fraction, rounded to 4 decimal places; 0.0 when total_amount is 0.
    name: max_amount_share
    type: float
  description: Per-(peptides, measure state) distribution of linked allele_peptide_measurements rows in the __biological_data_analysis_specifically_related_to_peptide_binding_and_al scenario.
  grain: One row per (peptide_id, measure state) pair represented among linked allele_peptide_measurements rows; the absent state includes missing measurement_value values and a no-activity row for a peptides row with no links. A linked allele_peptide_measurements row whose measurement_value has a value belongs only to the present state and never to the absent state.
  key_columns:
  - entity_key
  - measure_state
  name: peptides_allele_peptide_measurements_distribution
  source_relationships:
  - child_columns:
    - allele_id
    child_table: allele_peptide_measurements
    parent_columns:
    - allele_id
    parent_table: alleles
    required: false
  - child_columns:
    - measurement_source_id
    child_table: allele_peptide_measurements
    parent_columns:
    - source_id
    parent_table: measurement_sources
    required: false
  - child_columns:
    - original_allele_id
    child_table: allele_peptide_measurements
    parent_columns:
    - allele_id
    parent_table: alleles
    required: false
  - child_columns:
    - peptide_id
    child_table: allele_peptide_measurements
    parent_columns:
    - peptide_id
    parent_table: peptides
    required: false
  transformation:
    steps:
    - description: Read source table peptides.
      operation: source
      order: 1
      source_inputs:
      - peptides
    - description: Read source table allele_peptide_measurements.
      operation: source
      order: 2
      source_inputs:
      - allele_peptide_measurements
    - carried_fields:
      - entity_key
      - entity_name
      description: Carry each peptide_id and its sequence into the measure-state calculation.
      operation: derive
      order: 3
      source_inputs:
      - peptides
    - carried_fields:
      - entity_key
      - entity_name
      - peptide_id
      condition:
        public_identifiers:
        - allele_peptide_measurements
        - peptide_id
        - entity_key
      description: Bring the linked allele_peptide_measurements rows into each peptides entity; retain an entity with no linked row so its absent state is visible.
      join_preservation: left
      operation: join
      order: 4
      source_inputs:
      - allele_peptide_measurements
    - carried_fields:
      - entity_key
      - entity_name
      description: 'Keep the present measure-state rows: a real allele_peptide_measurements row whose measurement_value has a value.'
      operation: filter
      order: 5
    - carried_fields:
      - entity_key
      - entity_name
      - row_count
      - distinct_amount_count
      - total_amount
      - max_amount
      description: One row per peptides entity that has at least one row in the present measure state, and no row here for an entity with none, reporting row count, how many different non-missing measurement_value values occur (each different value counted once, however many rows repeat it), total measurement_value, and largest measurement_value.
      operation: distinct
      order: 6
    - carried_fields:
      - entity_key
      - entity_name
      - row_count
      - distinct_amount_count
      - total_amount
      - max_amount
      - max_amount_share
      description: max_amount_share is max_amount divided by total_amount as a fraction, rounded to 4 decimal places; 0.0 when total_amount is 0.
      operation: ratio
      order: 7
      semantic_parameters:
        null_result: 0.0 when total_amount is 0
        rounding: ROUND to 4 decimal places
        units: fraction
    - carried_fields:
      - entity_key
      - measure_state
      - entity_name
      - row_count
      - distinct_amount_count
      - total_amount
      - max_amount
      - max_amount_share
      description: Label these measures as the present measure state.
      operation: derive
      order: 8
    - carried_fields:
      - entity_key
      - entity_name
      description: 'Keep the absent measure-state rows: measurement_value is missing, including the retained placeholder for a peptides row with no allele_peptide_measurements rows. A real allele_peptide_measurements row whose measurement_value has a value belongs only to the present state and never to this absent state.'
      operation: filter
      order: 9
    - carried_fields:
      - entity_key
      - entity_name
      - row_count
      - distinct_amount_count
      - total_amount
      - max_amount
      description: One row per peptides entity that has at least one row in the absent measure state, and no row here for an entity with none, reporting row count, how many different non-missing measurement_value values occur (each different value counted once, however many rows repeat it), total measurement_value, and largest measurement_value.
      operation: distinct
      order: 10
    - carried_fields:
      - entity_key
      - entity_name
      - row_count
      - distinct_amount_count
      - total_amount
      - max_amount
      - max_amount_share
      description: max_amount_share is max_amount divided by total_amount as a fraction, rounded to 4 decimal places; 0.0 when total_amount is 0.
      operation: ratio
      order: 11
      semantic_parameters:
        null_result: 0.0 when total_amount is 0
        rounding: ROUND to 4 decimal places
        units: fraction
    - carried_fields:
      - entity_key
      - measure_state
      - entity_name
      - row_count
      - distinct_amount_count
      - total_amount
      - max_amount
      - max_amount_share
      description: Label these measures as the absent measure state.
      operation: derive
      order: 12
    - carried_fields:
      - entity_key
      - measure_state
      - entity_name
      - row_count
      - distinct_amount_count
      - total_amount
      - max_amount
      - max_amount_share
      description: 'Stack the present-state summary and the absent-state summary into one output list: every present-state row and every absent-state row is its own output row, an entity with rows in both states appears twice, once per state, and the two summaries are never matched to each other.'
      operation: union
      order: 13
      semantic_parameters:
        mode: all
    - carried_fields:
      - entity_key
      - measure_state
      description: 'Deterministic output order: entity, then measure state.'
      operation: tie_break
      order: 14
- columns:
  - description: Identifier of the peptides row. One row per value.
    name: parent_key
    type: integer
  - description: sequence of the peptides row, copied unchanged.
    name: parent_name
    type: text
  - description: The largest measurement_value itself; 0 when the parent has no allele_peptide_measurements rows, and 0 when none of its rows carries a measurement_value value.
    name: top_measure
    type: integer
  - description: 'How many allele_peptide_measurements rows are tied at that largest measurement_value. 1 when exactly one row carries that largest measurement_value; 0 when there are no rows or when none of the rows carries a measurement_value value; a row with no measurement_value value never ties: only a row whose measurement_value value equals the largest value among the parent''s rows holds the maximum, so the winning row of a parent whose rows all lack a value — the row the tie-break alone selects — is not counted here.'
    name: tied_count
    type: bigint
  - description: 'Number of allele_peptide_measurements rows for this peptides row; 0 when there are none. Every linked allele_peptide_measurements row counts, whether or not it carries a measurement_value value. A peptides row kept with no allele_peptide_measurements row reports 0 here, never 1: its placeholder holds no allele_peptide_measurements row to count.'
    name: child_count
    type: bigint
  - description: Sum of measurement_value over all of them; 0 when the parent has no allele_peptide_measurements rows, and 0 when none of its rows carries a measurement_value value (rows with no measurement_value value add nothing).
    name: total_measure
    type: integer
  - description: The measurement_inequality of the allele_peptide_measurements row with the LARGEST measurement_value for this peptides row. Ties in measurement_value are broken by taking the SMALLEST measurement_inequality under a plain case-sensitive comparison of the stored text (the warehouse default order, in which every uppercase letter sorts before every lowercase one) — a row with no measurement_inequality value sorts after every labelled row; rows tied on both are resolved by the smallest measurement_id. A row with no measurement_value value still ranks, after every row that has one, so a parent holding at least one allele_peptide_measurements row always has a winning row — when NONE of its rows carries a measurement_value value the winner is the one the tie-break alone selects, not the no-rows default. The literal '(none)' when the parent has no allele_peptide_measurements rows at all, and '(none)' when the winning row has no measurement_inequality value.
    name: top_label
    type: text
  - description: The measurement_id of that same extremal row — the winner under the SAME total order, so it is the identifier of a real allele_peptide_measurements row whenever the parent has any. This includes when none of them carries a measurement_value value. It is 0 when there are no rows, and only then. It identifies WHICH row won, so a tie resolved the wrong way is visible even when two rows share a label.
    name: top_row_id
    type: integer
  - description: top_measure divided by total_measure as a FRACTION between 0 and 1 (not a percentage), rounded to 4 decimals, 0.0 when total_measure is 0.
    name: top_measure_share
    type: float
  - description: '''empty'' when no row holds a maximum at all — the parent has no allele_peptide_measurements rows, or none of its rows carries a measurement_value value — ''unique'' when exactly one row holds the maximum, ''tied'' when two or more do. Equivalently, tie_state follows tied_count: ''empty'' when tied_count is 0, ''unique'' when it is 1, ''tied'' when it is 2 or more. A row holds the maximum only when it carries a measurement_value value equal to the largest measurement_value value among the parent''s rows; a row with no measurement_value value never holds the maximum. So a parent whose allele_peptide_measurements rows all lack a measurement_value value has no row holding the maximum and is ''empty'', with tied_count 0, even though the ranking still selects a winning row for it by the tie-break alone, which top_label and top_row_id name.'
    name: tie_state
    type: text
  description: 'Per-peptides extremes of linked allele_peptide_measurements rows in the __biological_data_analysis_specifically_related_to_peptide_binding_and_al scenario: WHICH row is largest, not how large it is.'
  grain: One row per peptides (peptide_id), INCLUDING peptides rows with no linked allele_peptide_measurements rows.
  key_columns:
  - parent_key
  name: peptides_allele_peptide_measurements_top
  source_relationships:
  - child_columns:
    - allele_id
    child_table: allele_peptide_measurements
    parent_columns:
    - allele_id
    parent_table: alleles
    required: false
  - child_columns:
    - measurement_source_id
    child_table: allele_peptide_measurements
    parent_columns:
    - source_id
    parent_table: measurement_sources
    required: false
  - child_columns:
    - original_allele_id
    child_table: allele_peptide_measurements
    parent_columns:
    - allele_id
    parent_table: alleles
    required: false
  - child_columns:
    - peptide_id
    child_table: allele_peptide_measurements
    parent_columns:
    - peptide_id
    parent_table: peptides
    required: false
  transformation:
    steps:
    - description: Read source table peptides.
      operation: source
      order: 1
      source_inputs:
      - peptides
    - description: Read source table allele_peptide_measurements.
      operation: source
      order: 2
      source_inputs:
      - allele_peptide_measurements
    - carried_fields:
      - parent_key
      - parent_name
      description: One row per peptides row, keyed by peptide_id.
      operation: derive
      order: 3
      source_inputs:
      - peptides
    - carried_fields:
      - peptide_id
      condition:
        public_identifiers:
        - allele_peptide_measurements
        - peptide_id
        - parent_key
      description: 'Bring in allele_peptide_measurements: a peptides row with no allele_peptide_measurements rows still appears, with the declared defaults.'
      join_preservation: left
      operation: join
      order: 4
      source_inputs:
      - allele_peptide_measurements
    - carried_fields:
      - parent_key
      description: Rank the joined rows within each group under an explicit total order (measure first, then the declared tie-break), so the extremal row is a function of the input and not of row order.
      operation: window
      order: 5
    - carried_fields:
      - parent_key
      - parent_name
      - top_measure
      - tied_count
      - child_count
      - total_measure
      description: 'One output row per parent_key, carrying parent_name beside the keys: a key value identifies one source row for the carried columns, so they take one value per key and never split a group, reporting top_measure, tied_count, child_count, total_measure for that row''s matching rows. A group with no qualifying rows still appears, reporting 0; a retained row with no matching rows has nothing to count, so its counts are 0, never 1.'
      operation: filtered_aggregate
      order: 6
    - carried_fields:
      - parent_key
      - top_label
      - top_row_id
      description: Keep the single row per parent_key at which the ordering measure is largest, ties broken by the smallest measurement_inequality under a plain case-sensitive comparison of the stored text (the warehouse default order, in which every uppercase letter sorts before every lowercase one) (a row with no measurement_inequality value sorts after every row that has one), then the smallest measurement_id, and take top_label, top_row_id from that winning row. EVERY row of the group ranks, including a row whose ordering measure has no value — such a row sorts after every row that has one — so a group with at least one row always has a winning row, and the declared defaults belong to a group with NO rows.
      operation: extrema
      order: 7
    - carried_fields:
      - parent_key
      condition:
        public_identifiers:
        - parent_key
      description: Attach the extremal row's attributes to the grouped measures. LEFT, so a group with no rows at all keeps its measures.
      join_preservation: left
      operation: join
      order: 8
    - carried_fields:
      - parent_key
      - parent_name
      - top_measure
      - tied_count
      - child_count
      - total_measure
      - top_label
      - top_row_id
      description: Name the mart columns; top_measure, total_measure report their declared defaults — never NULL — for a group with no matching rows. For top_measure, total_measure, the default also applies to a group none of whose real rows carries an input value.
      operation: derive
      order: 9
    - carried_fields:
      - parent_key
      - parent_name
      - top_measure
      - tied_count
      - child_count
      - total_measure
      - top_label
      - top_row_id
      - top_measure_share
      description: 'Guarded ratios: top_measure_share — top_measure divided by total_measure as a FRACTION between 0 and 1 (not a percentage), rounded to 4 decimals, 0.0 when total_measure is 0.'
      operation: ratio
      order: 10
      semantic_parameters:
        null_result: 0.0 when the denominator is 0 or NULL
        rounding: ROUND to 4 decimal places
        units: fraction
    - carried_fields:
      - parent_key
      - parent_name
      - top_measure
      - tied_count
      - child_count
      - total_measure
      - top_label
      - top_row_id
      - top_measure_share
      - tie_state
      description: 'tie_state — ''empty'' when no row holds a maximum at all — the parent has no allele_peptide_measurements rows, or none of its rows carries a measurement_value value — ''unique'' when exactly one row holds the maximum, ''tied'' when two or more do. Equivalently, tie_state follows tied_count: ''empty'' when tied_count is 0, ''unique'' when it is 1, ''tied'' when it is 2 or more. A row holds the maximum only when it carries a measurement_value value equal to the largest measurement_value value among the parent''s rows; a row with no measurement_value value never holds the maximum. So a parent whose allele_peptide_measurements rows all lack a measurement_value value has no row holding the maximum and is ''empty'', with tied_count 0, even though the ranking still selects a winning row for it by the tie-break alone, which top_label and top_row_id name.'
      operation: conditional
      order: 11
      semantic_parameters:
        boundary: categorical mapping; no numeric boundary
    - carried_fields:
      - parent_key
      description: 'Deterministic output order: sort by parent_key.'
      operation: tie_break
      order: 12
