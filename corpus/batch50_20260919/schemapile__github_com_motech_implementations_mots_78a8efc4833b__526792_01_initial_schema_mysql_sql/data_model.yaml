    type: text
  - description: 'Number of unit_progress rows for this unit row; 0 when there are none. An unit row kept with no unit_progress row reports 0 here, never 1: its placeholder holds no unit_progress row to count.'
    name: event_count
    type: bigint
  - description: Sum of number_of_replays over all matching unit_progress rows; 0 when there are no rows.
    name: lifetime_amount
    type: integer
  - description: id of the row with the latest created_date; ties take the smallest id under a plain case-sensitive comparison of the stored text (the warehouse default order, in which every uppercase letter sorts before every lowercase one). It is the literal '(none)' when there are no rows.
    name: latest_row_id
    type: text
  - description: number_of_replays from that same latest row; 0 when there are no rows.
    name: latest_amount
    type: integer
  - description: status from that same latest row; '(none)' when there are no rows.
    name: latest_label
    type: text
  - description: latest_amount divided by lifetime_amount as a fraction, rounded to 4 decimal places; 0.0 when lifetime_amount is 0.
    name: latest_amount_share
    type: float
  description: Per-unit latest-row snapshot over linked unit_progress activity in the 526792_01_initial_schema.mysql.sql schema.
