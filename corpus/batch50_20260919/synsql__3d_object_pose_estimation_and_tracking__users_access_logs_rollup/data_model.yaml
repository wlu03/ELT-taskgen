models:
- columns:
  - description: Identifier of the users row. One row per value.
    name: parent_key
    type: integer
  - description: user_name of the users row, copied unchanged.
    name: parent_name
    type: text
  - description: Number of access_logs rows linked to this users row. 0 when there are none.
    name: link_count
    type: bigint
  - description: Number of DISTINCT object_poses rows reached through those links. Two links pointing at the same child count ONCE. 0 when there are no links. A link whose object_poses row is missing reaches no object_poses row and adds nothing to this count.
    name: distinct_child_count
    type: bigint
  - description: Number of linked access_logs rows whose access_type is one of ['view']. A parent whose links ALL fail that test reports 0, not a missing row.
    name: active_link_count
    type: bigint
  - description: Sum of access_duration over every linked row; 0 when there are no links, and 0 when none of the linked rows carries a access_duration value.
    name: total_amount
    type: float
  - description: Sum of access_duration over links whose access_type is one of ['view']; 0 when none qualify, and 0 when every qualifying row lacks a access_duration value.
    name: active_amount
    type: float
  - description: Largest access_duration among the linked rows; 0 when there are no links, and 0 when none of the linked rows carries a access_duration value.
    name: max_amount
    type: float
  - description: active_amount divided by total_amount, expressed as a FRACTION between 0 and 1 (not a percentage), rounded to 4 decimal places, and reported as 0.0 when total_amount is 0.
    name: active_amount_ratio
    type: float
  - description: 'Size band of link_count: ''none'' at exactly 0, ''small'' for 1-2 INCLUSIVE of 2, ''medium'' for 3-5 INCLUSIVE of 5, ''large'' above 5. Every value falls in exactly one band.'
    name: size_band
    type: text
  - description: '''yes'' when this parent has at least one link, ''no'' otherwise. Never NULL.'
    name: has_links
    type: text
  description: Per-users roll-up of linked access_logs activity in the 3d_object_pose_estimation_and_tracking scenario, including the fan-out onto object_poses.
  grain: One row per users (user_id), INCLUDING users rows with no linked access_logs rows.
  key_columns:
  - parent_key
  name: users_access_logs_rollup
  source_relationships:
  - child_columns:
    - pose_id
    child_table: access_logs
    parent_columns:
    - pose_id
    parent_table: object_poses
    required: false
  - child_columns:
    - user_id
    child_table: access_logs
    parent_columns:
    - user_id
    parent_table: users
    required: false
  - child_columns:
    - pose_id
    child_table: environmental_data
    parent_columns:
    - pose_id
    parent_table: object_poses
    required: false
  - child_columns:
    - category_id
    child_table: object_category_links
    parent_columns:
    - category_id
    parent_table: object_categories
    required: false
  - child_columns:
    - object_id
    child_table: object_category_links
    parent_columns:
    - object_id
    parent_table: objects
    required: false
  - child_columns:
    - environment_id
    child_table: object_pose_links
    parent_columns:
    - environment_id
    parent_table: environments
    required: false
  - child_columns:
    - object_id
    child_table: object_pose_links
    parent_columns:
    - object_id
    parent_table: objects
    required: false
  - child_columns:
    - pose_id
    child_table: object_pose_links
    parent_columns:
    - pose_id
    parent_table: object_poses
    required: false
  - child_columns:
    - sensor_id
    child_table: object_pose_links
    parent_columns:
    - sensor_id
    parent_table: sensors
    required: false
  - child_columns:
    - environment_id
    child_table: object_poses
    parent_columns:
    - environment_id
    parent_table: environments
    required: false
  - child_columns:
    - object_id
    child_table: object_poses
    parent_columns:
    - object_id
    parent_table: objects
    required: false
  - child_columns:
    - sensor_id
    child_table: object_poses
    parent_columns:
    - sensor_id
    parent_table: sensors
    required: false
  - child_columns:
    - method_id
    child_table: pose_estimation_results
    parent_columns:
    - method_id
    parent_table: pose_estimation_methods
    required: false
  transformation:
    steps:
    - description: Read source table users.
      operation: source
      order: 1
      source_inputs:
      - users
    - description: Read source table access_logs.
      operation: source
      order: 2
      source_inputs:
      - access_logs
    - description: Read source table object_poses.
      operation: source
      order: 3
      source_inputs:
      - object_poses
    - carried_fields:
      - parent_key
      - parent_name
      description: One row per users row, keyed by user_id.
      operation: derive
      order: 4
      source_inputs:
      - users
    - carried_fields:
      - user_id
      condition:
        public_identifiers:
        - access_logs
        - user_id
        - parent_key
      description: 'Hop 1: bring in access_logs against the grain. One users row may have many access_logs rows, and a users row with no access_logs rows at all is RETAINED.'
      join_preservation: left
      operation: join
      order: 5
      source_inputs:
      - access_logs
    - carried_fields:
      - pose_id
      condition:
        public_identifiers:
        - object_poses
        - pose_id
      description: 'Hop 2: bring in object_poses, matching each linked access_logs row''s pose_id to the pose_id of a object_poses row. A access_logs row whose object_poses row is missing still counts as a link and is RETAINED.'
      join_preservation: left
      operation: join
      order: 6
      source_inputs:
      - object_poses
    - carried_fields:
      - parent_key
      - parent_name
      - link_count
      - distinct_child_count
      - active_link_count
      - total_amount
      - active_amount
      - max_amount
      description: 'One output row per parent_key, carrying parent_name beside the keys: a key value identifies one source row for the carried columns, so they take one value per key and never split a group, reporting link_count, distinct_child_count, active_link_count, total_amount, active_amount, max_amount for that row''s matching rows. A group with no qualifying rows still appears, reporting 0; a retained row with no matching rows has nothing to count, so its counts are 0, never 1.'
      operation: filtered_aggregate
      order: 7
    - carried_fields:
      - parent_key
      - parent_name
      - link_count
      - distinct_child_count
      - active_link_count
      - total_amount
      - active_amount
      - max_amount
      description: Name the mart columns; total_amount, active_amount, max_amount report their declared defaults — never NULL — for a group with no matching rows. For total_amount, active_amount, max_amount, the default also applies to a group none of whose real rows carries an input value.
      operation: derive
      order: 8
    - carried_fields:
      - parent_key
      - parent_name
      - link_count
      - distinct_child_count
      - active_link_count
      - total_amount
      - active_amount
      - max_amount
      - active_amount_ratio
      description: 'Guarded ratios: active_amount_ratio — active_amount divided by total_amount, expressed as a FRACTION between 0 and 1 (not a percentage), rounded to 4 decimal places, and reported as 0.0 when total_amount is 0.'
      operation: ratio
      order: 9
      semantic_parameters:
        null_result: 0.0 when the denominator is 0 or NULL
        rounding: ROUND to 4 decimal places
        units: fraction
    - carried_fields:
      - parent_key
      - parent_name
      - link_count
      - distinct_child_count
      - active_link_count
      - total_amount
      - active_amount
      - max_amount
      - active_amount_ratio
      - size_band
      description: 'size_band — Size band of link_count: ''none'' at exactly 0, ''small'' for 1-2 INCLUSIVE of 2, ''medium'' for 3-5 INCLUSIVE of 5, ''large'' above 5. Every value falls in exactly one band.'
      operation: conditional
      order: 10
      semantic_parameters:
        boundary: a value exactly at 2 is 'small'; a value exactly at 5 is 'medium'
    - carried_fields:
      - parent_key
      - parent_name
      - link_count
      - distinct_child_count
      - active_link_count
      - total_amount
      - active_amount
      - max_amount
      - active_amount_ratio
      - size_band
      - has_links
      description: has_links — 'yes' when this parent has at least one link, 'no' otherwise. Never NULL.
      operation: conditional
      order: 11
      semantic_parameters:
        boundary: a value exactly at 0 is 'no'
    - carried_fields:
      - parent_key
      description: 'Deterministic output order: sort by parent_key.'
      operation: tie_break
      order: 12
- columns:
  - description: Identifier of the users row.
    name: entity_key
    type: integer
  - description: '''passing'' for access_type values [''view'']; ''failing'' for values [''download'']; ''no_activity'' when the users row has no linked access_logs row. A linked access_logs row whose access_type has no value belongs to no cohort: it is not counted in any cell, and it does not make the users row ''no_activity''.'
    name: cohort
    type: text
  - description: user_name of the users row, copied unchanged.
    name: entity_name
    type: text
  - description: Number of access_logs rows in this entity/cohort cell.
    name: link_count
    type: bigint
  - description: Number of distinct access_type values represented in this cell.
    name: distinct_status_count
    type: bigint
  - description: Sum of access_duration in this cell; 0 for a no-activity cell that has no rows at all, and 0 when none of the cell's rows carries an access_duration value.
    name: total_amount
    type: float
  - description: Largest access_duration in this cell; 0 for a no-activity cell that has no rows at all, and 0 when none of the cell's rows carries an access_duration value.
    name: max_amount
    type: float
  - description: max_amount divided by total_amount as a fraction, rounded to 4 decimal places; 0.0 when total_amount is 0.
    name: max_amount_share
    type: float
  description: Per-(users, status cohort) summary of linked access_logs rows in the 3d_object_pose_estimation_and_tracking scenario, with passing and failing cohorts kept separate.
  grain: One row per (user_id, status cohort) pair represented among linked access_logs rows, plus one no-activity row for a users row with no linked access_logs row at all. A users row whose linked access_logs rows all lack a access_type value is in no cohort and gets no no-activity row, so it has no row in this mart.
  key_columns:
  - entity_key
  - cohort
  name: users_access_logs_cohorts
  source_relationships:
  - child_columns:
    - pose_id
    child_table: access_logs
    parent_columns:
    - pose_id
    parent_table: object_poses
    required: false
  - child_columns:
    - user_id
    child_table: access_logs
    parent_columns:
    - user_id
    parent_table: users
    required: false
  - child_columns:
    - pose_id
    child_table: environmental_data
    parent_columns:
    - pose_id
    parent_table: object_poses
    required: false
  - child_columns:
    - category_id
    child_table: object_category_links
    parent_columns:
    - category_id
    parent_table: object_categories
    required: false
  - child_columns:
    - object_id
    child_table: object_category_links
    parent_columns:
    - object_id
    parent_table: objects
    required: false
  - child_columns:
    - environment_id
    child_table: object_pose_links
    parent_columns:
    - environment_id
    parent_table: environments
    required: false
  - child_columns:
    - object_id
    child_table: object_pose_links
    parent_columns:
    - object_id
    parent_table: objects
    required: false
  - child_columns:
    - pose_id
    child_table: object_pose_links
    parent_columns:
    - pose_id
    parent_table: object_poses
    required: false
  - child_columns:
    - sensor_id
    child_table: object_pose_links
    parent_columns:
    - sensor_id
    parent_table: sensors
    required: false
  - child_columns:
    - environment_id
    child_table: object_poses
    parent_columns:
    - environment_id
    parent_table: environments
    required: false
  - child_columns:
    - object_id
    child_table: object_poses
    parent_columns:
    - object_id
    parent_table: objects
    required: false
  - child_columns:
    - sensor_id
    child_table: object_poses
    parent_columns:
    - sensor_id
    parent_table: sensors
    required: false
  - child_columns:
    - method_id
    child_table: pose_estimation_results
    parent_columns:
    - method_id
    parent_table: pose_estimation_methods
    required: false
  transformation:
    steps:
    - description: Read source table users.
      operation: source
      order: 1
      source_inputs:
      - users
    - description: Read source table access_logs.
      operation: source
      order: 2
      source_inputs:
      - access_logs
    - carried_fields:
      - entity_key
      - entity_name
      description: Carry each user_id and its user_name into the cohort calculation.
      operation: derive
      order: 3
      source_inputs:
      - users
    - carried_fields:
      - entity_key
      - entity_name
      - user_id
      condition:
        public_identifiers:
        - access_logs
        - user_id
        - entity_key
      description: Bring the linked access_logs rows into each users entity before assigning status cohorts.
      join_preservation: left
      operation: join
      order: 4
      source_inputs:
      - access_logs
    - carried_fields:
      - entity_key
      - entity_name
      condition:
        literal_values:
        - view
      description: Keep rows whose access_type belongs to the passing cohort values ['view'].
      operation: filter
      order: 5
    - carried_fields:
      - entity_key
      - entity_name
      - link_count
      - distinct_status_count
      - total_amount
      - max_amount
      description: One row per users entity that has at least one linked access_logs row in the passing cohort, reporting the number of those rows, how many different access_type values occur among them, the total of their access_duration, and their largest access_duration. The total and the largest value read only the rows that carry an access_duration value; a cohort whose rows all lack one reports 0 for both, never empty.
      operation: distinct
      order: 6
    - carried_fields:
      - entity_key
      - entity_name
      - link_count
      - distinct_status_count
      - total_amount
      - max_amount
      - max_amount_share
      description: max_amount_share is max_amount divided by total_amount as a fraction, rounded to 4 decimal places; 0.0 when total_amount is 0.
      operation: ratio
      order: 7
      semantic_parameters:
        null_result: 0.0 when total_amount is 0
        rounding: ROUND to 4 decimal places
        units: fraction
    - carried_fields:
      - entity_key
      - cohort
      - entity_name
      - link_count
      - distinct_status_count
      - total_amount
      - max_amount
      - max_amount_share
      description: Label these measures as the passing cohort.
      operation: derive
      order: 8
    - carried_fields:
      - entity_key
      - entity_name
      condition:
        literal_values:
        - download
      description: Keep rows whose access_type belongs to the failing cohort values ['download'].
      operation: filter
      order: 9
    - carried_fields:
      - entity_key
      - entity_name
      - link_count
      - distinct_status_count
      - total_amount
      - max_amount
      description: One row per users entity that has at least one linked access_logs row in the failing cohort, reporting the number of those rows, how many different access_type values occur among them, the total of their access_duration, and their largest access_duration. The total and the largest value read only the rows that carry an access_duration value; a cohort whose rows all lack one reports 0 for both, never empty.
      operation: distinct
      order: 10
    - carried_fields:
      - entity_key
      - entity_name
      - link_count
      - distinct_status_count
      - total_amount
      - max_amount
      - max_amount_share
      description: max_amount_share is max_amount divided by total_amount as a fraction, rounded to 4 decimal places; 0.0 when total_amount is 0.
      operation: ratio
      order: 11
      semantic_parameters:
        null_result: 0.0 when total_amount is 0
        rounding: ROUND to 4 decimal places
        units: fraction
    - carried_fields:
      - entity_key
      - cohort
      - entity_name
      - link_count
      - distinct_status_count
      - total_amount
      - max_amount
      - max_amount_share
      description: Label these measures as the failing cohort.
      operation: derive
      order: 12
    - carried_fields:
      - entity_key
      - entity_name
      description: Keep the placeholder row for a users entity with no linked access_logs row at all; a users entity that has linked access_logs rows gets no placeholder, even when every one of those rows lacks a access_type value.
      operation: filter
      order: 13
    - carried_fields:
      - entity_key
      - entity_name
      - link_count
      - distinct_status_count
      - total_amount
      - max_amount
      description: One row per users entity with no linked access_logs row at all, reporting 0 rows, 0 different access_type values, a access_duration total of 0 and a largest access_duration of 0.
      operation: distinct
      order: 14
    - carried_fields:
      - entity_key
      - entity_name
      - link_count
      - distinct_status_count
      - total_amount
      - max_amount
      - max_amount_share
      description: max_amount_share is max_amount divided by total_amount as a fraction, rounded to 4 decimal places; 0.0 when total_amount is 0.
      operation: ratio
      order: 15
      semantic_parameters:
        null_result: 0.0 when total_amount is 0
        rounding: ROUND to 4 decimal places
        units: fraction
    - carried_fields:
      - entity_key
      - cohort
      - entity_name
      - link_count
      - distinct_status_count
      - total_amount
      - max_amount
      - max_amount_share
      description: Label these measures as the no_activity cohort.
      operation: derive
      order: 16
    - carried_fields:
      - entity_key
      - cohort
      - entity_name
      - link_count
      - distinct_status_count
      - total_amount
      - max_amount
      - max_amount_share
      description: Combine the disjoint passing and failing cohort summaries.
      operation: union
      order: 17
      semantic_parameters:
        mode: all
    - carried_fields:
      - entity_key
      - cohort
      - entity_name
      - link_count
      - distinct_status_count
      - total_amount
      - max_amount
      - max_amount_share
      description: Add the no-activity summaries, so an entity with no linked rows is retained as one explicit cohort row.
      operation: union
      order: 18
      semantic_parameters:
        mode: all
    - carried_fields:
      - entity_key
      - cohort
      description: 'Deterministic output order: entity, then cohort.'
      operation: tie_break
      order: 19
