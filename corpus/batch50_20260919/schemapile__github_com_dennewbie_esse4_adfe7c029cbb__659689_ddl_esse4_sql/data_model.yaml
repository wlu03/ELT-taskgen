  transformation:
    steps:
    - description: Read source table studente.
      operation: source
      order: 1
      source_inputs:
      - studente
    - description: Read source table seduta_laurea.
      operation: source
      order: 2
      source_inputs:
      - seduta_laurea
    - carried_fields:
      - entity_key
      - entity_name
      description: Carry each matricola_studente and its cap into the cohort calculation.
      operation: derive
      order: 3
      source_inputs:
      - studente
    - carried_fields:
      - entity_key
      - entity_name
      - matricola_studente
      condition:
        public_identifiers:
        - seduta_laurea
        - matricola_studente
        - entity_key
      description: Bring the linked seduta_laurea rows into each studente entity before assigning status cohorts.
      join_preservation: left
      operation: join
      order: 4
      source_inputs:
      - seduta_laurea
    - carried_fields:
      - entity_key
      - entity_name
      condition:
        literal_values:
        - N
      description: Keep rows whose lode belongs to the passing cohort values ['N'].
      operation: filter
      order: 5
    - carried_fields:
      - entity_key
      - entity_name
      - link_count
      - distinct_status_count
      - total_amount
      - max_amount
      description: One row per studente entity that has at least one linked seduta_laurea row in the passing cohort, reporting the number of those rows, how many different lode values occur among them, the total of their voto, and their largest voto. The total and the largest value read only the rows that carry a voto value; a cohort whose rows all lack one reports 0 for both, never empty.
      operation: distinct
      order: 6
    - carried_fields:
      - entity_key
      - entity_name
      - link_count
      - distinct_status_count
      - total_amount
      - max_amount
      - max_amount_share
      description: max_amount_share is max_amount divided by total_amount as a fraction, rounded to 4 decimal places; 0.0 when total_amount is 0.
      operation: ratio
      order: 7
      semantic_parameters:
        null_result: 0.0 when total_amount is 0
        rounding: ROUND to 4 decimal places
        units: fraction
    - carried_fields:
      - entity_key
      - cohort
      - entity_name
      - link_count
      - distinct_status_count
      - total_amount
      - max_amount
      - max_amount_share
      description: Label these measures as the passing cohort.
      operation: derive
      order: 8
    - carried_fields:
      - entity_key
      - entity_name
      condition:
        literal_values:
        - n
      description: Keep rows whose lode belongs to the failing cohort values ['n'].
      operation: filter
      order: 9
    - carried_fields:
      - entity_key
      - entity_name
      - link_count
      - distinct_status_count
      - total_amount
      - max_amount
      description: One row per studente entity that has at least one linked seduta_laurea row in the failing cohort, reporting the number of those rows, how many different lode values occur among them, the total of their voto, and their largest voto. The total and the largest value read only the rows that carry a voto value; a cohort whose rows all lack one reports 0 for both, never empty.
      operation: distinct
      order: 10
    - carried_fields:
      - entity_key
      - entity_name
      - link_count
      - distinct_status_count
      - total_amount
      - max_amount
      - max_amount_share
      description: max_amount_share is max_amount divided by total_amount as a fraction, rounded to 4 decimal places; 0.0 when total_amount is 0.
      operation: ratio
      order: 11
      semantic_parameters:
        null_result: 0.0 when total_amount is 0
        rounding: ROUND to 4 decimal places
        units: fraction
    - carried_fields:
      - entity_key
      - cohort
      - entity_name
      - link_count
      - distinct_status_count
      - total_amount
      - max_amount
      - max_amount_share
      description: Label these measures as the failing cohort.
      operation: derive
      order: 12
    - carried_fields:
      - entity_key
      - entity_name
      description: Keep the placeholder row for a studente entity with no linked seduta_laurea row at all; a studente entity that has linked seduta_laurea rows gets no placeholder, even when every one of those rows lacks a lode value.
      operation: filter
      order: 13
    - carried_fields:
      - entity_key
      - entity_name
      - link_count
      - distinct_status_count
      - total_amount
      - max_amount
      description: One row per studente entity with no linked seduta_laurea row at all, reporting 0 rows, 0 different lode values, a voto total of 0 and a largest voto of 0.
      operation: distinct
      order: 14
    - carried_fields:
      - entity_key
      - entity_name
      - link_count
      - distinct_status_count
      - total_amount
      - max_amount
      - max_amount_share
      description: max_amount_share is max_amount divided by total_amount as a fraction, rounded to 4 decimal places; 0.0 when total_amount is 0.
      operation: ratio
      order: 15
      semantic_parameters:
        null_result: 0.0 when total_amount is 0
        rounding: ROUND to 4 decimal places
        units: fraction
    - carried_fields:
      - entity_key
      - cohort
      - entity_name
      - link_count
      - distinct_status_count
      - total_amount
      - max_amount
      - max_amount_share
      description: Label these measures as the no_activity cohort.
      operation: derive
      order: 16
    - carried_fields:
      - entity_key
      - cohort
      - entity_name
      - link_count
      - distinct_status_count
      - total_amount
      - max_amount
      - max_amount_share
      description: Combine the disjoint passing and failing cohort summaries.
      operation: union
      order: 17
      semantic_parameters:
        mode: all
    - carried_fields:
      - entity_key
      - cohort
      - entity_name
      - link_count
      - distinct_status_count
      - total_amount
      - max_amount
      - max_amount_share
      description: Add the no-activity summaries, so an entity with no linked rows is retained as one explicit cohort row.
      operation: union
      order: 18
      semantic_parameters:
        mode: all
    - carried_fields:
      - entity_key
      - cohort
      description: 'Deterministic output order: entity, then cohort.'
      operation: tie_break
      order: 19
- columns:
  - description: Identifier of the studente row. One row per value.
    name: parent_key
    type: text
  - description: cap of the studente row, copied unchanged.
    name: parent_name
    type: text
  - description: 'Number of tassa rows for this studente row; 0 when there are none. A studente row kept with no tassa row reports 0 here, never 1: its placeholder holds no tassa row to count.'
    name: event_count
    type: bigint
  - description: Sum of importo over all matching tassa rows; 0 when there are no rows.
    name: lifetime_amount
    type: decimal
  - description: numero_fattura of the row with the latest scadenza; ties take the smallest numero_fattura under a plain case-sensitive comparison of the stored text (the warehouse default order, in which every uppercase letter sorts before every lowercase one). It is the literal '(none)' when there are no rows.
    name: latest_row_id
    type: text
  - description: importo from that same latest row; 0 when there are no rows.
    name: latest_amount
    type: decimal
  - description: iuv from that same latest row; '(none)' when there are no rows or when the winning value is missing.
    name: latest_label
    type: text
  - description: latest_amount divided by lifetime_amount as a fraction, rounded to 4 decimal places; 0.0 when lifetime_amount is 0.
    name: latest_amount_share
    type: float
  description: Per-studente latest-row snapshot over linked tassa activity in the 659689_DDL_esse4.sql schema.
