- columns:
  - description: Identifier of the studente row.
    name: entity_key
    type: text
  - description: '''passing'' for lode values [''N'']; ''failing'' for values [''n'']; ''no_activity'' when the studente row has no linked seduta_laurea row. A linked seduta_laurea row whose lode has no value belongs to no cohort: it is not counted in any cell, and it does not make the studente row ''no_activity''.'
    name: cohort
    type: text
  - description: cap of the studente row, copied unchanged.
    name: entity_name
    type: text
  - description: Number of seduta_laurea rows in this entity/cohort cell.
    name: link_count
    type: bigint
  - description: Number of distinct lode values represented in this cell.
    name: distinct_status_count
    type: bigint
  - description: Sum of voto in this cell; 0 for a no-activity cell that has no rows at all, and 0 when none of the cell's rows carries an voto value.
    name: total_amount
    type: decimal
  - description: Largest voto in this cell; 0 for a no-activity cell that has no rows at all, and 0 when none of the cell's rows carries an voto value.
    name: max_amount
    type: decimal
  - description: max_amount divided by total_amount as a fraction, rounded to 4 decimal places; 0.0 when total_amount is 0.
    name: max_amount_share
    type: float
  description: Per-(studente, status cohort) summary of linked seduta_laurea activity in the 659689_DDL_esse4.sql schema.
