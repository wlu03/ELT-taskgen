    steps:
    - description: Read source table studente.
      operation: source
      order: 1
      source_inputs:
      - studente
    - description: Read source table tassa.
      operation: source
      order: 2
      source_inputs:
      - tassa
    - carried_fields:
      - parent_key
      - parent_name
      description: One row per studente row, keyed by matricola_studente.
      operation: derive
      order: 3
      source_inputs:
      - studente
    - carried_fields:
      - matricola_studente
      condition:
        public_identifiers:
        - tassa
        - matricola_studente
        - parent_key
      description: Bring in tassa; a studente row with no matching tassa row is retained and receives the stated empty snapshot values.
      join_preservation: left
      operation: join
      order: 4
      source_inputs:
      - tassa
    - carried_fields:
      - parent_key
      - parent_name
      - event_count
      - lifetime_amount
      description: 'One output row per parent_key, carrying parent_name beside the keys: a key value identifies one source row for the carried columns, so they take one value per key and never split a group, reporting event_count, lifetime_amount for that row''s matching rows.'
      operation: aggregate
      order: 5
    - carried_fields:
      - parent_key
      - latest_row_id
      - latest_amount
      - latest_label
      description: Keep the single row per parent_key at which the ordering measure is largest, ties broken by the smallest numero_fattura under a plain case-sensitive comparison of the stored text (the warehouse default order, in which every uppercase letter sorts before every lowercase one), and take latest_row_id, latest_amount, latest_label from that winning row. The ordering measure is required on every real input row, so a non-empty group always has a winning row; the declared defaults belong only to a group with NO rows.
      operation: extrema
      order: 6
    - carried_fields:
      - parent_key
      condition:
        public_identifiers:
        - parent_key
      description: Attach the extremal row's attributes to the grouped measures. LEFT, so a group with no rows at all keeps its measures.
      join_preservation: left
      operation: join
      order: 7
    - carried_fields:
      - parent_key
      - parent_name
      - event_count
      - lifetime_amount
      - latest_row_id
      - latest_amount
      - latest_label
      description: Name the mart columns; lifetime_amount reports its declared default — never NULL — for a group with no matching rows.
      operation: derive
      order: 8
    - carried_fields:
      - parent_key
      - parent_name
      - event_count
      - lifetime_amount
      - latest_row_id
      - latest_amount
      - latest_label
      - latest_amount_share
      description: 'Guarded ratios: latest_amount_share — latest_amount divided by lifetime_amount as a fraction, rounded to 4 decimal places; 0.0 when lifetime_amount is 0.'
      operation: ratio
      order: 9
      semantic_parameters:
        null_result: 0.0 when the denominator is 0 or NULL
        rounding: ROUND to 4 decimal places
        units: fraction
    - carried_fields:
      - parent_key
      description: 'Deterministic output order: sort by parent_key.'
      operation: tie_break
      order: 10
- columns:
  - description: Identifier of the corso_laurea row. One row per value.
    name: parent_key
    type: text
  - description: nome of the corso_laurea row, copied unchanged.
    name: parent_name
    type: text
  - description: 'tipo of the corso_laurea row, copied unchanged. Declared domain: [''MAGISTRALE'', ''TRIENNALE'', ''magistrale'', ''triennale'', ''Magistrale'', ''Triennale''].'
    name: parent_status
    type: text
  - description: 'Number of studente rows for this corso_laurea row; 0 when there are none. Every linked studente row counts, whatever its sesso value. A corso_laurea row kept with no studente row reports 0 here, never 1: its placeholder holds no studente row to count.'
    name: link_count
    type: bigint
  - description: Of those, how many have sesso in ['M']. 0, never missing, when none do.
    name: passing_count
    type: bigint
  - description: How many have sesso in ['F', 'U', 'm', 'f', 'u']. 0 when none do.
    name: failing_count
    type: bigint
  - description: How many DISTINCT sesso values occur among them.
    name: distinct_status_count
    type: bigint
  - description: passing_count divided by link_count as a FRACTION between 0 and 1 (not a percentage), rounded to 4 decimals, 0.0 when there are no links.
    name: passing_ratio
    type: float
  - description: 'Band of passing_ratio, decided on the rounded passing_ratio value this mart reports: ''no_activity'' when there are no links, ''high'' at 0.8 or ABOVE (0.8 itself is high), ''medium'' from 0.5 up to but not including 0.8 (0.5 itself is medium), ''low'' below 0.5. Boundaries are inclusive of the HIGHER band.'
    name: adoption_band
    type: text
  - description: 'parent_status mapped value by value: ''MAGISTRALE'' becomes ''active''; ''TRIENNALE'' becomes ''other_1''; ''magistrale'' becomes ''other_2''; ''triennale'' becomes ''other_3''; ''Magistrale'' becomes ''other_4''; any other value — including legal values of the column that the mapping does not name — becomes ''unmapped''. Never NULL.'
    name: status_group
    type: text
  description: Per-corso_laurea banding of linked studente activity in the 659689_DDL_esse4.sql schema, over the value domain the schema itself declares.
