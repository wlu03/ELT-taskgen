  transformation:
    steps:
    - description: Read source table users.
      operation: source
      order: 1
      source_inputs:
      - users
    - description: Read source table team_members.
      operation: source
      order: 2
      source_inputs:
      - team_members
    - carried_fields:
      - parent_key
      - parent_name
      - parent_status
      description: One row per users row, keyed by user_id.
      operation: derive
      order: 3
      source_inputs:
      - users
    - carried_fields:
      - user_id
      condition:
        public_identifiers:
        - team_members
        - user_id
        - parent_key
      description: 'Bring in team_members (hop 1 of 1): rows with no matching team_members row are RETAINED and report the declared defaults.'
      join_preservation: left
      operation: join
      order: 4
      source_inputs:
      - team_members
    - carried_fields:
      - parent_key
      - parent_name
      - parent_status
      - link_count
      - passing_count
      - failing_count
      - distinct_status_count
      description: 'One output row per parent_key, carrying parent_name, parent_status beside the keys: a key value identifies one source row for the carried columns, so they take one value per key and never split a group, reporting link_count, passing_count, failing_count, distinct_status_count for that row''s matching rows. A group with no qualifying rows still appears, reporting 0; a retained row with no matching rows has nothing to count, so its counts are 0, never 1.'
      operation: filtered_aggregate
      order: 5
    - carried_fields:
      - parent_key
      - parent_name
      - parent_status
      - link_count
      - passing_count
      - failing_count
      - distinct_status_count
      description: Name the mart columns.
      operation: derive
      order: 6
    - carried_fields:
      - parent_key
      - parent_name
      - parent_status
      - link_count
      - passing_count
      - failing_count
      - distinct_status_count
      - passing_ratio
      description: 'Guarded ratios: passing_ratio — passing_count divided by link_count as a FRACTION between 0 and 1 (not a percentage), rounded to 4 decimals, 0.0 when there are no links.'
      operation: ratio
      order: 7
      semantic_parameters:
        null_result: 0.0 when the denominator is 0 or NULL
        rounding: ROUND to 4 decimal places
        units: fraction
    - carried_fields:
      - parent_key
      - parent_name
      - parent_status
      - link_count
      - passing_count
      - failing_count
      - distinct_status_count
      - passing_ratio
      - adoption_band
      description: 'adoption_band — Band of passing_ratio, decided on the rounded passing_ratio value this mart reports: ''no_activity'' when there are no links, ''high'' at 0.8 or ABOVE (0.8 itself is high), ''medium'' from 0.5 up to but not including 0.8 (0.5 itself is medium), ''low'' below 0.5. Boundaries are inclusive of the HIGHER band.'
      operation: conditional
      order: 8
      semantic_parameters:
        boundary: a value exactly at 0.8 is 'high'; a value exactly at 0.5 is 'medium'
        domain: designer, analyst, admin
    - carried_fields:
      - parent_key
      - parent_name
      - parent_status
      - link_count
      - passing_count
      - failing_count
      - distinct_status_count
      - passing_ratio
      - adoption_band
      - status_group
      description: 'status_group — parent_status mapped value by value: ''designer'' becomes ''active''; ''analyst'' becomes ''other_1''; any other value — including legal values of the column that the mapping does not name — becomes ''unmapped''. Never NULL.'
      operation: conditional
      order: 9
      semantic_parameters:
        boundary: categorical mapping; no numeric boundary
        domain: designer, analyst, admin
    - carried_fields:
      - parent_key
      description: 'Deterministic output order: sort by parent_key.'
      operation: tie_break
      order: 10
- columns:
  - description: Identifier of the object_types row.
    name: entity_key
    type: integer
  - description: '''present'' for a linked objects row whose x has a value; ''absent'' when x is missing, including a object_types row with no linked objects row. A linked objects row whose x has a value belongs only to the present state and never to the absent state.'
    name: measure_state
    type: text
  - description: type_name of the object_types row, copied unchanged.
    name: entity_name
    type: text
  - description: Number of linked objects rows in this entity/state cell; an absent cell holding real objects rows whose x is missing COUNTS those rows, and only the placeholder cell of an object_types row with no linked objects row at all reports 0.
    name: row_count
    type: bigint
  - description: Number of unique non-missing x values in this cell; each unique non-missing value is counted once, however many rows repeat it; 0 whenever the cell holds no x value at all — both for an object_types row with no linked objects row and for an absent cell whose rows all have a missing x.
    name: distinct_amount_count
    type: bigint
  - description: Sum of x in this cell; 0 for a no-activity cell that has no rows at all, and 0 when none of the cell's rows carries an x value.
    name: total_amount
    type: integer
  - description: Largest x in this cell; 0 for a no-activity cell that has no rows at all, and 0 when none of the cell's rows carries an x value.
    name: max_amount
    type: integer
  - description: max_amount divided by total_amount as a fraction, rounded to 4 decimal places; 0.0 when total_amount is 0.
    name: max_amount_share
    type: float
  description: Per-(object_types, measure state) distribution of linked objects rows in the 3d_object_modeling_and_rotation_analysis scenario.
  grain: One row per (type_id, measure state) pair represented among linked objects rows; the absent state includes missing x values and a no-activity row for a object_types row with no links. A linked objects row whose x has a value belongs only to the present state and never to the absent state.
  key_columns:
  - entity_key
  - measure_state
  name: object_types_objects_distribution
  source_relationships:
