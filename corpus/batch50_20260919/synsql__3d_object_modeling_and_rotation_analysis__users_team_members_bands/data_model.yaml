models:
- columns:
  - description: Identifier of the users row. One row per value.
    name: parent_key
    type: integer
  - description: user_name of the users row, copied unchanged.
    name: parent_name
    type: text
  - description: 'role of the users row, copied unchanged. Declared domain: [''designer'', ''analyst'', ''admin''].'
    name: parent_status
    type: text
  - description: 'Number of team_members rows for this users row; 0 when there are none. Every linked team_members row counts, whatever its role value. An users row kept with no team_members row reports 0 here, never 1: its placeholder holds no team_members row to count.'
    name: link_count
    type: bigint
  - description: Of those, how many have role in ['lead designer']. 0, never missing, when none do.
    name: passing_count
    type: bigint
  - description: How many have role in ['designer']. 0 when none do.
    name: failing_count
    type: bigint
  - description: How many DISTINCT role values occur among them.
    name: distinct_status_count
    type: bigint
  - description: passing_count divided by link_count as a FRACTION between 0 and 1 (not a percentage), rounded to 4 decimals, 0.0 when there are no links.
    name: passing_ratio
    type: float
  - description: 'Band of passing_ratio, decided on the rounded passing_ratio value this mart reports: ''no_activity'' when there are no links, ''high'' at 0.8 or ABOVE (0.8 itself is high), ''medium'' from 0.5 up to but not including 0.8 (0.5 itself is medium), ''low'' below 0.5. Boundaries are inclusive of the HIGHER band.'
    name: adoption_band
    type: text
  - description: 'parent_status mapped value by value: ''designer'' becomes ''active''; ''analyst'' becomes ''other_1''; any other value — including legal values of the column that the mapping does not name — becomes ''unmapped''. Never NULL.'
    name: status_group
    type: text
  description: Per-users banding of linked team_members activity in the 3d_object_modeling_and_rotation_analysis scenario, over the value domain the source schema itself declares.
  grain: One row per users (user_id), INCLUDING users rows with no linked team_members rows.
  key_columns:
  - parent_key
  name: users_team_members_bands
  source_relationships:
  - child_columns:
    - leader_id
    child_table: design_teams
    parent_columns:
