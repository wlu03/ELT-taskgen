models:
- columns:
  - description: Identifier of the productiondesigner row. One row per value.
    name: parent_key
    type: text
  - description: biography of the productiondesigner row, copied unchanged.
    name: parent_name
    type: text
  - description: Number of DISTINCT filmographydetails rows linked to this productiondesigner row. 0 when there are none. filmographydetails declares no primary key upstream and byte-identical duplicate rows occur in the source; they count ONCE.
    name: link_count
    type: bigint
  - description: Number of DISTINCT cinematographers rows reached through those links. Two links pointing at the same child count ONCE. 0 when there are no links. A link whose cinematographers row is missing reaches no cinematographers row and adds nothing to this count.
    name: distinct_child_count
    type: bigint
  - description: Number of linked filmographydetails rows whose filmcolor is one of ['black-and-white'], each counted once even if the row repeats. A parent whose links ALL fail that test reports 0, not a missing row.
    name: active_link_count
    type: bigint
  - description: Sum of filmduration over every DISTINCT linked row; 0 when there are no links, and 0 when none of the linked rows carries a filmduration value.
    name: total_amount
    type: integer
  - description: Sum of filmduration over links whose filmcolor is one of ['black-and-white'], each counted once even if the row repeats; 0 when none qualify, and 0 when every qualifying row lacks a filmduration value.
    name: active_amount
    type: integer
  - description: Largest filmduration among the linked rows; 0 when there are no links, and 0 when none of the linked rows carries a filmduration value.
    name: max_amount
    type: integer
  - description: active_amount divided by total_amount, expressed as a FRACTION between 0 and 1 (not a percentage), rounded to 4 decimal places, and reported as 0.0 when total_amount is 0.
    name: active_amount_ratio
    type: float
  - description: 'Size band of link_count: ''none'' at exactly 0, ''small'' for 1-2 INCLUSIVE of 2, ''medium'' for 3-5 INCLUSIVE of 5, ''large'' above 5. Every value falls in exactly one band.'
    name: size_band
    type: text
  - description: '''yes'' when this parent has at least one link, ''no'' otherwise. Never NULL.'
    name: has_links
    type: text
  description: Per-productiondesigner roll-up of linked filmographydetails rows in the LucianoSalceFilmography database, following the link on to cinematographers.
  grain: One row per productiondesigner (fullname), INCLUDING productiondesigner rows with no linked filmographydetails rows.
  key_columns:
  - parent_key
  name: productiondesigner_filmographydetails_rollup
  source_relationships:
  - child_columns:
    - castmembers
    child_table: filmographydetails
    parent_columns:
    - fullname
    parent_table: filmographycastandcrew
    required: false
  - child_columns:
    - directorofphotography
    child_table: filmographydetails
    parent_columns:
    - name
    parent_table: cinematographers
    required: false
  - child_columns:
    - musiccomposer
    child_table: filmographydetails
    parent_columns:
    - composername
    parent_table: filmcomposers
    required: false
  - child_columns:
    - productiondesigner
    child_table: filmographydetails
    parent_columns:
    - fullname
    parent_table: productiondesigner
    required: false
  - child_columns:
    - screenwriters
    child_table: filmographydetails
    parent_columns:
    - fullname
    parent_table: filmindustryprofessionals
    required: false
  transformation:
    steps:
    - description: Read source table productiondesigner.
      operation: source
      order: 1
      source_inputs:
      - productiondesigner
    - description: Read source table filmographydetails.
      operation: source
      order: 2
      source_inputs:
      - filmographydetails
    - description: Read source table cinematographers.
      operation: source
      order: 3
      source_inputs:
      - cinematographers
    - carried_fields:
      - kinopoiskfilmid
      - productiondesigner
      - directorofphotography
      - filmcolor
      - filmduration
      description: filmographydetails declares no primary key upstream, so byte-identical duplicate rows can occur; every such row counts ONCE, however many copies arrive.
      operation: dedupe
      order: 4
      source_inputs:
      - filmographydetails
    - carried_fields:
      - parent_key
      - parent_name
      description: One row per productiondesigner row, keyed by fullname.
      operation: derive
      order: 5
      source_inputs:
      - productiondesigner
    - carried_fields:
      - productiondesigner
      - fullname
      condition:
        public_identifiers:
        - filmographydetails
        - productiondesigner
        - parent_key
      description: 'Hop 1: bring in filmographydetails against the grain. One productiondesigner row may have many filmographydetails rows, and a productiondesigner row with no filmographydetails rows at all is RETAINED.'
      join_preservation: left
      operation: join
      order: 6
      source_inputs:
      - filmographydetails
    - carried_fields:
      - name
      - directorofphotography
      condition:
        public_identifiers:
        - cinematographers
        - name
      description: 'Hop 2: bring in cinematographers, matching each linked filmographydetails row''s directorofphotography to the name of a cinematographers row. A filmographydetails row whose cinematographers row is missing still counts as a link and is RETAINED.'
      join_preservation: left
      operation: join
      order: 7
      source_inputs:
      - cinematographers
    - carried_fields:
      - parent_key
      - parent_name
      - link_count
      - distinct_child_count
      - active_link_count
      - total_amount
      - active_amount
      - max_amount
      description: 'One output row per parent_key, carrying parent_name beside the keys: a key value identifies one source row for the carried columns, so they take one value per key and never split a group, reporting link_count, distinct_child_count, active_link_count, total_amount, active_amount, max_amount for that row''s matching rows. A group with no qualifying rows still appears, reporting 0; a retained row with no matching rows has nothing to count, so its counts are 0, never 1.'
      operation: filtered_aggregate
      order: 8
    - carried_fields:
      - parent_key
      - parent_name
      - link_count
      - distinct_child_count
      - active_link_count
      - total_amount
      - active_amount
      - max_amount
      description: Name the mart columns; total_amount, active_amount, max_amount report their declared defaults — never NULL — for a group with no matching rows. For total_amount, active_amount, max_amount, the default also applies to a group none of whose real rows carries an input value.
      operation: derive
      order: 9
    - carried_fields:
      - parent_key
      - parent_name
      - link_count
      - distinct_child_count
      - active_link_count
      - total_amount
      - active_amount
      - max_amount
      - active_amount_ratio
      description: 'Guarded ratios: active_amount_ratio — active_amount divided by total_amount, expressed as a FRACTION between 0 and 1 (not a percentage), rounded to 4 decimal places, and reported as 0.0 when total_amount is 0.'
      operation: ratio
      order: 10
      semantic_parameters:
        null_result: 0.0 when the denominator is 0 or NULL
        rounding: ROUND to 4 decimal places
        units: fraction
    - carried_fields:
      - parent_key
      - parent_name
      - link_count
      - distinct_child_count
      - active_link_count
      - total_amount
      - active_amount
      - max_amount
      - active_amount_ratio
      - size_band
      description: 'size_band — Size band of link_count: ''none'' at exactly 0, ''small'' for 1-2 INCLUSIVE of 2, ''medium'' for 3-5 INCLUSIVE of 5, ''large'' above 5. Every value falls in exactly one band.'
      operation: conditional
      order: 11
      semantic_parameters:
        boundary: a value exactly at 2 is 'small'; a value exactly at 5 is 'medium'
    - carried_fields:
      - parent_key
      - parent_name
      - link_count
      - distinct_child_count
      - active_link_count
      - total_amount
      - active_amount
      - max_amount
      - active_amount_ratio
      - size_band
      - has_links
      description: has_links — 'yes' when this parent has at least one link, 'no' otherwise. Never NULL.
      operation: conditional
      order: 12
      semantic_parameters:
        boundary: a value exactly at 0 is 'no'
    - carried_fields:
      - parent_key
      description: 'Deterministic output order: sort by parent_key.'
      operation: tie_break
      order: 13
- columns:
  - description: Identifier of the productiondesigner row.
    name: entity_key
    type: text
  - description: '''passing'' for filmcolor values [''black-and-white'']; ''failing'' for values [''color'']; ''no_activity'' when the productiondesigner row has no linked filmographydetails row. A linked filmographydetails row whose filmcolor has no value belongs to no cohort: it is not counted in any cell, and it does not make the productiondesigner row ''no_activity''.'
    name: cohort
    type: text
  - description: biography of the productiondesigner row, copied unchanged.
    name: entity_name
    type: text
  - description: Number of filmographydetails rows in this entity/cohort cell.
    name: link_count
    type: bigint
  - description: Number of distinct filmcolor values represented in this cell.
    name: distinct_status_count
    type: bigint
  - description: Sum of filmduration in this cell; 0 for a no-activity cell that has no rows at all, and 0 when none of the cell's rows carries an filmduration value.
    name: total_amount
    type: integer
  - description: Largest filmduration in this cell; 0 for a no-activity cell that has no rows at all, and 0 when none of the cell's rows carries an filmduration value.
    name: max_amount
    type: integer
  - description: max_amount divided by total_amount as a fraction, rounded to 4 decimal places; 0.0 when total_amount is 0.
    name: max_amount_share
    type: float
  description: Per-(productiondesigner, observed status cohort) summary of linked filmographydetails rows in the LucianoSalceFilmography database.
  grain: One row per (fullname, status cohort) pair represented among linked filmographydetails rows, plus one no-activity row for a productiondesigner row with no linked filmographydetails row at all. A productiondesigner row whose linked filmographydetails rows all lack a filmcolor value is in no cohort and gets no no-activity row, so it has no row in this mart.
  key_columns:
  - entity_key
  - cohort
  name: productiondesigner_filmographydetails_cohorts
  source_relationships:
  - child_columns:
    - castmembers
    child_table: filmographydetails
    parent_columns:
    - fullname
    parent_table: filmographycastandcrew
    required: false
  - child_columns:
    - directorofphotography
    child_table: filmographydetails
    parent_columns:
    - name
    parent_table: cinematographers
    required: false
  - child_columns:
    - musiccomposer
    child_table: filmographydetails
    parent_columns:
    - composername
    parent_table: filmcomposers
    required: false
  - child_columns:
    - productiondesigner
    child_table: filmographydetails
    parent_columns:
    - fullname
    parent_table: productiondesigner
    required: false
  - child_columns:
    - screenwriters
    child_table: filmographydetails
    parent_columns:
    - fullname
    parent_table: filmindustryprofessionals
    required: false
  transformation:
    steps:
    - description: Read source table productiondesigner.
      operation: source
      order: 1
      source_inputs:
      - productiondesigner
    - description: Read source table filmographydetails.
      operation: source
      order: 2
      source_inputs:
      - filmographydetails
    - carried_fields:
      - entity_key
      - entity_name
      description: Carry each fullname and its biography into the cohort calculation.
      operation: derive
      order: 3
      source_inputs:
      - productiondesigner
    - carried_fields:
      - entity_key
      - entity_name
      - fullname
      - productiondesigner
      condition:
        public_identifiers:
        - filmographydetails
        - productiondesigner
        - entity_key
      description: Bring the linked filmographydetails rows into each productiondesigner entity before assigning status cohorts.
      join_preservation: left
      operation: join
      order: 4
      source_inputs:
      - filmographydetails
    - carried_fields:
      - entity_key
      - entity_name
      condition:
        literal_values:
        - black-and-white
      description: Keep rows whose filmcolor belongs to the passing cohort values ['black-and-white'].
      operation: filter
      order: 5
    - carried_fields:
      - entity_key
      - entity_name
      - link_count
      - distinct_status_count
      - total_amount
      - max_amount
      description: One row per productiondesigner entity that has at least one linked filmographydetails row in the passing cohort, reporting the number of those rows, how many different filmcolor values occur among them, the total of their filmduration, and their largest filmduration. The total and the largest value read only the rows that carry a filmduration value; a cohort whose rows all lack one reports 0 for both, never empty.
      operation: distinct
      order: 6
    - carried_fields:
      - entity_key
      - entity_name
      - link_count
      - distinct_status_count
      - total_amount
      - max_amount
      - max_amount_share
      description: max_amount_share is max_amount divided by total_amount as a fraction, rounded to 4 decimal places; 0.0 when total_amount is 0.
      operation: ratio
      order: 7
      semantic_parameters:
        null_result: 0.0 when total_amount is 0
        rounding: ROUND to 4 decimal places
        units: fraction
    - carried_fields:
      - entity_key
      - cohort
      - entity_name
      - link_count
      - distinct_status_count
      - total_amount
      - max_amount
      - max_amount_share
      description: Label these measures as the passing cohort.
      operation: derive
      order: 8
    - carried_fields:
      - entity_key
      - entity_name
      condition:
        literal_values:
        - color
      description: Keep rows whose filmcolor belongs to the failing cohort values ['color'].
      operation: filter
      order: 9
    - carried_fields:
      - entity_key
      - entity_name
      - link_count
      - distinct_status_count
      - total_amount
      - max_amount
      description: One row per productiondesigner entity that has at least one linked filmographydetails row in the failing cohort, reporting the number of those rows, how many different filmcolor values occur among them, the total of their filmduration, and their largest filmduration. The total and the largest value read only the rows that carry a filmduration value; a cohort whose rows all lack one reports 0 for both, never empty.
      operation: distinct
      order: 10
    - carried_fields:
      - entity_key
      - entity_name
      - link_count
      - distinct_status_count
      - total_amount
      - max_amount
      - max_amount_share
      description: max_amount_share is max_amount divided by total_amount as a fraction, rounded to 4 decimal places; 0.0 when total_amount is 0.
      operation: ratio
      order: 11
      semantic_parameters:
        null_result: 0.0 when total_amount is 0
        rounding: ROUND to 4 decimal places
        units: fraction
    - carried_fields:
      - entity_key
      - cohort
      - entity_name
      - link_count
      - distinct_status_count
      - total_amount
      - max_amount
      - max_amount_share
      description: Label these measures as the failing cohort.
      operation: derive
      order: 12
    - carried_fields:
      - entity_key
      - entity_name
      description: Keep the placeholder row for a productiondesigner entity with no linked filmographydetails row at all; a productiondesigner entity that has linked filmographydetails rows gets no placeholder, even when every one of those rows lacks a filmcolor value.
      operation: filter
      order: 13
    - carried_fields:
      - entity_key
      - entity_name
      - link_count
      - distinct_status_count
      - total_amount
      - max_amount
      description: One row per productiondesigner entity with no linked filmographydetails row at all, reporting 0 rows, 0 different filmcolor values, a filmduration total of 0 and a largest filmduration of 0.
      operation: distinct
      order: 14
    - carried_fields:
      - entity_key
      - entity_name
      - link_count
      - distinct_status_count
      - total_amount
      - max_amount
      - max_amount_share
      description: max_amount_share is max_amount divided by total_amount as a fraction, rounded to 4 decimal places; 0.0 when total_amount is 0.
      operation: ratio
      order: 15
      semantic_parameters:
        null_result: 0.0 when total_amount is 0
        rounding: ROUND to 4 decimal places
        units: fraction
    - carried_fields:
      - entity_key
      - cohort
      - entity_name
      - link_count
      - distinct_status_count
      - total_amount
      - max_amount
      - max_amount_share
      description: Label these measures as the no_activity cohort.
      operation: derive
      order: 16
    - carried_fields:
      - entity_key
      - cohort
      - entity_name
      - link_count
      - distinct_status_count
      - total_amount
      - max_amount
      - max_amount_share
      description: Combine the disjoint passing and failing cohort summaries.
      operation: union
      order: 17
      semantic_parameters:
        mode: all
    - carried_fields:
      - entity_key
      - cohort
      - entity_name
      - link_count
      - distinct_status_count
      - total_amount
      - max_amount
      - max_amount_share
      description: Add the no-activity summaries, so an entity with no linked rows is retained as one explicit cohort row.
      operation: union
      order: 18
      semantic_parameters:
        mode: all
    - carried_fields:
      - entity_key
      - cohort
      description: 'Deterministic output order: entity, then cohort.'
      operation: tie_break
      order: 19
