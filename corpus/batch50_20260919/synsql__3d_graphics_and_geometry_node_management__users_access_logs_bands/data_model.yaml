models:
- columns:
  - description: Identifier of the users row. One row per value.
    name: parent_key
    type: integer
  - description: user_name of the users row, copied unchanged.
    name: parent_name
    type: text
  - description: 'role of the users row, copied unchanged. Declared domain: [''developer'', ''designer'', ''administrator''].'
    name: parent_status
    type: text
  - description: 'Number of access_logs rows for this users row; 0 when there are none. Every linked access_logs row counts, whatever its access_type value. An users row kept with no access_logs row reports 0 here, never 1: its placeholder holds no access_logs row to count.'
    name: link_count
    type: bigint
  - description: Of those, how many have access_type in ['view']. 0, never missing, when none do.
    name: passing_count
    type: bigint
  - description: How many have access_type in ['edit']. 0 when none do.
    name: failing_count
    type: bigint
  - description: How many DISTINCT access_type values occur among them.
    name: distinct_status_count
    type: bigint
  - description: passing_count divided by link_count as a FRACTION between 0 and 1 (not a percentage), rounded to 4 decimals, 0.0 when there are no links.
    name: passing_ratio
    type: float
  - description: 'Band of passing_ratio, decided on the rounded passing_ratio value this mart reports: ''no_activity'' when there are no links, ''high'' at 0.8 or ABOVE (0.8 itself is high), ''medium'' from 0.5 up to but not including 0.8 (0.5 itself is medium), ''low'' below 0.5. Boundaries are inclusive of the HIGHER band.'
    name: adoption_band
    type: text
  - description: 'parent_status mapped value by value: ''developer'' becomes ''active''; ''designer'' becomes ''other_1''; any other value — including legal values of the column that the mapping does not name — becomes ''unmapped''. Never NULL.'
    name: status_group
    type: text
  description: Per-users banding of linked access_logs activity in the 3d_graphics_and_geometry_node_management scenario, over the value domain the source schema itself declares.
  grain: One row per users (user_id), INCLUDING users rows with no linked access_logs rows.
  key_columns:
  - parent_key
  name: users_access_logs_bands
  source_relationships:
  - child_columns:
    - node_id
    child_table: access_logs
    parent_columns:
    - node_id
    parent_table: nodes
    required: false
  - child_columns:
    - user_id
    child_table: access_logs
    parent_columns:
    - user_id
    parent_table: users
    required: false
  - child_columns:
    - node_id
    child_table: colors
    parent_columns:
    - node_id
    parent_table: nodes
    required: false
  - child_columns:
    - node_id
    child_table: coordinates
    parent_columns:
    - node_id
    parent_table: nodes
    required: false
  - child_columns:
    - node_type_id
    child_table: nodes
    parent_columns:
    - node_type_id
    parent_table: node_types
    required: false
  - child_columns:
    - node_id
    child_table: vertex_attributes
    parent_columns:
    - node_id
    parent_table: nodes
    required: false
  transformation:
    steps:
    - description: Read source table users.
      operation: source
      order: 1
      source_inputs:
      - users
    - description: Read source table access_logs.
      operation: source
      order: 2
      source_inputs:
      - access_logs
    - carried_fields:
      - parent_key
      - parent_name
      - parent_status
      description: One row per users row, keyed by user_id.
      operation: derive
      order: 3
      source_inputs:
      - users
    - carried_fields:
      - user_id
      condition:
        public_identifiers:
        - access_logs
        - user_id
        - parent_key
      description: 'Bring in access_logs (hop 1 of 1): rows with no matching access_logs row are RETAINED and report the declared defaults.'
      join_preservation: left
      operation: join
      order: 4
      source_inputs:
      - access_logs
    - carried_fields:
      - parent_key
      - parent_name
      - parent_status
      - link_count
      - passing_count
      - failing_count
      - distinct_status_count
      description: 'One output row per parent_key, carrying parent_name, parent_status beside the keys: a key value identifies one source row for the carried columns, so they take one value per key and never split a group, reporting link_count, passing_count, failing_count, distinct_status_count for that row''s matching rows. A group with no qualifying rows still appears, reporting 0; a retained row with no matching rows has nothing to count, so its counts are 0, never 1.'
      operation: filtered_aggregate
      order: 5
    - carried_fields:
      - parent_key
      - parent_name
      - parent_status
      - link_count
      - passing_count
      - failing_count
      - distinct_status_count
      description: Name the mart columns.
      operation: derive
      order: 6
    - carried_fields:
      - parent_key
      - parent_name
      - parent_status
      - link_count
      - passing_count
      - failing_count
      - distinct_status_count
      - passing_ratio
      description: 'Guarded ratios: passing_ratio — passing_count divided by link_count as a FRACTION between 0 and 1 (not a percentage), rounded to 4 decimals, 0.0 when there are no links.'
      operation: ratio
      order: 7
      semantic_parameters:
        null_result: 0.0 when the denominator is 0 or NULL
        rounding: ROUND to 4 decimal places
        units: fraction
    - carried_fields:
      - parent_key
      - parent_name
      - parent_status
      - link_count
      - passing_count
      - failing_count
      - distinct_status_count
      - passing_ratio
      - adoption_band
      description: 'adoption_band — Band of passing_ratio, decided on the rounded passing_ratio value this mart reports: ''no_activity'' when there are no links, ''high'' at 0.8 or ABOVE (0.8 itself is high), ''medium'' from 0.5 up to but not including 0.8 (0.5 itself is medium), ''low'' below 0.5. Boundaries are inclusive of the HIGHER band.'
      operation: conditional
      order: 8
      semantic_parameters:
        boundary: a value exactly at 0.8 is 'high'; a value exactly at 0.5 is 'medium'
        domain: developer, designer, administrator
    - carried_fields:
      - parent_key
      - parent_name
      - parent_status
      - link_count
      - passing_count
      - failing_count
      - distinct_status_count
      - passing_ratio
      - adoption_band
      - status_group
      description: 'status_group — parent_status mapped value by value: ''developer'' becomes ''active''; ''designer'' becomes ''other_1''; any other value — including legal values of the column that the mapping does not name — becomes ''unmapped''. Never NULL.'
      operation: conditional
      order: 9
      semantic_parameters:
        boundary: categorical mapping; no numeric boundary
        domain: developer, designer, administrator
    - carried_fields:
      - parent_key
      description: 'Deterministic output order: sort by parent_key.'
      operation: tie_break
      order: 10
- columns:
  - description: Identifier of the nodes row.
    name: entity_key
    type: integer
  - description: '''present'' for a linked vertex_attributes row whose ccw has a value; ''absent'' when ccw is missing, including a nodes row with no linked vertex_attributes row. A linked vertex_attributes row whose ccw has a value belongs only to the present state and never to the absent state.'
    name: measure_state
    type: text
  - description: name of the nodes row, copied unchanged.
    name: entity_name
    type: text
  - description: Number of linked vertex_attributes rows in this entity/state cell; a absent cell holding real vertex_attributes rows whose ccw is missing COUNTS those rows, and only the placeholder cell of a nodes row with no linked vertex_attributes row at all reports 0.
    name: row_count
    type: bigint
  - description: Number of unique non-missing ccw values in this cell; each unique non-missing value is counted once, however many rows repeat it; 0 whenever the cell holds no ccw value at all — both for a nodes row with no linked vertex_attributes row and for an absent cell whose rows all have a missing ccw.
    name: distinct_amount_count
    type: bigint
  - description: Sum of ccw in this cell; 0 for a no-activity cell that has no rows at all, and 0 when none of the cell's rows carries an ccw value.
    name: total_amount
    type: integer
  - description: Largest ccw in this cell; 0 for a no-activity cell that has no rows at all, and 0 when none of the cell's rows carries an ccw value.
    name: max_amount
    type: integer
  - description: max_amount divided by total_amount as a fraction, rounded to 4 decimal places; 0.0 when total_amount is 0.
    name: max_amount_share
    type: float
  description: Per-(nodes, measure state) distribution of linked vertex_attributes rows in the 3d_graphics_and_geometry_node_management scenario.
  grain: One row per (node_id, measure state) pair represented among linked vertex_attributes rows; the absent state includes missing ccw values and a no-activity row for a nodes row with no links. A linked vertex_attributes row whose ccw has a value belongs only to the present state and never to the absent state.
  key_columns:
  - entity_key
  - measure_state
  name: nodes_vertex_attributes_distribution
  source_relationships:
  - child_columns:
    - node_id
    child_table: access_logs
    parent_columns:
    - node_id
    parent_table: nodes
    required: false
  - child_columns:
    - user_id
    child_table: access_logs
    parent_columns:
    - user_id
    parent_table: users
    required: false
  - child_columns:
    - node_id
    child_table: colors
    parent_columns:
    - node_id
    parent_table: nodes
    required: false
  - child_columns:
    - node_id
    child_table: coordinates
    parent_columns:
    - node_id
    parent_table: nodes
    required: false
  - child_columns:
    - node_type_id
    child_table: nodes
    parent_columns:
    - node_type_id
    parent_table: node_types
    required: false
  - child_columns:
    - node_id
    child_table: vertex_attributes
    parent_columns:
    - node_id
    parent_table: nodes
    required: false
  transformation:
    steps:
    - description: Read source table nodes.
      operation: source
      order: 1
      source_inputs:
      - nodes
    - description: Read source table vertex_attributes.
      operation: source
      order: 2
      source_inputs:
      - vertex_attributes
    - carried_fields:
      - entity_key
      - entity_name
      description: Carry each node_id and its name into the measure-state calculation.
      operation: derive
      order: 3
      source_inputs:
      - nodes
    - carried_fields:
      - entity_key
      - entity_name
      - node_id
      condition:
        public_identifiers:
        - vertex_attributes
        - node_id
        - entity_key
      description: Bring the linked vertex_attributes rows into each nodes entity; retain an entity with no linked row so its absent state is visible.
      join_preservation: left
      operation: join
      order: 4
      source_inputs:
      - vertex_attributes
    - carried_fields:
      - entity_key
      - entity_name
      description: 'Keep the present measure-state rows: a real vertex_attributes row whose ccw has a value.'
      operation: filter
      order: 5
    - carried_fields:
      - entity_key
      - entity_name
      - row_count
      - distinct_amount_count
      - total_amount
      - max_amount
      description: One row per nodes entity that has at least one row in the present measure state, and no row here for an entity with none, reporting row count, how many different non-missing ccw values occur (each different value counted once, however many rows repeat it), total ccw, and largest ccw.
      operation: distinct
      order: 6
    - carried_fields:
      - entity_key
      - entity_name
      - row_count
      - distinct_amount_count
      - total_amount
      - max_amount
      - max_amount_share
      description: max_amount_share is max_amount divided by total_amount as a fraction, rounded to 4 decimal places; 0.0 when total_amount is 0.
      operation: ratio
      order: 7
      semantic_parameters:
        null_result: 0.0 when total_amount is 0
        rounding: ROUND to 4 decimal places
        units: fraction
    - carried_fields:
      - entity_key
      - measure_state
      - entity_name
      - row_count
      - distinct_amount_count
      - total_amount
      - max_amount
      - max_amount_share
      description: Label these measures as the present measure state.
      operation: derive
      order: 8
    - carried_fields:
      - entity_key
      - entity_name
      description: 'Keep the absent measure-state rows: ccw is missing, including the retained placeholder for a nodes row with no vertex_attributes rows. A real vertex_attributes row whose ccw has a value belongs only to the present state and never to this absent state.'
      operation: filter
      order: 9
    - carried_fields:
      - entity_key
      - entity_name
      - row_count
      - distinct_amount_count
      - total_amount
      - max_amount
      description: One row per nodes entity that has at least one row in the absent measure state, and no row here for an entity with none, reporting row count, how many different non-missing ccw values occur (each different value counted once, however many rows repeat it), total ccw, and largest ccw.
      operation: distinct
      order: 10
    - carried_fields:
      - entity_key
      - entity_name
      - row_count
      - distinct_amount_count
      - total_amount
      - max_amount
      - max_amount_share
      description: max_amount_share is max_amount divided by total_amount as a fraction, rounded to 4 decimal places; 0.0 when total_amount is 0.
      operation: ratio
      order: 11
      semantic_parameters:
        null_result: 0.0 when total_amount is 0
        rounding: ROUND to 4 decimal places
        units: fraction
    - carried_fields:
      - entity_key
      - measure_state
      - entity_name
      - row_count
      - distinct_amount_count
      - total_amount
      - max_amount
      - max_amount_share
      description: Label these measures as the absent measure state.
      operation: derive
      order: 12
    - carried_fields:
      - entity_key
      - measure_state
      - entity_name
      - row_count
      - distinct_amount_count
      - total_amount
      - max_amount
      - max_amount_share
      description: 'Stack the present-state summary and the absent-state summary into one output list: every present-state row and every absent-state row is its own output row, an entity with rows in both states appears twice, once per state, and the two summaries are never matched to each other.'
      operation: union
      order: 13
      semantic_parameters:
        mode: all
    - carried_fields:
      - entity_key
      - measure_state
      description: 'Deterministic output order: entity, then measure state.'
      operation: tie_break
      order: 14
