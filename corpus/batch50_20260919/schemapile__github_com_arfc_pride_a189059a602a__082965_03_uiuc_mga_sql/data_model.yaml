  transformation:
    steps:
    - description: Read source table technologies.
      operation: source
      order: 1
      source_inputs:
      - technologies
    - description: Read source table techinputsplit.
      operation: source
      order: 2
      source_inputs:
      - techinputsplit
    - carried_fields:
      - entity_key
      - entity_name
      description: Carry each tech and its tech_category into the measure-state calculation.
      operation: derive
      order: 3
      source_inputs:
      - technologies
    - carried_fields:
      - entity_key
      - entity_name
      - tech
      condition:
        public_identifiers:
        - techinputsplit
        - tech
        - entity_key
      description: Bring the linked techinputsplit rows into each technologies entity; retain an entity with no linked row so its absent state is visible.
      join_preservation: left
      operation: join
      order: 4
      source_inputs:
      - techinputsplit
    - carried_fields:
      - entity_key
      - entity_name
      description: 'Keep the present measure-state rows: a real techinputsplit row whose ti_split has a value.'
      operation: filter
      order: 5
    - carried_fields:
      - entity_key
      - entity_name
      - row_count
      - distinct_amount_count
      - total_amount
      - max_amount
      description: One row per technologies entity that has at least one row in the present measure state, and no row here for an entity with none, reporting row count, how many different non-missing ti_split values occur (each different value counted once, however many rows repeat it), total ti_split, and largest ti_split.
      operation: distinct
      order: 6
    - carried_fields:
      - entity_key
      - entity_name
      - row_count
      - distinct_amount_count
      - total_amount
      - max_amount
      - max_amount_share
      description: max_amount_share is max_amount divided by total_amount as a fraction, rounded to 4 decimal places; 0.0 when total_amount is 0.
      operation: ratio
      order: 7
      semantic_parameters:
        null_result: 0.0 when total_amount is 0
        rounding: ROUND to 4 decimal places
        units: fraction
    - carried_fields:
      - entity_key
      - measure_state
      - entity_name
      - row_count
      - distinct_amount_count
      - total_amount
      - max_amount
      - max_amount_share
      description: Label these measures as the present measure state.
      operation: derive
      order: 8
    - carried_fields:
      - entity_key
      - entity_name
      description: 'Keep the absent measure-state rows: ti_split is missing, including the retained placeholder for a technologies row with no techinputsplit rows. A real techinputsplit row whose ti_split has a value belongs only to the present state and never to this absent state.'
      operation: filter
      order: 9
    - carried_fields:
      - entity_key
      - entity_name
      - row_count
      - distinct_amount_count
      - total_amount
      - max_amount
      description: One row per technologies entity that has at least one row in the absent measure state, and no row here for an entity with none, reporting row count, how many different non-missing ti_split values occur (each different value counted once, however many rows repeat it), total ti_split, and largest ti_split.
      operation: distinct
      order: 10
    - carried_fields:
      - entity_key
      - entity_name
      - row_count
      - distinct_amount_count
      - total_amount
      - max_amount
      - max_amount_share
      description: max_amount_share is max_amount divided by total_amount as a fraction, rounded to 4 decimal places; 0.0 when total_amount is 0.
      operation: ratio
      order: 11
      semantic_parameters:
        null_result: 0.0 when total_amount is 0
        rounding: ROUND to 4 decimal places
        units: fraction
    - carried_fields:
      - entity_key
      - measure_state
      - entity_name
      - row_count
      - distinct_amount_count
      - total_amount
      - max_amount
      - max_amount_share
      description: Label these measures as the absent measure state.
      operation: derive
      order: 12
    - carried_fields:
      - entity_key
      - measure_state
      - entity_name
      - row_count
      - distinct_amount_count
      - total_amount
      - max_amount
      - max_amount_share
      description: 'Stack the present-state summary and the absent-state summary into one output list: every present-state row and every absent-state row is its own output row, an entity with rows in both states appears twice, once per state, and the two summaries are never matched to each other.'
      operation: union
      order: 13
      semantic_parameters:
        mode: all
    - carried_fields:
      - entity_key
      - measure_state
      description: 'Deterministic output order: entity, then measure state.'
      operation: tie_break
      order: 14
