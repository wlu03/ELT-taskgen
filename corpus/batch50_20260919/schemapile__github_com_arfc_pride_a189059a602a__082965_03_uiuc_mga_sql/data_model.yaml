  - description: Identifier of the technologies row.
    name: entity_key
    type: text
  - description: '''present'' for a linked techoutputsplit row whose to_split has a value; ''absent'' when to_split is missing, including a technologies row with no linked techoutputsplit row. A linked techoutputsplit row whose to_split has a value belongs only to the present state and never to the absent state.'
    name: measure_state
    type: text
  - description: tech_category of the technologies row, copied unchanged.
    name: entity_name
    type: text
  - description: Number of linked techoutputsplit rows in this entity/state cell; a absent cell holding real techoutputsplit rows whose to_split is missing COUNTS those rows, and only the placeholder cell of a technologies row with no linked techoutputsplit row at all reports 0.
    name: row_count
    type: bigint
  - description: Number of unique non-missing to_split values in this cell; each unique non-missing value is counted once, however many rows repeat it; 0 whenever the cell holds no to_split value at all — both for a technologies row with no linked techoutputsplit row and for an absent cell whose rows all have a missing to_split.
    name: distinct_amount_count
    type: bigint
  - description: Sum of to_split in this cell; 0 for a no-activity cell that has no rows at all, and 0 when none of the cell's rows carries an to_split value.
    name: total_amount
    type: float
  - description: Largest to_split in this cell; 0 for a no-activity cell that has no rows at all, and 0 when none of the cell's rows carries an to_split value.
    name: max_amount
    type: float
  - description: max_amount divided by total_amount as a fraction, rounded to 4 decimal places; 0.0 when total_amount is 0.
    name: max_amount_share
    type: float
  description: Per-(technologies, measure state) distribution of linked techoutputsplit activity in the 082965_03_uiuc_mga.sql schema.
  grain: One row per (tech, measure state) pair represented among linked techoutputsplit rows; the absent state includes missing to_split values and a no-activity row for a technologies row with no links. A linked techoutputsplit row whose to_split has a value belongs only to the present state and never to the absent state.
