  transformation:
    steps:
    - description: Read source table technologies.
      operation: source
      order: 1
      source_inputs:
      - technologies
    - description: Read source table techoutputsplit.
      operation: source
      order: 2
      source_inputs:
      - techoutputsplit
    - carried_fields:
      - entity_key
      - entity_name
      description: Carry each tech and its tech_category into the measure-state calculation.
      operation: derive
      order: 3
      source_inputs:
      - technologies
    - carried_fields:
      - entity_key
      - entity_name
      - tech
      condition:
        public_identifiers:
        - techoutputsplit
        - tech
        - entity_key
      description: Bring the linked techoutputsplit rows into each technologies entity; retain an entity with no linked row so its absent state is visible.
      join_preservation: left
      operation: join
      order: 4
      source_inputs:
      - techoutputsplit
    - carried_fields:
      - entity_key
      - entity_name
      description: 'Keep the present measure-state rows: a real techoutputsplit row whose to_split has a value.'
      operation: filter
      order: 5
    - carried_fields:
      - entity_key
      - entity_name
      - row_count
      - distinct_amount_count
      - total_amount
      - max_amount
      description: One row per technologies entity that has at least one row in the present measure state, and no row here for an entity with none, reporting row count, how many different non-missing to_split values occur (each different value counted once, however many rows repeat it), total to_split, and largest to_split.
      operation: distinct
      order: 6
    - carried_fields:
      - entity_key
      - entity_name
      - row_count
      - distinct_amount_count
      - total_amount
      - max_amount
      - max_amount_share
      description: max_amount_share is max_amount divided by total_amount as a fraction, rounded to 4 decimal places; 0.0 when total_amount is 0.
      operation: ratio
      order: 7
      semantic_parameters:
        null_result: 0.0 when total_amount is 0
        rounding: ROUND to 4 decimal places
        units: fraction
    - carried_fields:
      - entity_key
      - measure_state
      - entity_name
      - row_count
      - distinct_amount_count
      - total_amount
      - max_amount
      - max_amount_share
      description: Label these measures as the present measure state.
      operation: derive
      order: 8
    - carried_fields:
      - entity_key
      - entity_name
      description: 'Keep the absent measure-state rows: to_split is missing, including the retained placeholder for a technologies row with no techoutputsplit rows. A real techoutputsplit row whose to_split has a value belongs only to the present state and never to this absent state.'
      operation: filter
      order: 9
    - carried_fields:
      - entity_key
      - entity_name
      - row_count
      - distinct_amount_count
      - total_amount
      - max_amount
      description: One row per technologies entity that has at least one row in the absent measure state, and no row here for an entity with none, reporting row count, how many different non-missing to_split values occur (each different value counted once, however many rows repeat it), total to_split, and largest to_split.
      operation: distinct
      order: 10
    - carried_fields:
      - entity_key
      - entity_name
      - row_count
      - distinct_amount_count
      - total_amount
      - max_amount
      - max_amount_share
      description: max_amount_share is max_amount divided by total_amount as a fraction, rounded to 4 decimal places; 0.0 when total_amount is 0.
      operation: ratio
      order: 11
      semantic_parameters:
        null_result: 0.0 when total_amount is 0
        rounding: ROUND to 4 decimal places
        units: fraction
    - carried_fields:
      - entity_key
      - measure_state
      - entity_name
      - row_count
      - distinct_amount_count
      - total_amount
      - max_amount
      - max_amount_share
      description: Label these measures as the absent measure state.
      operation: derive
      order: 12
    - carried_fields:
      - entity_key
      - measure_state
      - entity_name
      - row_count
      - distinct_amount_count
      - total_amount
      - max_amount
      - max_amount_share
      description: 'Stack the present-state summary and the absent-state summary into one output list: every present-state row and every absent-state row is its own output row, an entity with rows in both states appears twice, once per state, and the two summaries are never matched to each other.'
      operation: union
      order: 13
      semantic_parameters:
        mode: all
    - carried_fields:
      - entity_key
      - measure_state
      description: 'Deterministic output order: entity, then measure state.'
      operation: tie_break
      order: 14
- columns:
  - description: Identifier of the commodities row. One row per value.
    name: parent_key
    type: text
  - description: comm_desc of the commodities row, copied unchanged.
    name: parent_name
    type: text
  - description: The largest to_split itself; 0 when the parent has no techoutputsplit rows, and 0 when none of its rows carries a to_split value.
    name: top_measure
    type: float
  - description: 'How many techoutputsplit rows are tied at that largest to_split. 1 when exactly one row carries that largest to_split; 0 when there are no rows or when none of the rows carries a to_split value; a row with no to_split value never ties: only a row whose to_split value equals the largest value among the parent''s rows holds the maximum, so the winning row of a parent whose rows all lack a value — the row the tie-break alone selects — is not counted here.'
    name: tied_count
    type: bigint
  - description: 'Number of techoutputsplit rows for this commodities row; 0 when there are none. Every linked techoutputsplit row counts, whether or not it carries a to_split value. A commodities row kept with no techoutputsplit row reports 0 here, never 1: its placeholder holds no techoutputsplit row to count.'
    name: child_count
    type: bigint
  - description: Sum of to_split over all of them; 0 when the parent has no techoutputsplit rows, and 0 when none of its rows carries a to_split value (rows with no to_split value add nothing).
    name: total_measure
    type: float
  - description: The to_split_notes of the techoutputsplit row with the LARGEST to_split for this commodities row. Ties in to_split are broken by taking the SMALLEST to_split_notes under a plain case-sensitive comparison of the stored text (the warehouse default order, in which every uppercase letter sorts before every lowercase one) — a row with no to_split_notes value sorts after every labelled row. A row with no to_split value still ranks, after every row that has one, so a parent holding at least one techoutputsplit row always has a winning row — when NONE of its rows carries a to_split value the winner is the one the tie-break alone selects, not the no-rows default. The literal '(none)' when the parent has no techoutputsplit rows at all, and '(none)' when the winning row has no to_split_notes value.
    name: top_label
    type: text
  - description: top_measure divided by total_measure as a FRACTION between 0 and 1 (not a percentage), rounded to 4 decimals, 0.0 when total_measure is 0.
    name: top_measure_share
    type: float
  - description: '''empty'' when no row holds a maximum at all — the parent has no techoutputsplit rows, or none of its rows carries a to_split value — ''unique'' when exactly one row holds the maximum, ''tied'' when two or more do. Equivalently, tie_state follows tied_count: ''empty'' when tied_count is 0, ''unique'' when it is 1, ''tied'' when it is 2 or more. A row holds the maximum only when it carries a to_split value equal to the largest to_split value among the parent''s rows; a row with no to_split value never holds the maximum. So a parent whose techoutputsplit rows all lack a to_split value has no row holding the maximum and is ''empty'', with tied_count 0, even though the ranking still selects a winning row for it by the tie-break alone, which top_label names.'
    name: tie_state
    type: text
  description: 'Per-commodities extremes over linked techoutputsplit rows in the 082965_03_uiuc_mga.sql schema: WHICH row is largest, not how large it is.'
  grain: One row per commodities (comm_name), INCLUDING commodities rows with no linked techoutputsplit rows.
