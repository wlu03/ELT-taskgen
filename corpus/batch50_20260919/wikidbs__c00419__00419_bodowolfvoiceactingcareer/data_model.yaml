models:
- columns:
  - description: Identifier of the voiceactors row.
    name: entity_key
    type: text
  - description: '''present'' for a linked startrekepisodesfeaturingbodowolf row whose productioncode has a value; ''absent'' when productioncode is missing, including a voiceactors row with no linked startrekepisodesfeaturingbodowolf row. A linked startrekepisodesfeaturingbodowolf row whose productioncode has a value belongs only to the present state and never to the absent state.'
    name: measure_state
    type: text
  - description: actordescription of the voiceactors row, copied unchanged.
    name: entity_name
    type: text
  - description: Number of linked startrekepisodesfeaturingbodowolf rows in this entity/state cell; a absent cell holding real startrekepisodesfeaturingbodowolf rows whose productioncode is missing COUNTS those rows, and only the placeholder cell of a voiceactors row with no linked startrekepisodesfeaturingbodowolf row at all reports 0.
    name: row_count
    type: bigint
  - description: Number of unique non-missing productioncode values in this cell; each unique non-missing value is counted once, however many rows repeat it; 0 whenever the cell holds no productioncode value at all — both for a voiceactors row with no linked startrekepisodesfeaturingbodowolf row and for an absent cell whose rows all have a missing productioncode.
    name: distinct_amount_count
    type: bigint
  - description: Sum of productioncode in this cell; 0 for a no-activity cell that has no rows at all, and 0 when none of the cell's rows carries an productioncode value.
    name: total_amount
    type: integer
  - description: Largest productioncode in this cell; 0 for a no-activity cell that has no rows at all, and 0 when none of the cell's rows carries an productioncode value.
    name: max_amount
    type: integer
  - description: max_amount divided by total_amount as a fraction, rounded to 4 decimal places; 0.0 when total_amount is 0.
    name: max_amount_share
    type: float
  description: Per-(voiceactors, measure state) distribution of linked startrekepisodesfeaturingbodowolf rows in the BodoWolfVoiceActingCareer database.
