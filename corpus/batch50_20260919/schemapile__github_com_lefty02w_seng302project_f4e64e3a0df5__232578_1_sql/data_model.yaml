models:
- columns:
  - description: Identifier of the profile row. One row per value.
    name: parent_key
    type: integer
  - description: email of the profile row, copied unchanged.
    name: parent_name
    type: text
  - description: 'Number of undo_stack rows for this profile row; 0 when there are none. Every linked undo_stack row counts, whether or not it carries an object_id value. A profile row kept with no undo_stack row reports 0 here, never 1: its placeholder holds no undo_stack row to count.'
    name: event_count
    type: bigint
  - description: Sum of object_id over all matching undo_stack rows; 0 when there are no rows and when none of those rows carries an object_id value; a row with no object_id value adds nothing, so a group with some values sums the values it has.
    name: lifetime_amount
    type: integer
  - description: 'entry_id of the row with the latest time_created; ties take the smallest entry_id. It is 0 when there are no rows. Every undo_stack row of the profile row ranks, whether or not it carries a object_id value: the latest time_created wins even when that row''s object_id is missing.'
    name: latest_row_id
    type: integer
  - description: object_id from that same latest row; 0 when there are no rows or when the winning value is missing.
    name: latest_amount
    type: integer
  - description: item_type from that same latest row; '(none)' when there are no rows or when the winning value is missing.
    name: latest_label
    type: text
  - description: latest_amount divided by lifetime_amount as a fraction, rounded to 4 decimal places; 0.0 when lifetime_amount is 0. The division uses latest_amount as this mart reports it, after its default of 0 for a winning row whose object_id is missing, so such a row gives 0.0.
    name: latest_amount_share
    type: float
  description: Per-profile latest-row snapshot over linked undo_stack activity in the 232578_1.sql schema.
