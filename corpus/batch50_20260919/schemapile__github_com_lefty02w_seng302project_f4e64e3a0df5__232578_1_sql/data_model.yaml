- columns:
  - description: Identifier of the profile row. One row per value.
    name: parent_key
    type: integer
  - description: email of the profile row, copied unchanged.
    name: parent_name
    type: text
  - description: The largest object_id itself; 0 when the parent has no undo_stack rows, and 0 when none of its rows carries a object_id value.
    name: top_measure
    type: integer
  - description: 'How many undo_stack rows are tied at that largest object_id. 1 when exactly one row carries that largest object_id; 0 when there are no rows or when none of the rows carries a object_id value; a row with no object_id value never ties: only a row whose object_id value equals the largest value among the parent''s rows holds the maximum, so the winning row of a parent whose rows all lack a value — the row the tie-break alone selects — is not counted here.'
    name: tied_count
    type: bigint
  - description: 'Number of undo_stack rows for this profile row; 0 when there are none. Every linked undo_stack row counts, whether or not it carries an object_id value. A profile row kept with no undo_stack row reports 0 here, never 1: its placeholder holds no undo_stack row to count.'
    name: child_count
    type: bigint
  - description: Sum of object_id over all of them; 0 when the parent has no undo_stack rows, and 0 when none of its rows carries a object_id value (rows with no object_id value add nothing).
    name: total_measure
    type: integer
  - description: The item_type of the undo_stack row with the LARGEST object_id for this profile row. Ties in object_id are broken by taking the SMALLEST item_type under a plain case-sensitive comparison of the stored text (the warehouse default order, in which every uppercase letter sorts before every lowercase one) — a row with no item_type value sorts after every labelled row; rows tied on both are resolved by the smallest entry_id. A row with no object_id value still ranks, after every row that has one, so a parent holding at least one undo_stack row always has a winning row — when NONE of its rows carries a object_id value the winner is the one the tie-break alone selects, not the no-rows default. The literal '(none)' when the parent has no undo_stack rows at all, and '(none)' when the winning row has no item_type value.
    name: top_label
    type: text
  - description: The entry_id of that same extremal row — the winner under the SAME total order, so it is the identifier of a real undo_stack row whenever the parent has any. This includes when none of them carries a object_id value. It is 0 when there are no rows, and only then. It identifies WHICH row won, so a tie resolved the wrong way is visible even when two rows share a label.
    name: top_row_id
    type: integer
  - description: top_measure divided by total_measure as a FRACTION between 0 and 1 (not a percentage), rounded to 4 decimals, 0.0 when total_measure is 0.
    name: top_measure_share
    type: float
  - description: '''empty'' when no row holds a maximum at all — the parent has no undo_stack rows, or none of its rows carries a object_id value — ''unique'' when exactly one row holds the maximum, ''tied'' when two or more do. Equivalently, tie_state follows tied_count: ''empty'' when tied_count is 0, ''unique'' when it is 1, ''tied'' when it is 2 or more. A row holds the maximum only when it carries a object_id value equal to the largest object_id value among the parent''s rows; a row with no object_id value never holds the maximum. So a parent whose undo_stack rows all lack a object_id value has no row holding the maximum and is ''empty'', with tied_count 0, even though the ranking still selects a winning row for it by the tie-break alone, which top_label and top_row_id name.'
    name: tie_state
    type: text
  description: 'Per-profile extremes over linked undo_stack rows in the 232578_1.sql schema: WHICH row is largest, not how large it is.'
