  transformation:
    steps:
    - description: Read source table profile.
      operation: source
      order: 1
      source_inputs:
      - profile
    - description: Read source table undo_stack.
      operation: source
      order: 2
      source_inputs:
      - undo_stack
    - carried_fields:
      - parent_key
      - parent_name
      description: One row per profile row, keyed by profile_id.
      operation: derive
      order: 3
      source_inputs:
      - profile
    - carried_fields:
      - profile_id
      condition:
        public_identifiers:
        - undo_stack
        - profile_id
        - parent_key
      description: Bring in undo_stack; a profile row with no matching undo_stack row is retained and receives the stated empty snapshot values.
      join_preservation: left
      operation: join
      order: 4
      source_inputs:
      - undo_stack
    - carried_fields:
      - parent_key
      - parent_name
      - event_count
      - lifetime_amount
      description: 'One output row per parent_key, carrying parent_name beside the keys: a key value identifies one source row for the carried columns, so they take one value per key and never split a group, reporting event_count, lifetime_amount for that row''s matching rows.'
      operation: aggregate
      order: 5
    - carried_fields:
      - parent_key
      - latest_row_id
      - latest_amount
      - latest_label
      description: Keep the single row per parent_key at which the ordering measure is largest, ties broken by the smallest entry_id, and take latest_row_id, latest_amount, latest_label from that winning row. The ordering measure is required on every real input row, so a non-empty group always has a winning row; the declared defaults belong only to a group with NO rows.
      operation: extrema
      order: 6
    - carried_fields:
      - parent_key
      condition:
        public_identifiers:
        - parent_key
      description: Attach the extremal row's attributes to the grouped measures. LEFT, so a group with no rows at all keeps its measures.
      join_preservation: left
      operation: join
      order: 7
    - carried_fields:
      - parent_key
      - parent_name
      - event_count
      - lifetime_amount
      - latest_row_id
      - latest_amount
      - latest_label
      description: Name the mart columns; lifetime_amount reports its declared default — never NULL — for a group with no matching rows. For lifetime_amount, the default also applies to a group none of whose real rows carries an input value.
      operation: derive
      order: 8
    - carried_fields:
      - parent_key
      - parent_name
      - event_count
      - lifetime_amount
      - latest_row_id
      - latest_amount
      - latest_label
      - latest_amount_share
      description: 'Guarded ratios: latest_amount_share — latest_amount divided by lifetime_amount as a fraction, rounded to 4 decimal places; 0.0 when lifetime_amount is 0. The division uses latest_amount as this mart reports it, after its default of 0 for a winning row whose object_id is missing, so such a row gives 0.0.'
      operation: ratio
      order: 9
      semantic_parameters:
        null_result: 0.0 when the denominator is 0 or NULL
        rounding: ROUND to 4 decimal places
        units: fraction
    - carried_fields:
      - parent_key
      description: 'Deterministic output order: sort by parent_key.'
      operation: tie_break
      order: 10
- columns:
  - description: Identifier of the destination row.
    name: entity_key
    type: integer
  - description: '''present'' for a linked treasure_hunt row; ''absent'' only for a destination row with no linked treasure_hunt row. soft_delete is required on every real treasure_hunt row.'
    name: measure_state
    type: text
  - description: country of the destination row, copied unchanged.
    name: entity_name
    type: text
  - description: Number of linked treasure_hunt rows in this entity/state cell; 0 for a no-activity absent cell.
    name: row_count
    type: bigint
  - description: Number of unique soft_delete values in this cell; each unique value is counted once, however many rows repeat it; 0 for a no-activity absent cell.
    name: distinct_amount_count
    type: bigint
  - description: Sum of soft_delete in this cell; 0 for a no-activity absent cell.
    name: total_amount
    type: integer
  - description: Largest soft_delete in this cell; 0 for a no-activity absent cell.
    name: max_amount
    type: integer
  - description: max_amount divided by total_amount as a fraction, rounded to 4 decimal places; 0.0 when total_amount is 0.
    name: max_amount_share
    type: float
