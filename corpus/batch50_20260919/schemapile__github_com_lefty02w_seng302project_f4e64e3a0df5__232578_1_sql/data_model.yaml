    - description: Read source table treasure_hunt.
      operation: source
      order: 2
      source_inputs:
      - treasure_hunt
    - carried_fields:
      - entity_key
      - entity_name
      description: Carry each destination_id and its country into the measure-state calculation.
      operation: derive
      order: 3
      source_inputs:
      - destination
    - carried_fields:
      - entity_key
      - entity_name
      - destination_id
      condition:
        public_identifiers:
        - treasure_hunt
        - destination_id
        - entity_key
      description: Bring the linked treasure_hunt rows into each destination entity; retain an entity with no linked row so its absent state is visible.
      join_preservation: left
      operation: join
      order: 4
      source_inputs:
      - treasure_hunt
    - carried_fields:
      - entity_key
      - entity_name
      description: 'Keep the present measure-state rows: a real treasure_hunt row; soft_delete is required on every such row.'
      operation: filter
      order: 5
    - carried_fields:
      - entity_key
      - entity_name
      - row_count
      - distinct_amount_count
      - total_amount
      - max_amount
      description: One row per destination entity that has at least one row in the present measure state, and no row here for an entity with none, reporting row count, how many different soft_delete values occur (each different value counted once, however many rows repeat it), total soft_delete, and largest soft_delete.
      operation: distinct
      order: 6
    - carried_fields:
      - entity_key
      - entity_name
      - row_count
      - distinct_amount_count
      - total_amount
      - max_amount
