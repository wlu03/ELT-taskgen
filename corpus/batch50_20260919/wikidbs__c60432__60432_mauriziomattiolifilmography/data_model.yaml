models:
- columns:
  - description: Identifier of the italianfilmproducers row.
    name: entity_key
    type: text
  - description: '''present'' for a linked filmographydetails row; ''absent'' only for a italianfilmproducers row with no linked filmographydetails row. filmduration is required on every real filmographydetails row.'
    name: measure_state
    type: text
  - description: biography of the italianfilmproducers row, copied unchanged.
    name: entity_name
    type: text
  - description: Number of linked filmographydetails rows in this entity/state cell; 0 for a no-activity absent cell.
    name: row_count
    type: bigint
  - description: Number of unique filmduration values in this cell; each unique value is counted once, however many rows repeat it; 0 for a no-activity absent cell.
    name: distinct_amount_count
    type: bigint
  - description: Sum of filmduration in this cell; 0 for a no-activity absent cell.
    name: total_amount
    type: integer
  - description: Largest filmduration in this cell; 0 for a no-activity absent cell.
    name: max_amount
    type: integer
  - description: max_amount divided by total_amount as a fraction, rounded to 4 decimal places; 0.0 when total_amount is 0.
    name: max_amount_share
    type: float
  description: Per-(italianfilmproducers, measure state) distribution of linked filmographydetails rows in the MaurizioMattioliFilmography database.
  grain: One row per (producername, measure state) pair represented by linked filmographydetails rows, plus one absent no-activity row for a italianfilmproducers row with no links. Because filmduration is required, no linked filmographydetails row belongs to the absent state.
  key_columns:
  - entity_key
  - measure_state
  name: italianfilmproducers_filmographydetails_distribution
  source_relationships:
  - child_columns:
    - castmember
    child_table: filmographydetails
    parent_columns:
    - actorname
    parent_table: filmographycastmembers
    required: true
  - child_columns:
    - filmcomposer
    child_table: filmographydetails
    parent_columns:
    - artistname
    parent_table: italianartists
    required: false
  - child_columns:
    - filmdirector
    child_table: filmographydetails
    parent_columns:
    - directorname
    parent_table: filmdirectors
    required: false
  - child_columns:
    - filmeditor
    child_table: filmographydetails
    parent_columns:
    - fullname
    parent_table: italianfilmeditors
    required: false
  - child_columns:
    - filmproducer
    child_table: filmographydetails
    parent_columns:
    - producername
    parent_table: italianfilmproducers
    required: false
  - child_columns:
    - filmscreenwriter
    child_table: filmographydetails
    parent_columns:
    - fullname
    parent_table: filmindustryprofessionals
    required: false
  transformation:
    steps:
    - description: Read source table italianfilmproducers.
      operation: source
      order: 1
      source_inputs:
      - italianfilmproducers
    - description: Read source table filmographydetails.
      operation: source
      order: 2
      source_inputs:
      - filmographydetails
    - carried_fields:
      - entity_key
      - entity_name
      description: Carry each producername and its biography into the measure-state calculation.
      operation: derive
      order: 3
      source_inputs:
      - italianfilmproducers
    - carried_fields:
      - entity_key
      - entity_name
      - producername
      - filmproducer
      condition:
        public_identifiers:
        - filmographydetails
        - filmproducer
        - entity_key
      description: Bring the linked filmographydetails rows into each italianfilmproducers entity; retain an entity with no linked row so its absent state is visible.
      join_preservation: left
      operation: join
      order: 4
      source_inputs:
      - filmographydetails
    - carried_fields:
      - entity_key
      - entity_name
      description: 'Keep the present measure-state rows: a real filmographydetails row; filmduration is required on every such row.'
      operation: filter
      order: 5
    - carried_fields:
      - entity_key
      - entity_name
      - row_count
      - distinct_amount_count
      - total_amount
      - max_amount
      description: One row per italianfilmproducers entity that has at least one row in the present measure state, and no row here for an entity with none, reporting row count, how many different filmduration values occur (each different value counted once, however many rows repeat it), total filmduration, and largest filmduration.
      operation: distinct
      order: 6
    - carried_fields:
      - entity_key
      - entity_name
      - row_count
      - distinct_amount_count
      - total_amount
      - max_amount
      - max_amount_share
      description: max_amount_share is max_amount divided by total_amount as a fraction, rounded to 4 decimal places; 0.0 when total_amount is 0.
      operation: ratio
      order: 7
      semantic_parameters:
        null_result: 0.0 when total_amount is 0
        rounding: ROUND to 4 decimal places
        units: fraction
    - carried_fields:
      - entity_key
      - measure_state
      - entity_name
      - row_count
      - distinct_amount_count
      - total_amount
      - max_amount
      - max_amount_share
      description: Label these measures as the present measure state.
      operation: derive
      order: 8
    - carried_fields:
      - entity_key
      - entity_name
      description: 'Keep the absent measure-state rows: the retained placeholder for a italianfilmproducers row with no filmographydetails rows; no real row can enter this state because filmduration is required.'
      operation: filter
      order: 9
    - carried_fields:
      - entity_key
      - entity_name
      - row_count
      - distinct_amount_count
      - total_amount
      - max_amount
      description: One row per italianfilmproducers entity with no linked filmographydetails row at all, whose retained placeholder is its one row in the absent measure state, and no row here for an entity that has a linked filmographydetails row, reporting a row count of 0, 0 different filmduration values, a total filmduration of 0 and a largest filmduration of 0.
      operation: distinct
      order: 10
    - carried_fields:
      - entity_key
      - entity_name
      - row_count
      - distinct_amount_count
      - total_amount
      - max_amount
      - max_amount_share
      description: max_amount_share is max_amount divided by total_amount as a fraction, rounded to 4 decimal places; 0.0 when total_amount is 0.
      operation: ratio
      order: 11
      semantic_parameters:
        null_result: 0.0 when total_amount is 0
        rounding: ROUND to 4 decimal places
        units: fraction
    - carried_fields:
      - entity_key
      - measure_state
      - entity_name
      - row_count
      - distinct_amount_count
      - total_amount
      - max_amount
      - max_amount_share
      description: Label these measures as the absent measure state.
      operation: derive
      order: 12
    - carried_fields:
      - entity_key
      - measure_state
      - entity_name
      - row_count
      - distinct_amount_count
      - total_amount
      - max_amount
      - max_amount_share
      description: 'Stack the present-state summary and the absent-state summary into one output list: every present-state row and every absent-state row is its own output row, an entity with rows in both states appears twice, once per state, and the two summaries are never matched to each other.'
      operation: union
      order: 13
      semantic_parameters:
        mode: all
    - carried_fields:
      - entity_key
      - measure_state
      description: 'Deterministic output order: entity, then measure state.'
      operation: tie_break
      order: 14
