models:
- columns:
  - description: Identifier of the countries row.
    name: entity_key
    type: integer
  - description: '''passing'' for source values [''WHO'']; ''failing'' for values [''CDC'', ''local health authorities'']; ''no_activity'' when the countries row has no linked vaccination_data row. A linked vaccination_data row whose source has no value belongs to no cohort: it is not counted in any cell, and it does not make the countries row ''no_activity''.'
    name: cohort
    type: text
  - description: country_name of the countries row, copied unchanged.
    name: entity_name
    type: text
  - description: Number of vaccination_data rows in this entity/cohort cell.
    name: link_count
    type: bigint
  - description: Number of distinct source values represented in this cell.
    name: distinct_status_count
    type: bigint
  - description: Sum of people_fully_vaccinated_per_hundred in this cell; 0 for a no-activity cell that has no rows at all, and 0 when none of the cell's rows carries an people_fully_vaccinated_per_hundred value.
    name: total_amount
    type: float
  - description: Largest people_fully_vaccinated_per_hundred in this cell; 0 for a no-activity cell that has no rows at all, and 0 when none of the cell's rows carries an people_fully_vaccinated_per_hundred value.
    name: max_amount
    type: float
  - description: max_amount divided by total_amount as a fraction, rounded to 4 decimal places; 0.0 when total_amount is 0.
    name: max_amount_share
    type: float
  description: Per-(countries, status cohort) summary of linked vaccination_data rows in the __covid_19_pandemic_data_tracking_and_analysis__ scenario, with passing and failing cohorts kept separate.
  grain: One row per (country_id, status cohort) pair represented among linked vaccination_data rows, plus one no-activity row for a countries row with no linked vaccination_data row at all. A countries row whose linked vaccination_data rows all lack a source value is in no cohort and gets no no-activity row, so it has no row in this mart.
  key_columns:
  - entity_key
  - cohort
  name: countries_vaccination_data_cohorts
  source_relationships:
  - child_columns:
    - country_id
    child_table: covid_metrics
    parent_columns:
    - country_id
    parent_table: countries
    required: false
  - child_columns:
    - country_id
    child_table: stringency_measures
    parent_columns:
    - country_id
    parent_table: countries
    required: false
  - child_columns:
    - country_id
    child_table: testing_data
    parent_columns:
    - country_id
    parent_table: countries
    required: false
  - child_columns:
    - country_id
    child_table: vaccination_data
    parent_columns:
    - country_id
    parent_table: countries
    required: false
  transformation:
    steps:
    - description: Read source table countries.
      operation: source
      order: 1
      source_inputs:
      - countries
    - description: Read source table vaccination_data.
      operation: source
      order: 2
      source_inputs:
      - vaccination_data
    - carried_fields:
      - entity_key
      - entity_name
      description: Carry each country_id and its country_name into the cohort calculation.
      operation: derive
      order: 3
      source_inputs:
      - countries
    - carried_fields:
      - entity_key
      - entity_name
      - country_id
      condition:
        public_identifiers:
        - vaccination_data
        - country_id
        - entity_key
      description: Bring the linked vaccination_data rows into each countries entity before assigning status cohorts.
      join_preservation: left
      operation: join
      order: 4
      source_inputs:
      - vaccination_data
    - carried_fields:
      - entity_key
      - entity_name
      condition:
        literal_values:
        - WHO
      description: Keep rows whose source belongs to the passing cohort values ['WHO'].
      operation: filter
      order: 5
    - carried_fields:
      - entity_key
      - entity_name
      - link_count
      - distinct_status_count
      - total_amount
      - max_amount
      description: One row per countries entity that has at least one linked vaccination_data row in the passing cohort, reporting the number of those rows, how many different source values occur among them, the total of their people_fully_vaccinated_per_hundred, and their largest people_fully_vaccinated_per_hundred. The total and the largest value read only the rows that carry a people_fully_vaccinated_per_hundred value; a cohort whose rows all lack one reports 0 for both, never empty.
      operation: distinct
      order: 6
    - carried_fields:
      - entity_key
      - entity_name
      - link_count
      - distinct_status_count
      - total_amount
      - max_amount
      - max_amount_share
      description: max_amount_share is max_amount divided by total_amount as a fraction, rounded to 4 decimal places; 0.0 when total_amount is 0.
      operation: ratio
      order: 7
      semantic_parameters:
        null_result: 0.0 when total_amount is 0
        rounding: ROUND to 4 decimal places
        units: fraction
    - carried_fields:
      - entity_key
      - cohort
      - entity_name
      - link_count
      - distinct_status_count
      - total_amount
      - max_amount
      - max_amount_share
      description: Label these measures as the passing cohort.
      operation: derive
      order: 8
    - carried_fields:
      - entity_key
      - entity_name
      condition:
        literal_values:
        - CDC
        - local health authorities
      description: Keep rows whose source belongs to the failing cohort values ['CDC', 'local health authorities'].
      operation: filter
      order: 9
    - carried_fields:
      - entity_key
      - entity_name
      - link_count
      - distinct_status_count
      - total_amount
      - max_amount
      description: One row per countries entity that has at least one linked vaccination_data row in the failing cohort, reporting the number of those rows, how many different source values occur among them, the total of their people_fully_vaccinated_per_hundred, and their largest people_fully_vaccinated_per_hundred. The total and the largest value read only the rows that carry a people_fully_vaccinated_per_hundred value; a cohort whose rows all lack one reports 0 for both, never empty.
      operation: distinct
      order: 10
    - carried_fields:
      - entity_key
      - entity_name
      - link_count
      - distinct_status_count
      - total_amount
      - max_amount
      - max_amount_share
      description: max_amount_share is max_amount divided by total_amount as a fraction, rounded to 4 decimal places; 0.0 when total_amount is 0.
      operation: ratio
      order: 11
      semantic_parameters:
        null_result: 0.0 when total_amount is 0
        rounding: ROUND to 4 decimal places
        units: fraction
    - carried_fields:
      - entity_key
      - cohort
      - entity_name
      - link_count
      - distinct_status_count
      - total_amount
      - max_amount
      - max_amount_share
      description: Label these measures as the failing cohort.
      operation: derive
      order: 12
    - carried_fields:
      - entity_key
      - entity_name
      description: Keep the placeholder row for a countries entity with no linked vaccination_data row at all; a countries entity that has linked vaccination_data rows gets no placeholder, even when every one of those rows lacks a source value.
      operation: filter
      order: 13
    - carried_fields:
      - entity_key
      - entity_name
      - link_count
      - distinct_status_count
      - total_amount
      - max_amount
      description: One row per countries entity with no linked vaccination_data row at all, reporting 0 rows, 0 different source values, a people_fully_vaccinated_per_hundred total of 0 and a largest people_fully_vaccinated_per_hundred of 0.
      operation: distinct
      order: 14
    - carried_fields:
      - entity_key
      - entity_name
      - link_count
      - distinct_status_count
      - total_amount
      - max_amount
      - max_amount_share
      description: max_amount_share is max_amount divided by total_amount as a fraction, rounded to 4 decimal places; 0.0 when total_amount is 0.
      operation: ratio
      order: 15
      semantic_parameters:
        null_result: 0.0 when total_amount is 0
        rounding: ROUND to 4 decimal places
        units: fraction
    - carried_fields:
      - entity_key
      - cohort
      - entity_name
      - link_count
      - distinct_status_count
      - total_amount
      - max_amount
      - max_amount_share
      description: Label these measures as the no_activity cohort.
      operation: derive
      order: 16
    - carried_fields:
      - entity_key
      - cohort
      - entity_name
      - link_count
      - distinct_status_count
      - total_amount
      - max_amount
      - max_amount_share
      description: Combine the disjoint passing and failing cohort summaries.
      operation: union
      order: 17
      semantic_parameters:
        mode: all
    - carried_fields:
      - entity_key
      - cohort
      - entity_name
      - link_count
      - distinct_status_count
      - total_amount
      - max_amount
      - max_amount_share
      description: Add the no-activity summaries, so an entity with no linked rows is retained as one explicit cohort row.
      operation: union
      order: 18
      semantic_parameters:
        mode: all
    - carried_fields:
      - entity_key
      - cohort
      description: 'Deterministic output order: entity, then cohort.'
      operation: tie_break
      order: 19
- columns:
  - description: Identifier of the countries row.
    name: entity_key
    type: integer
  - description: '''present'' for a linked vaccination_data row whose people_fully_vaccinated_per_hundred has a value; ''absent'' when people_fully_vaccinated_per_hundred is missing, including a countries row with no linked vaccination_data row. A linked vaccination_data row whose people_fully_vaccinated_per_hundred has a value belongs only to the present state and never to the absent state.'
    name: measure_state
    type: text
  - description: country_name of the countries row, copied unchanged.
    name: entity_name
    type: text
  - description: Number of linked vaccination_data rows in this entity/state cell; a absent cell holding real vaccination_data rows whose people_fully_vaccinated_per_hundred is missing COUNTS those rows, and only the placeholder cell of a countries row with no linked vaccination_data row at all reports 0.
    name: row_count
    type: bigint
  - description: Number of unique non-missing people_fully_vaccinated_per_hundred values in this cell; each unique non-missing value is counted once, however many rows repeat it; 0 whenever the cell holds no people_fully_vaccinated_per_hundred value at all — both for a countries row with no linked vaccination_data row and for an absent cell whose rows all have a missing people_fully_vaccinated_per_hundred.
    name: distinct_amount_count
    type: bigint
  - description: Sum of people_fully_vaccinated_per_hundred in this cell; 0 for a no-activity cell that has no rows at all, and 0 when none of the cell's rows carries an people_fully_vaccinated_per_hundred value.
    name: total_amount
    type: float
  - description: Largest people_fully_vaccinated_per_hundred in this cell; 0 for a no-activity cell that has no rows at all, and 0 when none of the cell's rows carries an people_fully_vaccinated_per_hundred value.
    name: max_amount
    type: float
  - description: max_amount divided by total_amount as a fraction, rounded to 4 decimal places; 0.0 when total_amount is 0.
    name: max_amount_share
    type: float
  description: Per-(countries, measure state) distribution of linked vaccination_data rows in the __covid_19_pandemic_data_tracking_and_analysis__ scenario.
  grain: One row per (country_id, measure state) pair represented among linked vaccination_data rows; the absent state includes missing people_fully_vaccinated_per_hundred values and a no-activity row for a countries row with no links. A linked vaccination_data row whose people_fully_vaccinated_per_hundred has a value belongs only to the present state and never to the absent state.
  key_columns:
  - entity_key
  - measure_state
  name: countries_vaccination_data_distribution
  source_relationships:
  - child_columns:
    - country_id
    child_table: covid_metrics
    parent_columns:
    - country_id
    parent_table: countries
    required: false
  - child_columns:
    - country_id
    child_table: stringency_measures
    parent_columns:
    - country_id
    parent_table: countries
    required: false
  - child_columns:
    - country_id
    child_table: testing_data
    parent_columns:
    - country_id
    parent_table: countries
    required: false
  - child_columns:
    - country_id
    child_table: vaccination_data
    parent_columns:
    - country_id
    parent_table: countries
    required: false
  transformation:
    steps:
    - description: Read source table countries.
      operation: source
      order: 1
      source_inputs:
      - countries
    - description: Read source table vaccination_data.
      operation: source
      order: 2
      source_inputs:
      - vaccination_data
    - carried_fields:
      - entity_key
      - entity_name
      description: Carry each country_id and its country_name into the measure-state calculation.
      operation: derive
      order: 3
      source_inputs:
      - countries
    - carried_fields:
      - entity_key
      - entity_name
      - country_id
      condition:
        public_identifiers:
        - vaccination_data
        - country_id
        - entity_key
      description: Bring the linked vaccination_data rows into each countries entity; retain an entity with no linked row so its absent state is visible.
      join_preservation: left
      operation: join
      order: 4
      source_inputs:
      - vaccination_data
    - carried_fields:
      - entity_key
      - entity_name
      description: 'Keep the present measure-state rows: a real vaccination_data row whose people_fully_vaccinated_per_hundred has a value.'
      operation: filter
      order: 5
    - carried_fields:
      - entity_key
      - entity_name
      - row_count
      - distinct_amount_count
      - total_amount
      - max_amount
      description: One row per countries entity that has at least one row in the present measure state, and no row here for an entity with none, reporting row count, how many different non-missing people_fully_vaccinated_per_hundred values occur (each different value counted once, however many rows repeat it), total people_fully_vaccinated_per_hundred, and largest people_fully_vaccinated_per_hundred.
      operation: distinct
      order: 6
    - carried_fields:
      - entity_key
      - entity_name
      - row_count
      - distinct_amount_count
      - total_amount
      - max_amount
      - max_amount_share
      description: max_amount_share is max_amount divided by total_amount as a fraction, rounded to 4 decimal places; 0.0 when total_amount is 0.
      operation: ratio
      order: 7
      semantic_parameters:
        null_result: 0.0 when total_amount is 0
        rounding: ROUND to 4 decimal places
        units: fraction
    - carried_fields:
      - entity_key
      - measure_state
      - entity_name
      - row_count
      - distinct_amount_count
      - total_amount
      - max_amount
      - max_amount_share
      description: Label these measures as the present measure state.
      operation: derive
      order: 8
    - carried_fields:
      - entity_key
      - entity_name
      description: 'Keep the absent measure-state rows: people_fully_vaccinated_per_hundred is missing, including the retained placeholder for a countries row with no vaccination_data rows. A real vaccination_data row whose people_fully_vaccinated_per_hundred has a value belongs only to the present state and never to this absent state.'
      operation: filter
      order: 9
    - carried_fields:
      - entity_key
      - entity_name
      - row_count
      - distinct_amount_count
      - total_amount
      - max_amount
      description: One row per countries entity that has at least one row in the absent measure state, and no row here for an entity with none, reporting row count, how many different non-missing people_fully_vaccinated_per_hundred values occur (each different value counted once, however many rows repeat it), total people_fully_vaccinated_per_hundred, and largest people_fully_vaccinated_per_hundred.
      operation: distinct
      order: 10
    - carried_fields:
      - entity_key
      - entity_name
      - row_count
      - distinct_amount_count
      - total_amount
      - max_amount
      - max_amount_share
      description: max_amount_share is max_amount divided by total_amount as a fraction, rounded to 4 decimal places; 0.0 when total_amount is 0.
      operation: ratio
      order: 11
      semantic_parameters:
        null_result: 0.0 when total_amount is 0
        rounding: ROUND to 4 decimal places
        units: fraction
    - carried_fields:
      - entity_key
      - measure_state
      - entity_name
      - row_count
      - distinct_amount_count
      - total_amount
      - max_amount
      - max_amount_share
      description: Label these measures as the absent measure state.
      operation: derive
      order: 12
    - carried_fields:
      - entity_key
      - measure_state
      - entity_name
      - row_count
      - distinct_amount_count
      - total_amount
      - max_amount
      - max_amount_share
      description: 'Stack the present-state summary and the absent-state summary into one output list: every present-state row and every absent-state row is its own output row, an entity with rows in both states appears twice, once per state, and the two summaries are never matched to each other.'
      operation: union
      order: 13
      semantic_parameters:
        mode: all
    - carried_fields:
      - entity_key
      - measure_state
      description: 'Deterministic output order: entity, then measure state.'
      operation: tie_break
      order: 14
