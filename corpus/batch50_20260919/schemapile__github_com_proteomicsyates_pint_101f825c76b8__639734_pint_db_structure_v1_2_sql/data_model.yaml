- columns:
  - description: Identifier of the interactome_db_ptm row. One row per value.
    name: parent_key
    type: integer
  - description: cv_id of the interactome_db_ptm row, copied unchanged.
    name: parent_name
    type: text
  - description: The largest position itself; 0 when the parent has no interactome_db_ptm_site rows.
    name: top_measure
    type: integer
  - description: How many interactome_db_ptm_site rows are tied at that largest position. 1 when exactly one row carries that largest position; 0 when there are no rows.
    name: tied_count
    type: bigint
  - description: 'Number of interactome_db_ptm_site rows for this interactome_db_ptm row; 0 when there are none. An interactome_db_ptm row kept with no interactome_db_ptm_site row reports 0 here, never 1: its placeholder holds no interactome_db_ptm_site row to count.'
    name: child_count
    type: bigint
  - description: Sum of position over all of them; 0 when the parent has no interactome_db_ptm_site rows.
    name: total_measure
    type: integer
  - description: The aa of the interactome_db_ptm_site row with the LARGEST position for this interactome_db_ptm row. Ties in position are broken by taking the SMALLEST aa under a plain case-sensitive comparison of the stored text (the warehouse default order, in which every uppercase letter sorts before every lowercase one); rows tied on both are resolved by the smallest id. The literal '(none)' when the parent has no interactome_db_ptm_site rows at all.
    name: top_label
    type: text
  - description: The id of that same extremal row — the winner under the SAME total order, so it is the identifier of a real interactome_db_ptm_site row whenever the parent has any. It is 0 when there are no rows, and only then. It identifies WHICH row won, so a tie resolved the wrong way is visible even when two rows share a label.
    name: top_row_id
    type: integer
  - description: top_measure divided by total_measure as a FRACTION between 0 and 1 (not a percentage), rounded to 4 decimals, 0.0 when total_measure is 0.
    name: top_measure_share
    type: float
  - description: '''empty'' when no row holds a maximum at all — the parent has no interactome_db_ptm_site rows — ''unique'' when exactly one row holds the maximum, ''tied'' when two or more do. Equivalently, tie_state follows tied_count: ''empty'' when tied_count is 0, ''unique'' when it is 1, ''tied'' when it is 2 or more.'
    name: tie_state
    type: text
  description: 'Per-interactome_db_ptm extremes over linked interactome_db_ptm_site rows in the 639734_pint_DB_structure_v1.2.sql schema: WHICH row is largest, not how large it is.'
  grain: One row per interactome_db_ptm (id), INCLUDING interactome_db_ptm rows with no linked interactome_db_ptm_site rows.
