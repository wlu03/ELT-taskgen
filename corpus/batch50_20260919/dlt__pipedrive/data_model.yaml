models:
- columns:
  - description: Identifier of the deals row.
    name: entity_key
    type: bigint
  - description: '''present'' for a linked deals_participants row whose participant_share has a value; ''absent'' when participant_share is missing, including a deals row with no linked deals_participants row. A linked deals_participants row whose participant_share has a value belongs only to the present state and never to the absent state.'
    name: measure_state
    type: text
  - description: deal_title of the deals row, copied unchanged.
    name: entity_name
    type: text
  - description: Number of linked deals_participants rows in this entity/state cell; a absent cell holding real deals_participants rows whose participant_share is missing COUNTS those rows, and only the placeholder cell of a deals row with no linked deals_participants row at all reports 0.
    name: row_count
    type: bigint
  - description: Number of unique non-missing participant_share values in this cell; each unique non-missing value is counted once, however many rows repeat it; 0 whenever the cell holds no participant_share value at all — both for a deals row with no linked deals_participants row and for an absent cell whose rows all have a missing participant_share.
    name: distinct_amount_count
    type: bigint
  - description: Sum of participant_share in this cell; 0 for a no-activity cell that has no rows at all, and 0 when none of the cell's rows carries an participant_share value.
    name: total_amount
    type: decimal
  - description: Largest participant_share in this cell; 0 for a no-activity cell that has no rows at all, and 0 when none of the cell's rows carries an participant_share value.
    name: max_amount
    type: decimal
  - description: max_amount divided by total_amount as a fraction, rounded to 4 decimal places; 0.0 when total_amount is 0.
    name: max_amount_share
    type: float
  description: Per-(deals, measure state) distribution of extracted deals_participants records.
  grain: One row per (id, measure state) pair represented among linked deals_participants rows; the absent state includes missing participant_share values and a no-activity row for a deals row with no links. A linked deals_participants row whose participant_share has a value belongs only to the present state and never to the absent state.
  key_columns:
  - entity_key
  - measure_state
  name: deals_participants_distribution
  source_relationships:
  - child_columns:
    - _deals_id
    child_table: deals_flow
    parent_columns:
    - id
    parent_table: deals
    required: true
  - child_columns:
    - _deals_id
    child_table: deals_participants
    parent_columns:
    - id
    parent_table: deals
    required: true
  transformation:
    steps:
    - description: Read source table deals.
      operation: source
      order: 1
      source_inputs:
      - deals
    - description: Read source table deals_participants.
      operation: source
      order: 2
      source_inputs:
      - deals_participants
    - carried_fields:
      - entity_key
      - entity_name
      description: Carry each id and its deal_title into the measure-state calculation.
      operation: derive
      order: 3
      source_inputs:
      - deals
    - carried_fields:
      - entity_key
      - entity_name
      - id
      - _deals_id
      condition:
        public_identifiers:
        - deals_participants
        - _deals_id
        - entity_key
      description: Bring the linked deals_participants rows into each deals entity; retain an entity with no linked row so its absent state is visible.
      join_preservation: left
      operation: join
      order: 4
      source_inputs:
      - deals_participants
    - carried_fields:
      - entity_key
      - entity_name
      description: 'Keep the present measure-state rows: a real deals_participants row whose participant_share has a value.'
      operation: filter
      order: 5
    - carried_fields:
      - entity_key
      - entity_name
      - row_count
      - distinct_amount_count
      - total_amount
      - max_amount
      description: One row per deals entity that has at least one row in the present measure state, and no row here for an entity with none, reporting row count, how many different non-missing participant_share values occur (each different value counted once, however many rows repeat it), total participant_share, and largest participant_share.
      operation: distinct
      order: 6
    - carried_fields:
      - entity_key
      - entity_name
      - row_count
      - distinct_amount_count
      - total_amount
      - max_amount
      - max_amount_share
      description: max_amount_share is max_amount divided by total_amount as a fraction, rounded to 4 decimal places; 0.0 when total_amount is 0.
      operation: ratio
      order: 7
      semantic_parameters:
        null_result: 0.0 when total_amount is 0
        rounding: ROUND to 4 decimal places
        units: fraction
    - carried_fields:
      - entity_key
      - measure_state
      - entity_name
      - row_count
      - distinct_amount_count
      - total_amount
      - max_amount
      - max_amount_share
      description: Label these measures as the present measure state.
      operation: derive
      order: 8
    - carried_fields:
      - entity_key
      - entity_name
      description: 'Keep the absent measure-state rows: participant_share is missing, including the retained placeholder for a deals row with no deals_participants rows. A real deals_participants row whose participant_share has a value belongs only to the present state and never to this absent state.'
      operation: filter
      order: 9
    - carried_fields:
      - entity_key
      - entity_name
      - row_count
      - distinct_amount_count
      - total_amount
      - max_amount
      description: One row per deals entity that has at least one row in the absent measure state, and no row here for an entity with none, reporting row count, how many different non-missing participant_share values occur (each different value counted once, however many rows repeat it), total participant_share, and largest participant_share.
      operation: distinct
      order: 10
    - carried_fields:
      - entity_key
      - entity_name
      - row_count
      - distinct_amount_count
      - total_amount
      - max_amount
      - max_amount_share
      description: max_amount_share is max_amount divided by total_amount as a fraction, rounded to 4 decimal places; 0.0 when total_amount is 0.
      operation: ratio
      order: 11
      semantic_parameters:
        null_result: 0.0 when total_amount is 0
        rounding: ROUND to 4 decimal places
        units: fraction
    - carried_fields:
      - entity_key
      - measure_state
      - entity_name
      - row_count
      - distinct_amount_count
      - total_amount
      - max_amount
      - max_amount_share
      description: Label these measures as the absent measure state.
      operation: derive
      order: 12
    - carried_fields:
      - entity_key
      - measure_state
      - entity_name
      - row_count
      - distinct_amount_count
      - total_amount
      - max_amount
      - max_amount_share
      description: 'Stack the present-state summary and the absent-state summary into one output list: every present-state row and every absent-state row is its own output row, an entity with rows in both states appears twice, once per state, and the two summaries are never matched to each other.'
      operation: union
      order: 13
      semantic_parameters:
        mode: all
    - carried_fields:
      - entity_key
      - measure_state
      description: 'Deterministic output order: entity, then measure state.'
      operation: tie_break
      order: 14
- columns:
  - description: Identifier of the deals row. One row per value.
    name: parent_key
    type: bigint
  - description: deal_title of the deals row, copied unchanged.
    name: parent_name
    type: text
  - description: The largest participant_share itself; 0 when the parent has no deals_participants rows, and 0 when none of its rows carries a participant_share value.
    name: top_measure
    type: decimal
  - description: 'How many deals_participants rows are tied at that largest participant_share. 1 when exactly one row carries that largest participant_share; 0 when there are no rows or when none of the rows carries a participant_share value; a row with no participant_share value never ties: only a row whose participant_share value equals the largest value among the parent''s rows holds the maximum, so the winning row of a parent whose rows all lack a value — the row the tie-break alone selects — is not counted here.'
    name: tied_count
    type: bigint
  - description: 'Number of deals_participants rows for this deals row; 0 when there are none. Every linked deals_participants row counts, whether or not it carries a participant_share value. A deals row kept with no deals_participants row reports 0 here, never 1: its placeholder holds no deals_participants row to count.'
    name: child_count
    type: bigint
  - description: Sum of participant_share over all of them; 0 when the parent has no deals_participants rows, and 0 when none of its rows carries a participant_share value (rows with no participant_share value add nothing).
    name: total_measure
    type: decimal
  - description: The participant_role of the deals_participants row with the LARGEST participant_share for this deals row. Ties in participant_share are broken by taking the SMALLEST participant_role under a plain case-sensitive comparison of the stored text (the warehouse default order, in which every uppercase letter sorts before every lowercase one) — a row with no participant_role value sorts after every labelled row; rows tied on both are resolved by the smallest id. A row with no participant_share value still ranks, after every row that has one, so a parent holding at least one deals_participants row always has a winning row — when NONE of its rows carries a participant_share value the winner is the one the tie-break alone selects, not the no-rows default. The literal '(none)' when the parent has no deals_participants rows at all, and '(none)' when the winning row has no participant_role value.
    name: top_label
    type: text
  - description: The id of that same extremal row — the winner under the SAME total order, so it is the identifier of a real deals_participants row whenever the parent has any. This includes when none of them carries a participant_share value. It is 0 when there are no rows, and only then. It identifies WHICH row won, so a tie resolved the wrong way is visible even when two rows share a label.
    name: top_row_id
    type: bigint
  - description: top_measure divided by total_measure as a FRACTION between 0 and 1 (not a percentage), rounded to 4 decimals, 0.0 when total_measure is 0.
    name: top_measure_share
    type: float
  - description: '''empty'' when no row holds a maximum at all — the parent has no deals_participants rows, or none of its rows carries a participant_share value — ''unique'' when exactly one row holds the maximum, ''tied'' when two or more do. Equivalently, tie_state follows tied_count: ''empty'' when tied_count is 0, ''unique'' when it is 1, ''tied'' when it is 2 or more. A row holds the maximum only when it carries a participant_share value equal to the largest participant_share value among the parent''s rows; a row with no participant_share value never holds the maximum. So a parent whose deals_participants rows all lack a participant_share value has no row holding the maximum and is ''empty'', with tied_count 0, even though the ranking still selects a winning row for it by the tie-break alone, which top_label and top_row_id name.'
    name: tie_state
    type: text
  description: 'Per-deals extremes over extracted deals_participants records: WHICH record is largest, not how large it is.'
  grain: One row per deals (id), INCLUDING deals rows with no linked deals_participants rows.
  key_columns:
  - parent_key
  name: deals_participants_top
  source_relationships:
  - child_columns:
    - _deals_id
    child_table: deals_flow
    parent_columns:
    - id
    parent_table: deals
    required: true
  - child_columns:
    - _deals_id
    child_table: deals_participants
    parent_columns:
    - id
    parent_table: deals
    required: true
  transformation:
    steps:
    - description: Read source table deals.
      operation: source
      order: 1
      source_inputs:
      - deals
    - description: Read source table deals_participants.
      operation: source
      order: 2
      source_inputs:
      - deals_participants
    - carried_fields:
      - parent_key
      - parent_name
      description: One row per deals row, keyed by id.
      operation: derive
      order: 3
      source_inputs:
      - deals
    - carried_fields:
      - _deals_id
      - id
      condition:
        public_identifiers:
        - deals_participants
        - _deals_id
        - parent_key
      description: 'Bring in deals_participants: a deals row with no deals_participants rows still appears, with the declared defaults.'
      join_preservation: left
      operation: join
      order: 4
      source_inputs:
      - deals_participants
    - carried_fields:
      - parent_key
      description: Rank the joined rows within each group under an explicit total order (measure first, then the declared tie-break), so the extremal row is a function of the input and not of row order.
      operation: window
      order: 5
    - carried_fields:
      - parent_key
      - parent_name
      - top_measure
      - tied_count
      - child_count
      - total_measure
      description: 'One output row per parent_key, carrying parent_name beside the keys: a key value identifies one source row for the carried columns, so they take one value per key and never split a group, reporting top_measure, tied_count, child_count, total_measure for that row''s matching rows. A group with no qualifying rows still appears, reporting 0; a retained row with no matching rows has nothing to count, so its counts are 0, never 1.'
      operation: filtered_aggregate
      order: 6
    - carried_fields:
      - parent_key
      - top_label
      - top_row_id
      description: Keep the single row per parent_key at which the ordering measure is largest, ties broken by the smallest participant_role under a plain case-sensitive comparison of the stored text (the warehouse default order, in which every uppercase letter sorts before every lowercase one) (a row with no participant_role value sorts after every row that has one), then the smallest id, and take top_label, top_row_id from that winning row. EVERY row of the group ranks, including a row whose ordering measure has no value — such a row sorts after every row that has one — so a group with at least one row always has a winning row, and the declared defaults belong to a group with NO rows.
      operation: extrema
      order: 7
    - carried_fields:
      - parent_key
      condition:
        public_identifiers:
        - parent_key
      description: Attach the extremal row's attributes to the grouped measures. LEFT, so a group with no rows at all keeps its measures.
      join_preservation: left
      operation: join
      order: 8
    - carried_fields:
      - parent_key
      - parent_name
      - top_measure
      - tied_count
      - child_count
      - total_measure
      - top_label
      - top_row_id
      description: Name the mart columns; top_measure, total_measure report their declared defaults — never NULL — for a group with no matching rows. For top_measure, total_measure, the default also applies to a group none of whose real rows carries an input value.
      operation: derive
      order: 9
    - carried_fields:
      - parent_key
      - parent_name
      - top_measure
      - tied_count
      - child_count
      - total_measure
      - top_label
      - top_row_id
      - top_measure_share
      description: 'Guarded ratios: top_measure_share — top_measure divided by total_measure as a FRACTION between 0 and 1 (not a percentage), rounded to 4 decimals, 0.0 when total_measure is 0.'
      operation: ratio
      order: 10
      semantic_parameters:
        null_result: 0.0 when the denominator is 0 or NULL
        rounding: ROUND to 4 decimal places
        units: fraction
    - carried_fields:
      - parent_key
      - parent_name
      - top_measure
      - tied_count
      - child_count
      - total_measure
      - top_label
      - top_row_id
      - top_measure_share
      - tie_state
      description: 'tie_state — ''empty'' when no row holds a maximum at all — the parent has no deals_participants rows, or none of its rows carries a participant_share value — ''unique'' when exactly one row holds the maximum, ''tied'' when two or more do. Equivalently, tie_state follows tied_count: ''empty'' when tied_count is 0, ''unique'' when it is 1, ''tied'' when it is 2 or more. A row holds the maximum only when it carries a participant_share value equal to the largest participant_share value among the parent''s rows; a row with no participant_share value never holds the maximum. So a parent whose deals_participants rows all lack a participant_share value has no row holding the maximum and is ''empty'', with tied_count 0, even though the ranking still selects a winning row for it by the tie-break alone, which top_label and top_row_id name.'
      operation: conditional
      order: 11
      semantic_parameters:
        boundary: categorical mapping; no numeric boundary
    - carried_fields:
      - parent_key
      description: 'Deterministic output order: sort by parent_key.'
      operation: tie_break
      order: 12
- columns:
  - description: deals primary key column 'id'
    name: id
    type: bigint
  - description: number of 'deals_flow' records extracted for this 'deals' (0 when none)
    name: deals_flow_count
    type: bigint
  - description: latest 'update_time' seen for this 'deals' record (the incremental cursor of the resource)
    name: last_update_time
    type: timestamp
  description: one row per 'deals' record extracted from the API
  grain: one row per deals (id)
  key_columns:
  - id
  name: dim_deals
  source_relationships:
  - child_columns:
    - _deals_id
    child_table: deals_flow
    parent_columns:
    - id
    parent_table: deals
    required: true
  - child_columns:
    - _deals_id
    child_table: deals_participants
    parent_columns:
    - id
    parent_table: deals
    required: true
  transformation:
    steps:
    - description: Read source table deals.
      operation: source
      order: 1
      source_inputs:
      - deals
    - description: Read source table deals_flow.
      operation: source
      order: 2
      source_inputs:
      - deals_flow
    - carried_fields:
      - id
      description: Form the mart key columns id from source table deals.
      operation: derive
      order: 3
      source_inputs:
      - deals
    - carried_fields:
      - id
      - _deals_id
      condition:
        public_identifiers:
        - deals_flow
        - _deals_id
        - id
      description: 'Bring in deals_flow: every deals record appears whether or not it has matching deals_flow records.'
      join_preservation: left
      operation: join
      order: 4
      source_inputs:
      - deals_flow
    - carried_fields:
      - id
      - deals_flow_count
      - last_update_time
      description: 'One output row per id, reporting deals_flow_count for that row''s matching rows. last_update_time is taken from the deals side only: its value comes from update_time on the deals rows, never from the matching rows. A deals row with no matching rows still reports whatever update_time holds on the deals side.'
      operation: aggregate
      order: 5
    - carried_fields:
      - id
      - deals_flow_count
      - last_update_time
      description: Name the mart columns.
      operation: derive
      order: 6
    - carried_fields:
      - id
      description: 'Deterministic output order: sort by id.'
      operation: tie_break
      order: 7
- columns:
  - description: calendar day of 'update_time' (UTC date part)
    name: activity_date
    type: date
  - description: number of 'deals' records on that day
    name: record_count
    type: bigint
  description: daily activity summary of the 'deals' resource
  grain: one row per calendar day of update_time
  key_columns:
  - activity_date
  name: deals_activity
  source_relationships:
  - child_columns:
    - _deals_id
    child_table: deals_flow
    parent_columns:
    - id
    parent_table: deals
    required: true
  - child_columns:
    - _deals_id
    child_table: deals_participants
    parent_columns:
    - id
    parent_table: deals
    required: true
  transformation:
    steps:
    - description: Read source table deals.
      operation: source
      order: 1
      source_inputs:
      - deals
    - carried_fields:
      - activity_date
      description: The grain is activity_date — activity_date is the UTC date part of the incremental cursor 'update_time'.
      operation: derive
      order: 2
      source_inputs:
      - deals
    - carried_fields:
      - activity_date
      - record_count
      description: One output row per activity_date, reporting record_count for that row's matching rows.
      operation: aggregate
      order: 3
    - carried_fields:
      - activity_date
      - record_count
      description: Name the mart columns.
      operation: derive
      order: 4
    - carried_fields:
      - activity_date
      description: 'Deterministic output order: sort by activity_date.'
      operation: tie_break
      order: 5
