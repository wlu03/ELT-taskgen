aws_s3:
  AWS_ACCESS_KEY_ID: test
  AWS_DEFAULT_REGION: us-west-2
  AWS_ENDPOINT_URL: http://elt-localstack:4566
  AWS_SECRET_ACCESS_KEY: test
  data:
  - path: s3://dlt--pipedrive-bucket/custom_fields_mapping.jsonl
    sync_mode: full_refresh_append
    table: custom_fields_mapping
  - path: s3://dlt--pipedrive-bucket/deals_participants.jsonl
    sync_mode: full_refresh_append
    table: deals_participants
  - path: s3://dlt--pipedrive-bucket/stages.jsonl
    sync_mode: full_refresh_append
    table: stages
  - path: s3://dlt--pipedrive-bucket/tasks.jsonl
    sync_mode: full_refresh_append
    table: tasks
custom_api:
  config:
    configuration: {}
    sync_mode: full_refresh_append
