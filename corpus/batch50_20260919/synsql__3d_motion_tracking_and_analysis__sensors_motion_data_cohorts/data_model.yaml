models:
- columns:
  - description: Identifier of the sensors row.
    name: entity_key
    type: integer
  - description: '''passing'' for data_quality values [''good'']; ''failing'' for values [''bad'', ''uncertain'']; ''no_activity'' when the sensors row has no linked motion_data row. A linked motion_data row whose data_quality has no value belongs to no cohort: it is not counted in any cell, and it does not make the sensors row ''no_activity''.'
    name: cohort
    type: text
  - description: sensor_name of the sensors row, copied unchanged.
    name: entity_name
    type: text
  - description: Number of motion_data rows in this entity/cohort cell.
    name: link_count
    type: bigint
  - description: Number of distinct data_quality values represented in this cell.
    name: distinct_status_count
    type: bigint
  - description: Sum of x_position in this cell; 0 for a no-activity cell that has no rows at all, and 0 when none of the cell's rows carries an x_position value.
    name: total_amount
    type: float
  - description: Largest x_position in this cell; 0 for a no-activity cell that has no rows at all, and 0 when none of the cell's rows carries an x_position value.
    name: max_amount
    type: float
  - description: max_amount divided by total_amount as a fraction, rounded to 4 decimal places; 0.0 when total_amount is 0.
    name: max_amount_share
    type: float
  description: Per-(sensors, status cohort) summary of linked motion_data rows in the 3d_motion_tracking_and_analysis scenario, with passing and failing cohorts kept separate.
  grain: One row per (sensor_id, status cohort) pair represented among linked motion_data rows, plus one no-activity row for a sensors row with no linked motion_data row at all. A sensors row whose linked motion_data rows all lack a data_quality value is in no cohort and gets no no-activity row, so it has no row in this mart.
  key_columns:
  - entity_key
  - cohort
  name: sensors_motion_data_cohorts
  source_relationships:
  - child_columns:
    - sensor_id
    child_table: motion_data
    parent_columns:
    - sensor_id
    parent_table: sensors
    required: false
  transformation:
    steps:
    - description: Read source table sensors.
      operation: source
      order: 1
      source_inputs:
      - sensors
    - description: Read source table motion_data.
      operation: source
      order: 2
      source_inputs:
      - motion_data
    - carried_fields:
      - entity_key
      - entity_name
      description: Carry each sensor_id and its sensor_name into the cohort calculation.
      operation: derive
      order: 3
      source_inputs:
      - sensors
    - carried_fields:
      - entity_key
      - entity_name
      - sensor_id
      condition:
        public_identifiers:
        - motion_data
        - sensor_id
        - entity_key
      description: Bring the linked motion_data rows into each sensors entity before assigning status cohorts.
      join_preservation: left
      operation: join
      order: 4
      source_inputs:
      - motion_data
    - carried_fields:
      - entity_key
      - entity_name
      condition:
        literal_values:
        - good
      description: Keep rows whose data_quality belongs to the passing cohort values ['good'].
      operation: filter
      order: 5
    - carried_fields:
      - entity_key
      - entity_name
      - link_count
      - distinct_status_count
      - total_amount
      - max_amount
      description: One row per sensors entity that has at least one linked motion_data row in the passing cohort, reporting the number of those rows, how many different data_quality values occur among them, the total of their x_position, and their largest x_position. The total and the largest value read only the rows that carry a x_position value; a cohort whose rows all lack one reports 0 for both, never empty.
      operation: distinct
      order: 6
    - carried_fields:
      - entity_key
      - entity_name
      - link_count
      - distinct_status_count
      - total_amount
      - max_amount
      - max_amount_share
      description: max_amount_share is max_amount divided by total_amount as a fraction, rounded to 4 decimal places; 0.0 when total_amount is 0.
      operation: ratio
      order: 7
      semantic_parameters:
        null_result: 0.0 when total_amount is 0
        rounding: ROUND to 4 decimal places
        units: fraction
    - carried_fields:
      - entity_key
      - cohort
      - entity_name
      - link_count
      - distinct_status_count
      - total_amount
      - max_amount
      - max_amount_share
      description: Label these measures as the passing cohort.
      operation: derive
      order: 8
    - carried_fields:
      - entity_key
      - entity_name
      condition:
        literal_values:
        - bad
        - uncertain
      description: Keep rows whose data_quality belongs to the failing cohort values ['bad', 'uncertain'].
      operation: filter
      order: 9
    - carried_fields:
      - entity_key
      - entity_name
      - link_count
      - distinct_status_count
      - total_amount
      - max_amount
      description: One row per sensors entity that has at least one linked motion_data row in the failing cohort, reporting the number of those rows, how many different data_quality values occur among them, the total of their x_position, and their largest x_position. The total and the largest value read only the rows that carry a x_position value; a cohort whose rows all lack one reports 0 for both, never empty.
      operation: distinct
      order: 10
    - carried_fields:
      - entity_key
      - entity_name
      - link_count
      - distinct_status_count
      - total_amount
      - max_amount
      - max_amount_share
      description: max_amount_share is max_amount divided by total_amount as a fraction, rounded to 4 decimal places; 0.0 when total_amount is 0.
      operation: ratio
      order: 11
      semantic_parameters:
        null_result: 0.0 when total_amount is 0
        rounding: ROUND to 4 decimal places
        units: fraction
    - carried_fields:
      - entity_key
      - cohort
      - entity_name
      - link_count
      - distinct_status_count
      - total_amount
      - max_amount
      - max_amount_share
      description: Label these measures as the failing cohort.
      operation: derive
      order: 12
    - carried_fields:
      - entity_key
      - entity_name
      description: Keep the placeholder row for a sensors entity with no linked motion_data row at all; a sensors entity that has linked motion_data rows gets no placeholder, even when every one of those rows lacks a data_quality value.
      operation: filter
      order: 13
    - carried_fields:
      - entity_key
      - entity_name
      - link_count
      - distinct_status_count
      - total_amount
      - max_amount
      description: One row per sensors entity with no linked motion_data row at all, reporting 0 rows, 0 different data_quality values, a x_position total of 0 and a largest x_position of 0.
      operation: distinct
      order: 14
    - carried_fields:
      - entity_key
      - entity_name
      - link_count
      - distinct_status_count
      - total_amount
      - max_amount
      - max_amount_share
      description: max_amount_share is max_amount divided by total_amount as a fraction, rounded to 4 decimal places; 0.0 when total_amount is 0.
      operation: ratio
      order: 15
      semantic_parameters:
        null_result: 0.0 when total_amount is 0
        rounding: ROUND to 4 decimal places
        units: fraction
    - carried_fields:
      - entity_key
      - cohort
      - entity_name
      - link_count
      - distinct_status_count
      - total_amount
      - max_amount
      - max_amount_share
      description: Label these measures as the no_activity cohort.
      operation: derive
      order: 16
    - carried_fields:
      - entity_key
      - cohort
      - entity_name
      - link_count
      - distinct_status_count
      - total_amount
      - max_amount
      - max_amount_share
      description: Combine the disjoint passing and failing cohort summaries.
      operation: union
      order: 17
      semantic_parameters:
        mode: all
    - carried_fields:
      - entity_key
      - cohort
      - entity_name
      - link_count
      - distinct_status_count
      - total_amount
      - max_amount
      - max_amount_share
      description: Add the no-activity summaries, so an entity with no linked rows is retained as one explicit cohort row.
      operation: union
      order: 18
      semantic_parameters:
        mode: all
    - carried_fields:
      - entity_key
      - cohort
      description: 'Deterministic output order: entity, then cohort.'
      operation: tie_break
      order: 19
- columns:
  - description: Identifier of the sensors row. One row per value.
    name: parent_key
    type: integer
  - description: sensor_name of the sensors row, copied unchanged.
    name: parent_name
    type: text
  - description: 'status of the sensors row, copied unchanged. Declared domain: [''active'', ''inactive'', ''maintenance''].'
    name: parent_status
    type: text
  - description: 'Number of motion_data rows for this sensors row; 0 when there are none. Every linked motion_data row counts, whatever its data_quality value. A sensors row kept with no motion_data row reports 0 here, never 1: its placeholder holds no motion_data row to count.'
    name: link_count
    type: bigint
  - description: Of those, how many have data_quality in ['good']. 0, never missing, when none do.
    name: passing_count
    type: bigint
  - description: How many have data_quality in ['bad', 'uncertain']. 0 when none do.
    name: failing_count
    type: bigint
  - description: How many DISTINCT data_quality values occur among them.
    name: distinct_status_count
    type: bigint
  - description: passing_count divided by link_count as a FRACTION between 0 and 1 (not a percentage), rounded to 4 decimals, 0.0 when there are no links.
    name: passing_ratio
    type: float
  - description: 'Band of passing_ratio, decided on the rounded passing_ratio value this mart reports: ''no_activity'' when there are no links, ''high'' at 0.8 or ABOVE (0.8 itself is high), ''medium'' from 0.5 up to but not including 0.8 (0.5 itself is medium), ''low'' below 0.5. Boundaries are inclusive of the HIGHER band.'
    name: adoption_band
    type: text
  - description: 'parent_status mapped value by value: ''active'' becomes ''active''; ''inactive'' becomes ''other_1''; any other value — including legal values of the column that the mapping does not name — becomes ''unmapped''. Never NULL.'
    name: status_group
    type: text
  description: Per-sensors banding of linked motion_data activity in the 3d_motion_tracking_and_analysis scenario, over the value domain the source schema itself declares.
  grain: One row per sensors (sensor_id), INCLUDING sensors rows with no linked motion_data rows.
  key_columns:
  - parent_key
  name: sensors_motion_data_bands
  source_relationships:
  - child_columns:
    - sensor_id
    child_table: motion_data
    parent_columns:
    - sensor_id
    parent_table: sensors
    required: false
  transformation:
    steps:
    - description: Read source table sensors.
      operation: source
      order: 1
      source_inputs:
      - sensors
    - description: Read source table motion_data.
      operation: source
      order: 2
      source_inputs:
      - motion_data
    - carried_fields:
      - parent_key
      - parent_name
      - parent_status
      description: One row per sensors row, keyed by sensor_id.
      operation: derive
      order: 3
      source_inputs:
      - sensors
    - carried_fields:
      - sensor_id
      condition:
        public_identifiers:
        - motion_data
        - sensor_id
        - parent_key
      description: 'Bring in motion_data (hop 1 of 1): rows with no matching motion_data row are RETAINED and report the declared defaults.'
      join_preservation: left
      operation: join
      order: 4
      source_inputs:
      - motion_data
    - carried_fields:
      - parent_key
      - parent_name
      - parent_status
      - link_count
      - passing_count
      - failing_count
      - distinct_status_count
      description: 'One output row per parent_key, carrying parent_name, parent_status beside the keys: a key value identifies one source row for the carried columns, so they take one value per key and never split a group, reporting link_count, passing_count, failing_count, distinct_status_count for that row''s matching rows. A group with no qualifying rows still appears, reporting 0; a retained row with no matching rows has nothing to count, so its counts are 0, never 1.'
      operation: filtered_aggregate
      order: 5
    - carried_fields:
      - parent_key
      - parent_name
      - parent_status
      - link_count
      - passing_count
      - failing_count
      - distinct_status_count
      description: Name the mart columns.
      operation: derive
      order: 6
    - carried_fields:
      - parent_key
      - parent_name
      - parent_status
      - link_count
      - passing_count
      - failing_count
      - distinct_status_count
      - passing_ratio
      description: 'Guarded ratios: passing_ratio — passing_count divided by link_count as a FRACTION between 0 and 1 (not a percentage), rounded to 4 decimals, 0.0 when there are no links.'
      operation: ratio
      order: 7
      semantic_parameters:
        null_result: 0.0 when the denominator is 0 or NULL
        rounding: ROUND to 4 decimal places
        units: fraction
    - carried_fields:
      - parent_key
      - parent_name
      - parent_status
      - link_count
      - passing_count
      - failing_count
      - distinct_status_count
      - passing_ratio
      - adoption_band
      description: 'adoption_band — Band of passing_ratio, decided on the rounded passing_ratio value this mart reports: ''no_activity'' when there are no links, ''high'' at 0.8 or ABOVE (0.8 itself is high), ''medium'' from 0.5 up to but not including 0.8 (0.5 itself is medium), ''low'' below 0.5. Boundaries are inclusive of the HIGHER band.'
      operation: conditional
      order: 8
      semantic_parameters:
        boundary: a value exactly at 0.8 is 'high'; a value exactly at 0.5 is 'medium'
        domain: active, inactive, maintenance
    - carried_fields:
      - parent_key
      - parent_name
      - parent_status
      - link_count
      - passing_count
      - failing_count
      - distinct_status_count
      - passing_ratio
      - adoption_band
      - status_group
      description: 'status_group — parent_status mapped value by value: ''active'' becomes ''active''; ''inactive'' becomes ''other_1''; any other value — including legal values of the column that the mapping does not name — becomes ''unmapped''. Never NULL.'
      operation: conditional
      order: 9
      semantic_parameters:
        boundary: categorical mapping; no numeric boundary
        domain: active, inactive, maintenance
    - carried_fields:
      - parent_key
      description: 'Deterministic output order: sort by parent_key.'
      operation: tie_break
      order: 10
