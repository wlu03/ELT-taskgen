    parent_table: notablecomposers
    required: false
  - child_columns:
    - productiondesigner
    child_table: filmographyandcontributions
    parent_columns:
    - fullname
    parent_table: notableartistsandanimators
    required: false
  - child_columns:
    - screenwriter
    child_table: filmographyandcontributions
    parent_columns:
    - writername
    parent_table: sovietwriters
    required: false
  - child_columns:
    - voiceactor
    child_table: filmographyandcontributions
