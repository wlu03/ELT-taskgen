    - surname
    parent_table: voiceactorfamilynames
    required: false
  transformation:
    steps:
    - description: Read source table sovietwriters.
      operation: source
      order: 1
      source_inputs:
      - sovietwriters
    - description: Read source table filmographyandcontributions.
      operation: source
      order: 2
      source_inputs:
      - filmographyandcontributions
    - carried_fields:
      - entity_key
      - entity_name
      description: Carry each writername and its writerdescription into the measure-state calculation.
      operation: derive
      order: 3
      source_inputs:
      - sovietwriters
    - carried_fields:
      - entity_key
      - entity_name
      - writername
      - screenwriter
      condition:
        public_identifiers:
        - filmographyandcontributions
        - screenwriter
        - entity_key
      description: Bring the linked filmographyandcontributions rows into each sovietwriters entity; retain an entity with no linked row so its absent state is visible.
      join_preservation: left
      operation: join
      order: 4
      source_inputs:
      - filmographyandcontributions
    - carried_fields:
      - entity_key
      - entity_name
      description: 'Keep the present measure-state rows: a real filmographyandcontributions row whose filmduration has a value.'
      operation: filter
      order: 5
    - carried_fields:
      - entity_key
      - entity_name
      - row_count
      - distinct_amount_count
      - total_amount
      - max_amount
      description: One row per sovietwriters entity that has at least one row in the present measure state, and no row here for an entity with none, reporting row count, how many different non-missing filmduration values occur (each different value counted once, however many rows repeat it), total filmduration, and largest filmduration.
      operation: distinct
      order: 6
    - carried_fields:
      - entity_key
      - entity_name
      - row_count
      - distinct_amount_count
      - total_amount
      - max_amount
      - max_amount_share
      description: max_amount_share is max_amount divided by total_amount as a fraction, rounded to 4 decimal places; 0.0 when total_amount is 0.
      operation: ratio
      order: 7
      semantic_parameters:
        null_result: 0.0 when total_amount is 0
        rounding: ROUND to 4 decimal places
        units: fraction
    - carried_fields:
      - entity_key
      - measure_state
      - entity_name
      - row_count
      - distinct_amount_count
      - total_amount
      - max_amount
      - max_amount_share
      description: Label these measures as the present measure state.
      operation: derive
      order: 8
    - carried_fields:
      - entity_key
      - entity_name
      description: 'Keep the absent measure-state rows: filmduration is missing, including the retained placeholder for a sovietwriters row with no filmographyandcontributions rows. A real filmographyandcontributions row whose filmduration has a value belongs only to the present state and never to this absent state.'
      operation: filter
      order: 9
    - carried_fields:
      - entity_key
      - entity_name
      - row_count
      - distinct_amount_count
      - total_amount
      - max_amount
      description: One row per sovietwriters entity that has at least one row in the absent measure state, and no row here for an entity with none, reporting row count, how many different non-missing filmduration values occur (each different value counted once, however many rows repeat it), total filmduration, and largest filmduration.
      operation: distinct
      order: 10
    - carried_fields:
      - entity_key
      - entity_name
      - row_count
      - distinct_amount_count
      - total_amount
      - max_amount
      - max_amount_share
      description: max_amount_share is max_amount divided by total_amount as a fraction, rounded to 4 decimal places; 0.0 when total_amount is 0.
      operation: ratio
      order: 11
      semantic_parameters:
        null_result: 0.0 when total_amount is 0
        rounding: ROUND to 4 decimal places
        units: fraction
    - carried_fields:
      - entity_key
      - measure_state
      - entity_name
      - row_count
      - distinct_amount_count
      - total_amount
      - max_amount
      - max_amount_share
      description: Label these measures as the absent measure state.
      operation: derive
      order: 12
    - carried_fields:
      - entity_key
      - measure_state
      - entity_name
      - row_count
      - distinct_amount_count
      - total_amount
      - max_amount
      - max_amount_share
      description: 'Stack the present-state summary and the absent-state summary into one output list: every present-state row and every absent-state row is its own output row, an entity with rows in both states appears twice, once per state, and the two summaries are never matched to each other.'
      operation: union
      order: 13
      semantic_parameters:
        mode: all
    - carried_fields:
      - entity_key
      - measure_state
      description: 'Deterministic output order: entity, then measure state.'
      operation: tie_break
      order: 14
- columns:
  - description: Identifier of the sovietwriters row. One row per value.
    name: parent_key
    type: text
  - description: writerdescription of the sovietwriters row, copied unchanged.
    name: parent_name
    type: text
  - description: The largest filmduration itself; 0 when the parent has no filmographyandcontributions rows, and 0 when none of its rows carries a filmduration value.
    name: top_measure
    type: decimal
  - description: 'How many filmographyandcontributions rows are tied at that largest filmduration. 1 when exactly one row carries that largest filmduration; 0 when there are no rows or when none of the rows carries a filmduration value; a row with no filmduration value never ties: only a row whose filmduration value equals the largest value among the parent''s rows holds the maximum, so the winning row of a parent whose rows all lack a value — the row the tie-break alone selects — is not counted here.'
    name: tied_count
    type: bigint
  - description: 'Number of filmographyandcontributions rows for this sovietwriters row; 0 when there are none. Every linked filmographyandcontributions row counts, whether or not it carries a filmduration value. A sovietwriters row kept with no filmographyandcontributions row reports 0 here, never 1: its placeholder holds no filmographyandcontributions row to count.'
    name: child_count
    type: bigint
  - description: Sum of filmduration over all of them; 0 when the parent has no filmographyandcontributions rows, and 0 when none of its rows carries a filmduration value (rows with no filmduration value add nothing).
    name: total_measure
    type: decimal
  - description: The filmtitle of the filmographyandcontributions row with the LARGEST filmduration for this sovietwriters row. Ties in filmduration are broken by taking the SMALLEST filmtitle under a plain case-sensitive comparison of the stored text (the warehouse default order, in which every uppercase letter sorts before every lowercase one); rows tied on both are resolved by the smallest animatorrufilmid. A row with no filmduration value still ranks, after every row that has one, so a parent holding at least one filmographyandcontributions row always has a winning row — when NONE of its rows carries a filmduration value the winner is the one the tie-break alone selects, not the no-rows default. The literal '(none)' when the parent has no filmographyandcontributions rows at all.
    name: top_label
    type: text
  - description: The animatorrufilmid of that same extremal row — the winner under the SAME total order, so it is the identifier of a real filmographyandcontributions row whenever the parent has any. This includes when none of them carries a filmduration value. It is 0 when there are no rows, and only then. It identifies WHICH row won, so a tie resolved the wrong way is visible even when two rows share a label.
    name: top_row_id
    type: integer
  - description: top_measure divided by total_measure as a FRACTION between 0 and 1 (not a percentage), rounded to 4 decimals, 0.0 when total_measure is 0.
    name: top_measure_share
    type: float
  - description: '''empty'' when no row holds a maximum at all — the parent has no filmographyandcontributions rows, or none of its rows carries a filmduration value — ''unique'' when exactly one row holds the maximum, ''tied'' when two or more do. Equivalently, tie_state follows tied_count: ''empty'' when tied_count is 0, ''unique'' when it is 1, ''tied'' when it is 2 or more. A row holds the maximum only when it carries a filmduration value equal to the largest filmduration value among the parent''s rows; a row with no filmduration value never holds the maximum. So a parent whose filmographyandcontributions rows all lack a filmduration value has no row holding the maximum and is ''empty'', with tied_count 0, even though the ranking still selects a winning row for it by the tie-break alone, which top_label and top_row_id name.'
    name: tie_state
    type: text
  description: 'Per-sovietwriters extremes over linked filmographyandcontributions rows in the AnatoliPapanovVoiceActingLegacy database: WHICH row is largest, not how large it is.'
  grain: One row per sovietwriters (writername), INCLUDING sovietwriters rows with no linked filmographyandcontributions rows.
  key_columns:
  - parent_key
  name: sovietwriters_filmographyandcontributions_top
  source_relationships:
  - child_columns:
