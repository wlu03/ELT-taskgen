models:
- columns:
  - description: Identifier of the sovietwriters row.
    name: entity_key
    type: text
  - description: '''present'' for a linked filmographyandcontributions row whose filmduration has a value; ''absent'' when filmduration is missing, including a sovietwriters row with no linked filmographyandcontributions row. A linked filmographyandcontributions row whose filmduration has a value belongs only to the present state and never to the absent state.'
    name: measure_state
    type: text
  - description: writerdescription of the sovietwriters row, copied unchanged.
    name: entity_name
    type: text
  - description: Number of linked filmographyandcontributions rows in this entity/state cell; a absent cell holding real filmographyandcontributions rows whose filmduration is missing COUNTS those rows, and only the placeholder cell of a sovietwriters row with no linked filmographyandcontributions row at all reports 0.
    name: row_count
    type: bigint
  - description: Number of unique non-missing filmduration values in this cell; each unique non-missing value is counted once, however many rows repeat it; 0 whenever the cell holds no filmduration value at all — both for a sovietwriters row with no linked filmographyandcontributions row and for an absent cell whose rows all have a missing filmduration.
    name: distinct_amount_count
    type: bigint
  - description: Sum of filmduration in this cell; 0 for a no-activity cell that has no rows at all, and 0 when none of the cell's rows carries an filmduration value.
    name: total_amount
    type: decimal
  - description: Largest filmduration in this cell; 0 for a no-activity cell that has no rows at all, and 0 when none of the cell's rows carries an filmduration value.
    name: max_amount
    type: decimal
  - description: max_amount divided by total_amount as a fraction, rounded to 4 decimal places; 0.0 when total_amount is 0.
    name: max_amount_share
    type: float
  description: Per-(sovietwriters, measure state) distribution of linked filmographyandcontributions rows in the AnatoliPapanovVoiceActingLegacy database.
  grain: One row per (writername, measure state) pair represented among linked filmographyandcontributions rows; the absent state includes missing filmduration values and a no-activity row for a sovietwriters row with no links. A linked filmographyandcontributions row whose filmduration has a value belongs only to the present state and never to the absent state.
  key_columns:
  - entity_key
  - measure_state
  name: sovietwriters_filmographyandcontributions_distribution
  source_relationships:
  - child_columns:
    - filmdirector
    child_table: filmographyandcontributions
    parent_columns:
    - fullname
    parent_table: sovietanimatorsanddirectors
    required: true
  - child_columns:
