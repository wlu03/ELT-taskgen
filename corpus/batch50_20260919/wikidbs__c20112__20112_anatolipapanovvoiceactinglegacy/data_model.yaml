    child_table: filmographyandcontributions
    parent_columns:
    - writername
    parent_table: sovietwriters
    required: false
  - child_columns:
    - voiceactor
    child_table: filmographyandcontributions
    parent_columns:
    - fullname
    parent_table: sovietactorsprofile
    required: true
  - child_columns:
