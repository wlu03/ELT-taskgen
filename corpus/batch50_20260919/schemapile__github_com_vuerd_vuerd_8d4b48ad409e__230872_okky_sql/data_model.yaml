- columns:
  - description: Identifier of the user row. One row per value.
    name: parent_key
    type: bigint
  - description: create_ip of the user row, copied unchanged.
    name: parent_name
    type: text
  - description: 'Number of logged_in rows for this user row; 0 when there are none. An user row kept with no logged_in row reports 0 here, never 1: its placeholder holds no logged_in row to count.'
    name: event_count
    type: bigint
  - description: Sum of version over all matching logged_in rows; 0 when there are no rows.
    name: lifetime_amount
    type: bigint
  - description: id of the row with the latest date_created; ties take the smallest id. It is 0 when there are no rows.
    name: latest_row_id
    type: bigint
  - description: version from that same latest row; 0 when there are no rows.
    name: latest_amount
    type: bigint
  - description: remote_addr from that same latest row; '(none)' when there are no rows or when the winning value is missing.
    name: latest_label
    type: text
  - description: latest_amount divided by lifetime_amount as a fraction, rounded to 4 decimal places; 0.0 when lifetime_amount is 0.
    name: latest_amount_share
    type: float
