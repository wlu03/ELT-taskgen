- columns:
  - description: Identifier of the content row. One row per value.
    name: parent_key
    type: bigint
  - description: a_nick_name of the content row, copied unchanged.
    name: parent_name
    type: text
  - description: The largest version itself; 0 when the parent has no opinion rows.
    name: top_measure
    type: bigint
  - description: How many opinion rows are tied at that largest version. 1 when exactly one row carries that largest version; 0 when there are no rows.
    name: tied_count
    type: bigint
  - description: 'Number of opinion rows for this content row; 0 when there are none. A content row kept with no opinion row reports 0 here, never 1: its placeholder holds no opinion row to count.'
    name: child_count
    type: bigint
  - description: Sum of version over all of them; 0 when the parent has no opinion rows.
    name: total_measure
    type: bigint
  - description: The comment of the opinion row with the LARGEST version for this content row. Ties in version are broken by taking the SMALLEST comment under a plain case-sensitive comparison of the stored text (the warehouse default order, in which every uppercase letter sorts before every lowercase one); rows tied on both are resolved by the smallest id. The literal '(none)' when the parent has no opinion rows at all.
    name: top_label
    type: text
  - description: The id of that same extremal row — the winner under the SAME total order, so it is the identifier of a real opinion row whenever the parent has any. It is 0 when there are no rows, and only then. It identifies WHICH row won, so a tie resolved the wrong way is visible even when two rows share a label.
    name: top_row_id
    type: bigint
  - description: top_measure divided by total_measure as a FRACTION between 0 and 1 (not a percentage), rounded to 4 decimals, 0.0 when total_measure is 0.
    name: top_measure_share
    type: float
  - description: '''empty'' when no row holds a maximum at all — the parent has no opinion rows — ''unique'' when exactly one row holds the maximum, ''tied'' when two or more do. Equivalently, tie_state follows tied_count: ''empty'' when tied_count is 0, ''unique'' when it is 1, ''tied'' when it is 2 or more.'
    name: tie_state
    type: text
  description: 'Per-content extremes over linked opinion rows in the 230872_OKKY.sql schema: WHICH row is largest, not how large it is.'
