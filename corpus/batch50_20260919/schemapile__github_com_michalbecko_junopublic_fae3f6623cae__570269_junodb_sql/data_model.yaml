      - max_amount
      description: One row per test_step entity that has at least one row in the present measure state, and no row here for an entity with none, reporting row count, how many different non-missing issue_type_id values occur (each different value counted once, however many rows repeat it), total issue_type_id, and largest issue_type_id.
      operation: distinct
      order: 6
    - carried_fields:
