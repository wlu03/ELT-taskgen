  transformation:
    steps:
    - description: Read source table user.
      operation: source
      order: 1
      source_inputs:
      - user
    - description: Read source table test_case.
      operation: source
      order: 2
      source_inputs:
      - test_case
    - carried_fields:
      - parent_key
      - parent_name
      description: One row per user row, keyed by id.
      operation: derive
      order: 3
      source_inputs:
      - user
    - carried_fields:
      - creator_id
      - id
      condition:
        public_identifiers:
        - test_case
        - creator_id
        - parent_key
      description: Bring in test_case; a user row with no matching test_case row is retained and receives the stated empty snapshot values.
      join_preservation: left
      operation: join
      order: 4
      source_inputs:
      - test_case
    - carried_fields:
      - parent_key
      - parent_name
      - event_count
      - lifetime_amount
      description: 'One output row per parent_key, carrying parent_name beside the keys: a key value identifies one source row for the carried columns, so they take one value per key and never split a group, reporting event_count, lifetime_amount for that row''s matching rows.'
      operation: aggregate
      order: 5
    - carried_fields:
      - parent_key
      - latest_row_id
      - latest_amount
      - latest_label
      description: Keep the single row per parent_key at which the ordering measure is largest, ties broken by the smallest id, and take latest_row_id, latest_amount, latest_label from that winning row. The ordering measure is required on every real input row, so a non-empty group always has a winning row; the declared defaults belong only to a group with NO rows.
      operation: extrema
      order: 6
    - carried_fields:
      - parent_key
      condition:
        public_identifiers:
        - parent_key
      description: Attach the extremal row's attributes to the grouped measures. LEFT, so a group with no rows at all keeps its measures.
      join_preservation: left
      operation: join
      order: 7
    - carried_fields:
      - parent_key
      - parent_name
      - event_count
      - lifetime_amount
      - latest_row_id
      - latest_amount
      - latest_label
      description: Name the mart columns; lifetime_amount reports its declared default — never NULL — for a group with no matching rows. For lifetime_amount, the default also applies to a group none of whose real rows carries an input value.
      operation: derive
      order: 8
    - carried_fields:
      - parent_key
      - parent_name
      - event_count
      - lifetime_amount
      - latest_row_id
      - latest_amount
      - latest_label
      - latest_amount_share
      description: 'Guarded ratios: latest_amount_share — latest_amount divided by lifetime_amount as a fraction, rounded to 4 decimal places; 0.0 when lifetime_amount is 0. The division uses latest_amount as this mart reports it, after its default of 0 for a winning row whose approved is missing, so such a row gives 0.0.'
      operation: ratio
      order: 9
      semantic_parameters:
        null_result: 0.0 when the denominator is 0 or NULL
        rounding: ROUND to 4 decimal places
        units: fraction
    - carried_fields:
      - parent_key
      description: 'Deterministic output order: sort by parent_key.'
      operation: tie_break
      order: 10
- columns:
  - description: Identifier of the test_step row.
    name: entity_key
    type: integer
  - description: '''present'' for a linked issue row whose issue_type_id has a value; ''absent'' when issue_type_id is missing, including a test_step row with no linked issue row. A linked issue row whose issue_type_id has a value belongs only to the present state and never to the absent state.'
    name: measure_state
    type: text
  - description: expected_result of the test_step row, copied unchanged.
    name: entity_name
    type: text
  - description: Number of linked issue rows in this entity/state cell; an absent cell holding real issue rows whose issue_type_id is missing COUNTS those rows, and only the placeholder cell of a test_step row with no linked issue row at all reports 0.
    name: row_count
    type: bigint
  - description: Number of unique non-missing issue_type_id values in this cell; each unique non-missing value is counted once, however many rows repeat it; 0 whenever the cell holds no issue_type_id value at all — both for a test_step row with no linked issue row and for an absent cell whose rows all have a missing issue_type_id.
    name: distinct_amount_count
    type: bigint
  - description: Sum of issue_type_id in this cell; 0 for a no-activity cell that has no rows at all, and 0 when none of the cell's rows carries an issue_type_id value.
    name: total_amount
    type: integer
  - description: Largest issue_type_id in this cell; 0 for a no-activity cell that has no rows at all, and 0 when none of the cell's rows carries an issue_type_id value.
    name: max_amount
    type: integer
  - description: max_amount divided by total_amount as a fraction, rounded to 4 decimal places; 0.0 when total_amount is 0.
    name: max_amount_share
    type: float
  description: Per-(test_step, measure state) distribution of linked issue activity in the 570269_junodb.sql schema.
  grain: One row per (id, measure state) pair represented among linked issue rows; the absent state includes missing issue_type_id values and a no-activity row for a test_step row with no links. A linked issue row whose issue_type_id has a value belongs only to the present state and never to the absent state.
