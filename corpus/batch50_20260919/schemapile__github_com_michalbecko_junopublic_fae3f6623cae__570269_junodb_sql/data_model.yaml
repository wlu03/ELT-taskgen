models:
- columns:
  - description: Identifier of the user row. One row per value.
    name: parent_key
    type: integer
  - description: e_mail of the user row, copied unchanged.
    name: parent_name
    type: text
  - description: 'Number of test_case rows for this user row; 0 when there are none. Every linked test_case row counts, whether or not it carries an approved value. An user row kept with no test_case row reports 0 here, never 1: its placeholder holds no test_case row to count.'
    name: event_count
    type: bigint
  - description: Sum of approved over all matching test_case rows; 0 when there are no rows and when none of those rows carries an approved value; a row with no approved value adds nothing, so a group with some values sums the values it has.
    name: lifetime_amount
    type: integer
  - description: 'id of the row with the latest create_date; ties take the smallest id. It is 0 when there are no rows. Every test_case row of the user row ranks, whether or not it carries a approved value: the latest create_date wins even when that row''s approved is missing.'
    name: latest_row_id
    type: integer
  - description: approved from that same latest row; 0 when there are no rows or when the winning value is missing.
    name: latest_amount
    type: integer
  - description: description from that same latest row; '(none)' when there are no rows or when the winning value is missing.
    name: latest_label
    type: text
  - description: latest_amount divided by lifetime_amount as a fraction, rounded to 4 decimal places; 0.0 when lifetime_amount is 0. The division uses latest_amount as this mart reports it, after its default of 0 for a winning row whose approved is missing, so such a row gives 0.0.
    name: latest_amount_share
    type: float
