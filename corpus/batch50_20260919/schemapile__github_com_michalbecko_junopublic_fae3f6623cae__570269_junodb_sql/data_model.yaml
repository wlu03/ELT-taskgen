      operation: derive
      order: 8
    - carried_fields:
      - entity_key
      - entity_name
      description: 'Keep the absent measure-state rows: issue_type_id is missing, including the retained placeholder for a test_step row with no issue rows. A real issue row whose issue_type_id has a value belongs only to the present state and never to this absent state.'
      operation: filter
      order: 9
    - carried_fields:
      - entity_key
      - entity_name
      - row_count
      - distinct_amount_count
      - total_amount
      - max_amount
      description: One row per test_step entity that has at least one row in the absent measure state, and no row here for an entity with none, reporting row count, how many different non-missing issue_type_id values occur (each different value counted once, however many rows repeat it), total issue_type_id, and largest issue_type_id.
      operation: distinct
      order: 10
    - carried_fields:
      - entity_key
      - entity_name
      - row_count
      - distinct_amount_count
      - total_amount
      - max_amount
      - max_amount_share
      description: max_amount_share is max_amount divided by total_amount as a fraction, rounded to 4 decimal places; 0.0 when total_amount is 0.
      operation: ratio
      order: 11
      semantic_parameters:
        null_result: 0.0 when total_amount is 0
        rounding: ROUND to 4 decimal places
        units: fraction
    - carried_fields:
      - entity_key
      - measure_state
      - entity_name
      - row_count
      - distinct_amount_count
      - total_amount
      - max_amount
      - max_amount_share
      description: Label these measures as the absent measure state.
      operation: derive
      order: 12
    - carried_fields:
      - entity_key
      - measure_state
      - entity_name
      - row_count
      - distinct_amount_count
      - total_amount
      - max_amount
      - max_amount_share
      description: 'Stack the present-state summary and the absent-state summary into one output list: every present-state row and every absent-state row is its own output row, an entity with rows in both states appears twice, once per state, and the two summaries are never matched to each other.'
      operation: union
      order: 13
      semantic_parameters:
        mode: all
    - carried_fields:
      - entity_key
      - measure_state
      description: 'Deterministic output order: entity, then measure state.'
      operation: tie_break
      order: 14
- columns:
  - description: Identifier of the test_set row. One row per value.
    name: parent_key
    type: integer
  - description: description of the test_set row, copied unchanged.
    name: parent_name
    type: text
  - description: The largest approved itself; 0 when the parent has no test_case rows, and 0 when none of its rows carries a approved value.
    name: top_measure
    type: integer
  - description: 'How many test_case rows are tied at that largest approved. 1 when exactly one row carries that largest approved; 0 when there are no rows or when none of the rows carries a approved value; a row with no approved value never ties: only a row whose approved value equals the largest value among the parent''s rows holds the maximum, so the winning row of a parent whose rows all lack a value — the row the tie-break alone selects — is not counted here.'
    name: tied_count
    type: bigint
  - description: 'Number of test_case rows for this test_set row; 0 when there are none. Every linked test_case row counts, whether or not it carries an approved value. A test_set row kept with no test_case row reports 0 here, never 1: its placeholder holds no test_case row to count.'
    name: child_count
    type: bigint
  - description: Sum of approved over all of them; 0 when the parent has no test_case rows, and 0 when none of its rows carries a approved value (rows with no approved value add nothing).
    name: total_measure
    type: integer
  - description: The description of the test_case row with the LARGEST approved for this test_set row. Ties in approved are broken by taking the SMALLEST description under a plain case-sensitive comparison of the stored text (the warehouse default order, in which every uppercase letter sorts before every lowercase one) — a row with no description value sorts after every labelled row; rows tied on both are resolved by the smallest id. A row with no approved value still ranks, after every row that has one, so a parent holding at least one test_case row always has a winning row — when NONE of its rows carries a approved value the winner is the one the tie-break alone selects, not the no-rows default. The literal '(none)' when the parent has no test_case rows at all, and '(none)' when the winning row has no description value.
    name: top_label
    type: text
  - description: The id of that same extremal row — the winner under the SAME total order, so it is the identifier of a real test_case row whenever the parent has any. This includes when none of them carries a approved value. It is 0 when there are no rows, and only then. It identifies WHICH row won, so a tie resolved the wrong way is visible even when two rows share a label.
    name: top_row_id
    type: integer
  - description: top_measure divided by total_measure as a FRACTION between 0 and 1 (not a percentage), rounded to 4 decimals, 0.0 when total_measure is 0.
    name: top_measure_share
    type: float
  - description: '''empty'' when no row holds a maximum at all — the parent has no test_case rows, or none of its rows carries a approved value — ''unique'' when exactly one row holds the maximum, ''tied'' when two or more do. Equivalently, tie_state follows tied_count: ''empty'' when tied_count is 0, ''unique'' when it is 1, ''tied'' when it is 2 or more. A row holds the maximum only when it carries a approved value equal to the largest approved value among the parent''s rows; a row with no approved value never holds the maximum. So a parent whose test_case rows all lack a approved value has no row holding the maximum and is ''empty'', with tied_count 0, even though the ranking still selects a winning row for it by the tie-break alone, which top_label and top_row_id name.'
    name: tie_state
    type: text
  description: 'Per-test_set extremes over linked test_case rows in the 570269_junodb.sql schema: WHICH row is largest, not how large it is.'
