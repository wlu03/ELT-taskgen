  transformation:
    steps:
    - description: Read source table test_set.
      operation: source
      order: 1
      source_inputs:
      - test_set
    - description: Read source table test_case.
      operation: source
      order: 2
      source_inputs:
      - test_case
    - carried_fields:
      - parent_key
      - parent_name
      description: One row per test_set row, keyed by id.
      operation: derive
      order: 3
      source_inputs:
      - test_set
    - carried_fields:
      - test_set_id
      - id
      condition:
        public_identifiers:
        - test_case
        - test_set_id
        - parent_key
      description: 'Bring in test_case: a test_set row with no test_case rows still appears, with the declared defaults.'
      join_preservation: left
      operation: join
      order: 4
      source_inputs:
      - test_case
    - carried_fields:
      - parent_key
      description: Rank the joined rows within each group under an explicit total order (measure first, then the declared tie-break), so the extremal row is a function of the input and not of row order.
      operation: window
      order: 5
    - carried_fields:
      - parent_key
      - parent_name
      - top_measure
      - tied_count
      - child_count
      - total_measure
      description: 'One output row per parent_key, carrying parent_name beside the keys: a key value identifies one source row for the carried columns, so they take one value per key and never split a group, reporting top_measure, tied_count, child_count, total_measure for that row''s matching rows. A group with no qualifying rows still appears, reporting 0; a retained row with no matching rows has nothing to count, so its counts are 0, never 1.'
      operation: filtered_aggregate
      order: 6
    - carried_fields:
      - parent_key
      - top_label
      - top_row_id
      description: Keep the single row per parent_key at which the ordering measure is largest, ties broken by the smallest description under a plain case-sensitive comparison of the stored text (the warehouse default order, in which every uppercase letter sorts before every lowercase one) (a row with no description value sorts after every row that has one), then the smallest id, and take top_label, top_row_id from that winning row. EVERY row of the group ranks, including a row whose ordering measure has no value — such a row sorts after every row that has one — so a group with at least one row always has a winning row, and the declared defaults belong to a group with NO rows.
      operation: extrema
      order: 7
    - carried_fields:
      - parent_key
      condition:
        public_identifiers:
        - parent_key
      description: Attach the extremal row's attributes to the grouped measures. LEFT, so a group with no rows at all keeps its measures.
      join_preservation: left
      operation: join
      order: 8
    - carried_fields:
      - parent_key
      - parent_name
      - top_measure
      - tied_count
      - child_count
      - total_measure
      - top_label
      - top_row_id
      description: Name the mart columns; top_measure, total_measure report their declared defaults — never NULL — for a group with no matching rows. For top_measure, total_measure, the default also applies to a group none of whose real rows carries an input value.
      operation: derive
      order: 9
    - carried_fields:
      - parent_key
      - parent_name
      - top_measure
      - tied_count
      - child_count
      - total_measure
      - top_label
      - top_row_id
      - top_measure_share
      description: 'Guarded ratios: top_measure_share — top_measure divided by total_measure as a FRACTION between 0 and 1 (not a percentage), rounded to 4 decimals, 0.0 when total_measure is 0.'
      operation: ratio
      order: 10
      semantic_parameters:
        null_result: 0.0 when the denominator is 0 or NULL
        rounding: ROUND to 4 decimal places
        units: fraction
    - carried_fields:
      - parent_key
      - parent_name
      - top_measure
      - tied_count
      - child_count
      - total_measure
      - top_label
      - top_row_id
      - top_measure_share
      - tie_state
      description: 'tie_state — ''empty'' when no row holds a maximum at all — the parent has no test_case rows, or none of its rows carries a approved value — ''unique'' when exactly one row holds the maximum, ''tied'' when two or more do. Equivalently, tie_state follows tied_count: ''empty'' when tied_count is 0, ''unique'' when it is 1, ''tied'' when it is 2 or more. A row holds the maximum only when it carries a approved value equal to the largest approved value among the parent''s rows; a row with no approved value never holds the maximum. So a parent whose test_case rows all lack a approved value has no row holding the maximum and is ''empty'', with tied_count 0, even though the ranking still selects a winning row for it by the tie-break alone, which top_label and top_row_id name.'
      operation: conditional
      order: 11
      semantic_parameters:
        boundary: categorical mapping; no numeric boundary
    - carried_fields:
      - parent_key
      description: 'Deterministic output order: sort by parent_key.'
      operation: tie_break
      order: 12
