      - max_amount
      description: One row per gloria_swanson_cinematographers entity that has at least one row in the absent measure state, and no row here for an entity with none, reporting row count, how many different non-missing film_duration values occur (each different value counted once, however many rows repeat it), total film_duration, and largest film_duration.
