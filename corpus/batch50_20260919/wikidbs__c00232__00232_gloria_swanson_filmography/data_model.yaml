- columns:
  - description: Identifier of the gloria_swanson_cinematographers row. One row per value.
    name: parent_key
    type: text
  - description: biography of the gloria_swanson_cinematographers row, copied unchanged.
    name: parent_name
    type: text
  - description: The largest film_duration itself; 0 when the parent has no film_appearances rows, and 0 when none of its rows carries a film_duration value.
    name: top_measure
    type: integer
  - description: 'How many film_appearances rows are tied at that largest film_duration. 1 when exactly one row carries that largest film_duration; 0 when there are no rows or when none of the rows carries a film_duration value; a row with no film_duration value never ties: only a row whose film_duration value equals the largest value among the parent''s rows holds the maximum, so the winning row of a parent whose rows all lack a value — the row the tie-break alone selects — is not counted here.'
    name: tied_count
    type: bigint
  - description: 'Number of film_appearances rows for this gloria_swanson_cinematographers row; 0 when there are none. Every linked film_appearances row counts, whether or not it carries a film_duration value. A gloria_swanson_cinematographers row kept with no film_appearances row reports 0 here, never 1: its placeholder holds no film_appearances row to count.'
    name: child_count
    type: bigint
  - description: Sum of film_duration over all of them; 0 when the parent has no film_appearances rows, and 0 when none of its rows carries a film_duration value (rows with no film_duration value add nothing).
    name: total_measure
    type: integer
  - description: The film_title of the film_appearances row with the LARGEST film_duration for this gloria_swanson_cinematographers row. Ties in film_duration are broken by taking the SMALLEST film_title under a plain case-sensitive comparison of the stored text (the warehouse default order, in which every uppercase letter sorts before every lowercase one); rows tied on both are resolved by the smallest kinopoisk_film_id. A row with no film_duration value still ranks, after every row that has one, so a parent holding at least one film_appearances row always has a winning row — when NONE of its rows carries a film_duration value the winner is the one the tie-break alone selects, not the no-rows default. The literal '(none)' when the parent has no film_appearances rows at all.
    name: top_label
    type: text
  - description: The kinopoisk_film_id of that same extremal row — the winner under the SAME total order, so it is the identifier of a real film_appearances row whenever the parent has any. This includes when none of them carries a film_duration value. It is 0 when there are no rows, and only then. It identifies WHICH row won, so a tie resolved the wrong way is visible even when two rows share a label.
    name: top_row_id
    type: integer
  - description: top_measure divided by total_measure as a FRACTION between 0 and 1 (not a percentage), rounded to 4 decimals, 0.0 when total_measure is 0.
    name: top_measure_share
    type: float
  - description: '''empty'' when no row holds a maximum at all — the parent has no film_appearances rows, or none of its rows carries a film_duration value — ''unique'' when exactly one row holds the maximum, ''tied'' when two or more do. Equivalently, tie_state follows tied_count: ''empty'' when tied_count is 0, ''unique'' when it is 1, ''tied'' when it is 2 or more. A row holds the maximum only when it carries a film_duration value equal to the largest film_duration value among the parent''s rows; a row with no film_duration value never holds the maximum. So a parent whose film_appearances rows all lack a film_duration value has no row holding the maximum and is ''empty'', with tied_count 0, even though the ranking still selects a winning row for it by the tie-break alone, which top_label and top_row_id name.'
    name: tie_state
    type: text
  description: 'Per-gloria_swanson_cinematographers extremes over linked film_appearances rows in the Gloria_Swanson_Filmography database: WHICH row is largest, not how large it is.'
  grain: One row per gloria_swanson_cinematographers (name), INCLUDING gloria_swanson_cinematographers rows with no linked film_appearances rows.
