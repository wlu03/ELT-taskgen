    - carried_fields:
      - parent_key
      description: Rank the joined rows within each group under an explicit total order (measure first, then the declared tie-break), so the extremal row is a function of the input and not of row order.
      operation: window
      order: 5
    - carried_fields:
      - parent_key
      - parent_name
      - top_measure
      - tied_count
      - child_count
      - total_measure
      description: 'One output row per parent_key, carrying parent_name beside the keys: a key value identifies one source row for the carried columns, so they take one value per key and never split a group, reporting top_measure, tied_count, child_count, total_measure for that row''s matching rows. A group with no qualifying rows still appears, reporting 0; a retained row with no matching rows has nothing to count, so its counts are 0, never 1.'
      operation: filtered_aggregate
      order: 6
    - carried_fields:
      - parent_key
      - top_label
      - top_row_id
      description: Keep the single row per parent_key at which the ordering measure is largest, ties broken by the smallest name under a plain case-sensitive comparison of the stored text (the warehouse default order, in which every uppercase letter sorts before every lowercase one) (a row with no name value sorts after every row that has one), then the smallest id, and take top_label, top_row_id from that winning row. The ordering measure is required on every real input row, so a non-empty group always has a winning row; the declared defaults belong only to a group with NO rows.
      operation: extrema
      order: 7
