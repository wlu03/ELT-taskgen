  transformation:
    steps:
    - description: Read source table erp_tax.
      operation: source
      order: 1
      source_inputs:
      - erp_tax
    - description: Read source table erp_sale_order_line.
      operation: source
      order: 2
      source_inputs:
      - erp_sale_order_line
    - carried_fields:
      - parent_key
      - parent_name
      description: One row per erp_tax row, keyed by id.
      operation: derive
      order: 3
      source_inputs:
      - erp_tax
    - carried_fields:
      - tax_id
      - id
      condition:
        public_identifiers:
        - erp_sale_order_line
        - tax_id
        - parent_key
      description: Bring in erp_sale_order_line; a erp_tax row with no matching erp_sale_order_line row is retained and receives the stated empty snapshot values.
      join_preservation: left
      operation: join
      order: 4
      source_inputs:
      - erp_sale_order_line
    - carried_fields:
      - parent_key
      - parent_name
      - event_count
      - lifetime_amount
      description: 'One output row per parent_key, carrying parent_name beside the keys: a key value identifies one source row for the carried columns, so they take one value per key and never split a group, reporting event_count, lifetime_amount for that row''s matching rows.'
      operation: aggregate
      order: 5
    - carried_fields:
      - parent_key
      - latest_row_id
      - latest_amount
      - latest_label
      description: Keep the single row per parent_key at which the ordering measure is largest, ties broken by the smallest id, and take latest_row_id, latest_amount, latest_label from that winning row. EVERY row of the group ranks, including a row whose ordering measure has no value — such a row sorts after every row that has one — so a group with at least one row always has a winning row, and the declared defaults belong to a group with NO rows.
      operation: extrema
      order: 6
    - carried_fields:
      - parent_key
      condition:
        public_identifiers:
        - parent_key
      description: Attach the extremal row's attributes to the grouped measures. LEFT, so a group with no rows at all keeps its measures.
      join_preservation: left
      operation: join
      order: 7
    - carried_fields:
      - parent_key
      - parent_name
      - event_count
      - lifetime_amount
      - latest_row_id
      - latest_amount
      - latest_label
      description: Name the mart columns; lifetime_amount reports its declared default — never NULL — for a group with no matching rows.
      operation: derive
      order: 8
    - carried_fields:
      - parent_key
      - parent_name
      - event_count
      - lifetime_amount
      - latest_row_id
      - latest_amount
      - latest_label
      - latest_amount_share
      description: 'Guarded ratios: latest_amount_share — latest_amount divided by lifetime_amount as a fraction, rounded to 4 decimal places; 0.0 when lifetime_amount is 0.'
      operation: ratio
      order: 9
      semantic_parameters:
        null_result: 0.0 when the denominator is 0 or NULL
        rounding: ROUND to 4 decimal places
        units: fraction
    - carried_fields:
      - parent_key
      description: 'Deterministic output order: sort by parent_key.'
      operation: tie_break
      order: 10
- columns:
  - description: Identifier of the erp_sale_order row.
    name: entity_key
    type: integer
  - description: '''present'' for a linked erp_sale_order_line row; ''absent'' only for a erp_sale_order row with no linked erp_sale_order_line row. active is required on every real erp_sale_order_line row.'
    name: measure_state
    type: text
  - description: invoice_method of the erp_sale_order row, copied unchanged.
    name: entity_name
    type: text
  - description: Number of linked erp_sale_order_line rows in this entity/state cell; 0 for a no-activity absent cell.
    name: row_count
    type: bigint
  - description: Number of unique active values in this cell; each unique value is counted once, however many rows repeat it; 0 for a no-activity absent cell.
    name: distinct_amount_count
    type: bigint
  - description: Sum of active in this cell; 0 for a no-activity absent cell.
    name: total_amount
    type: integer
  - description: Largest active in this cell; 0 for a no-activity absent cell.
    name: max_amount
    type: integer
  - description: max_amount divided by total_amount as a fraction, rounded to 4 decimal places; 0.0 when total_amount is 0.
    name: max_amount_share
    type: float
  description: Per-(erp_sale_order, measure state) distribution of linked erp_sale_order_line activity in the 011152_SQL%20Tables.sql schema.
