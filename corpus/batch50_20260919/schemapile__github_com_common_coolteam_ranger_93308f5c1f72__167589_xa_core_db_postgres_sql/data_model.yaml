models:
- columns:
  - description: Identifier of the x_user row. One row per value.
    name: parent_key
    type: bigint
  - description: descr of the x_user row, copied unchanged.
    name: parent_name
    type: text
  - description: 'Number of x_policy_item_user_perm rows for this x_user row; 0 when there are none. Every linked x_policy_item_user_perm row counts, whether or not it carries a sort_order value. A x_user row kept with no x_policy_item_user_perm row reports 0 here, never 1: its placeholder holds no x_policy_item_user_perm row to count.'
    name: event_count
    type: bigint
  - description: Sum of sort_order over all matching x_policy_item_user_perm rows; 0 when there are no rows and when none of those rows carries an sort_order value; a row with no sort_order value adds nothing, so a group with some values sums the values it has.
    name: lifetime_amount
    type: integer
  - description: 'id of the row with the latest create_time; ties take the smallest id. It is 0 when there are no rows. Every x_policy_item_user_perm row of the x_user row ranks, whether or not it carries a sort_order value: the latest create_time wins even when that row''s sort_order is missing.'
    name: latest_row_id
    type: bigint
  - description: sort_order from that same latest row; 0 when there are no rows or when the winning value is missing.
    name: latest_amount
    type: integer
  - description: guid from that same latest row; '(none)' when there are no rows or when the winning value is missing.
    name: latest_label
    type: text
  - description: latest_amount divided by lifetime_amount as a fraction, rounded to 4 decimal places; 0.0 when lifetime_amount is 0. The division uses latest_amount as this mart reports it, after its default of 0 for a winning row whose sort_order is missing, so such a row gives 0.0.
    name: latest_amount_share
    type: float
  description: Per-x_user latest-row snapshot over linked x_policy_item_user_perm activity in the 167589_xa_core_db_postgres.sql schema.
  grain: One row per x_user (id), INCLUDING x_user rows with no linked x_policy_item_user_perm rows.
