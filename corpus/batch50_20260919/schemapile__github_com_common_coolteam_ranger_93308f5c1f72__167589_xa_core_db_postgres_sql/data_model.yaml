  transformation:
    steps:
    - description: Read source table x_user.
      operation: source
      order: 1
      source_inputs:
      - x_user
    - description: Read source table x_policy_item_user_perm.
      operation: source
      order: 2
      source_inputs:
      - x_policy_item_user_perm
    - carried_fields:
      - parent_key
      - parent_name
      description: One row per x_user row, keyed by id.
      operation: derive
      order: 3
      source_inputs:
      - x_user
    - carried_fields:
      - user_id
      - id
      condition:
        public_identifiers:
        - x_policy_item_user_perm
        - user_id
        - parent_key
      description: Bring in x_policy_item_user_perm; a x_user row with no matching x_policy_item_user_perm row is retained and receives the stated empty snapshot values.
      join_preservation: left
      operation: join
      order: 4
      source_inputs:
      - x_policy_item_user_perm
    - carried_fields:
      - parent_key
      - parent_name
      - event_count
      - lifetime_amount
      description: 'One output row per parent_key, carrying parent_name beside the keys: a key value identifies one source row for the carried columns, so they take one value per key and never split a group, reporting event_count, lifetime_amount for that row''s matching rows.'
      operation: aggregate
      order: 5
    - carried_fields:
      - parent_key
      - latest_row_id
      - latest_amount
      - latest_label
      description: Keep the single row per parent_key at which the ordering measure is largest, ties broken by the smallest id, and take latest_row_id, latest_amount, latest_label from that winning row. EVERY row of the group ranks, including a row whose ordering measure has no value — such a row sorts after every row that has one — so a group with at least one row always has a winning row, and the declared defaults belong to a group with NO rows.
      operation: extrema
      order: 6
    - carried_fields:
      - parent_key
      condition:
        public_identifiers:
        - parent_key
      description: Attach the extremal row's attributes to the grouped measures. LEFT, so a group with no rows at all keeps its measures.
      join_preservation: left
      operation: join
      order: 7
    - carried_fields:
      - parent_key
      - parent_name
      - event_count
      - lifetime_amount
      - latest_row_id
      - latest_amount
      - latest_label
      description: Name the mart columns; lifetime_amount reports its declared default — never NULL — for a group with no matching rows. For lifetime_amount, the default also applies to a group none of whose real rows carries an input value.
      operation: derive
      order: 8
    - carried_fields:
      - parent_key
      - parent_name
      - event_count
      - lifetime_amount
      - latest_row_id
      - latest_amount
      - latest_label
      - latest_amount_share
      description: 'Guarded ratios: latest_amount_share — latest_amount divided by lifetime_amount as a fraction, rounded to 4 decimal places; 0.0 when lifetime_amount is 0. The division uses latest_amount as this mart reports it, after its default of 0 for a winning row whose sort_order is missing, so such a row gives 0.0.'
      operation: ratio
      order: 9
      semantic_parameters:
        null_result: 0.0 when the denominator is 0 or NULL
        rounding: ROUND to 4 decimal places
        units: fraction
    - carried_fields:
      - parent_key
      description: 'Deterministic output order: sort by parent_key.'
      operation: tie_break
      order: 10
- columns:
  - description: Identifier of the x_service_def row.
