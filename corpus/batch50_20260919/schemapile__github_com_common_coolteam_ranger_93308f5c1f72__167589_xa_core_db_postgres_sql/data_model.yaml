- columns:
  - description: Identifier of the x_service row. One row per value.
    name: parent_key
    type: bigint
  - description: description of the x_service row, copied unchanged.
    name: parent_name
    type: text
  - description: The largest policy_type itself; 0 when the parent has no x_policy rows, and 0 when none of its rows carries a policy_type value.
    name: top_measure
    type: integer
  - description: 'How many x_policy rows are tied at that largest policy_type. 1 when exactly one row carries that largest policy_type; 0 when there are no rows or when none of the rows carries a policy_type value; a row with no policy_type value never ties: only a row whose policy_type value equals the largest value among the parent''s rows holds the maximum, so the winning row of a parent whose rows all lack a value — the row the tie-break alone selects — is not counted here.'
    name: tied_count
    type: bigint
  - description: 'Number of x_policy rows for this x_service row; 0 when there are none. Every linked x_policy row counts, whether or not it carries a policy_type value. A x_service row kept with no x_policy row reports 0 here, never 1: its placeholder holds no x_policy row to count.'
    name: child_count
    type: bigint
  - description: Sum of policy_type over all of them; 0 when the parent has no x_policy rows, and 0 when none of its rows carries a policy_type value (rows with no policy_type value add nothing).
    name: total_measure
    type: integer
  - description: The description of the x_policy row with the LARGEST policy_type for this x_service row. Ties in policy_type are broken by taking the SMALLEST description under a plain case-sensitive comparison of the stored text (the warehouse default order, in which every uppercase letter sorts before every lowercase one) — a row with no description value sorts after every labelled row; rows tied on both are resolved by the smallest id. A row with no policy_type value still ranks, after every row that has one, so a parent holding at least one x_policy row always has a winning row — when NONE of its rows carries a policy_type value the winner is the one the tie-break alone selects, not the no-rows default. The literal '(none)' when the parent has no x_policy rows at all, and '(none)' when the winning row has no description value.
    name: top_label
    type: text
  - description: The id of that same extremal row — the winner under the SAME total order, so it is the identifier of a real x_policy row whenever the parent has any. This includes when none of them carries a policy_type value. It is 0 when there are no rows, and only then. It identifies WHICH row won, so a tie resolved the wrong way is visible even when two rows share a label.
    name: top_row_id
    type: bigint
  - description: top_measure divided by total_measure as a FRACTION between 0 and 1 (not a percentage), rounded to 4 decimals, 0.0 when total_measure is 0.
    name: top_measure_share
    type: float
  - description: '''empty'' when no row holds a maximum at all — the parent has no x_policy rows, or none of its rows carries a policy_type value — ''unique'' when exactly one row holds the maximum, ''tied'' when two or more do. Equivalently, tie_state follows tied_count: ''empty'' when tied_count is 0, ''unique'' when it is 1, ''tied'' when it is 2 or more. A row holds the maximum only when it carries a policy_type value equal to the largest policy_type value among the parent''s rows; a row with no policy_type value never holds the maximum. So a parent whose x_policy rows all lack a policy_type value has no row holding the maximum and is ''empty'', with tied_count 0, even though the ranking still selects a winning row for it by the tie-break alone, which top_label and top_row_id name.'
    name: tie_state
    type: text
  description: 'Per-x_service extremes over linked x_policy rows in the 167589_xa_core_db_postgres.sql schema: WHICH row is largest, not how large it is.'
  grain: One row per x_service (id), INCLUDING x_service rows with no linked x_policy rows.
