      source_inputs:
      - x_service
    - carried_fields:
      - service
      - id
      condition:
        public_identifiers:
        - x_policy
        - service
        - parent_key
      description: 'Bring in x_policy: a x_service row with no x_policy rows still appears, with the declared defaults.'
      join_preservation: left
      operation: join
      order: 4
      source_inputs:
      - x_policy
    - carried_fields:
      - parent_key
      description: Rank the joined rows within each group under an explicit total order (measure first, then the declared tie-break), so the extremal row is a function of the input and not of row order.
      operation: window
