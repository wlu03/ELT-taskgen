models:
- columns:
  - description: Identifier of the supplier row.
    name: entity_key
    type: integer
  - description: '''present'' for a linked supplier_translation row whose created_at has a value; ''absent'' when created_at is missing, including a supplier row with no linked supplier_translation row. A linked supplier_translation row whose created_at has a value belongs only to the present state and never to the absent state.'
    name: measure_state
    type: text
  - description: address_addition of the supplier row, copied unchanged.
    name: entity_name
    type: text
  - description: Number of linked supplier_translation rows in this entity/state cell; a absent cell holding real supplier_translation rows whose created_at is missing COUNTS those rows, and only the placeholder cell of a supplier row with no linked supplier_translation row at all reports 0.
    name: row_count
    type: bigint
  - description: Number of unique non-missing created_at values in this cell; each unique non-missing value is counted once, however many rows repeat it; 0 whenever the cell holds no created_at value at all — both for a supplier row with no linked supplier_translation row and for an absent cell whose rows all have a missing created_at.
    name: distinct_amount_count
    type: bigint
  - description: Sum of created_at in this cell; 0 for a no-activity cell that has no rows at all, and 0 when none of the cell's rows carries an created_at value.
    name: total_amount
    type: integer
  - description: Largest created_at in this cell; 0 for a no-activity cell that has no rows at all, and 0 when none of the cell's rows carries an created_at value.
    name: max_amount
    type: integer
  - description: max_amount divided by total_amount as a fraction, rounded to 4 decimal places; 0.0 when total_amount is 0.
    name: max_amount_share
    type: float
  description: Per-(supplier, measure state) distribution of linked supplier_translation activity in the 030317_start.sql schema.
