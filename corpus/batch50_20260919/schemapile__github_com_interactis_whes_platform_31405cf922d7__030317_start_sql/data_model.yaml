      description: Rank the joined rows within each group under an explicit total order (measure first, then the declared tie-break), so the extremal row is a function of the input and not of row order.
      operation: window
      order: 5
    - carried_fields:
      - parent_key
      - parent_name
      - top_measure
      - tied_count
      - child_count
      - total_measure
      description: 'One output row per parent_key, carrying parent_name beside the keys: a key value identifies one source row for the carried columns, so they take one value per key and never split a group, reporting top_measure, tied_count, child_count, total_measure for that row''s matching rows. A group with no qualifying rows still appears, reporting 0; a retained row with no matching rows has nothing to count, so its counts are 0, never 1.'
      operation: filtered_aggregate
      order: 6
    - carried_fields:
      - parent_key
      - top_label
      - top_row_id
      description: Keep the single row per parent_key at which the ordering measure is largest, ties broken by the smallest catering under a plain case-sensitive comparison of the stored text (the warehouse default order, in which every uppercase letter sorts before every lowercase one) (a row with no catering value sorts after every row that has one), then the smallest id, and take top_label, top_row_id from that winning row. EVERY row of the group ranks, including a row whose ordering measure has no value — such a row sorts after every row that has one — so a group with at least one row always has a winning row, and the declared defaults belong to a group with NO rows.
      operation: extrema
      order: 7
    - carried_fields:
      - parent_key
      condition:
        public_identifiers:
        - parent_key
      description: Attach the extremal row's attributes to the grouped measures. LEFT, so a group with no rows at all keeps its measures.
      join_preservation: left
      operation: join
      order: 8
    - carried_fields:
      - parent_key
      - parent_name
      - top_measure
      - tied_count
      - child_count
      - total_measure
      - top_label
      - top_row_id
      description: Name the mart columns; top_measure, total_measure report their declared defaults — never NULL — for a group with no matching rows. For top_measure, total_measure, the default also applies to a group none of whose real rows carries an input value.
      operation: derive
      order: 9
    - carried_fields:
      - parent_key
      - parent_name
      - top_measure
      - tied_count
      - child_count
      - total_measure
      - top_label
      - top_row_id
      - top_measure_share
      description: 'Guarded ratios: top_measure_share — top_measure divided by total_measure as a FRACTION between 0 and 1 (not a percentage), rounded to 4 decimals, 0.0 when total_measure is 0.'
      operation: ratio
      order: 10
      semantic_parameters:
        null_result: 0.0 when the denominator is 0 or NULL
        rounding: ROUND to 4 decimal places
        units: fraction
    - carried_fields:
      - parent_key
      - parent_name
      - top_measure
      - tied_count
      - child_count
      - total_measure
      - top_label
      - top_row_id
      - top_measure_share
      - tie_state
      description: 'tie_state — ''empty'' when no row holds a maximum at all — the parent has no route_translation rows, or none of its rows carries a created_at value — ''unique'' when exactly one row holds the maximum, ''tied'' when two or more do. Equivalently, tie_state follows tied_count: ''empty'' when tied_count is 0, ''unique'' when it is 1, ''tied'' when it is 2 or more. A row holds the maximum only when it carries a created_at value equal to the largest created_at value among the parent''s rows; a row with no created_at value never holds the maximum. So a parent whose route_translation rows all lack a created_at value has no row holding the maximum and is ''empty'', with tied_count 0, even though the ranking still selects a winning row for it by the tie-break alone, which top_label and top_row_id name.'
      operation: conditional
      order: 11
      semantic_parameters:
        boundary: categorical mapping; no numeric boundary
    - carried_fields:
      - parent_key
      description: 'Deterministic output order: sort by parent_key.'
      operation: tie_break
      order: 12
- columns:
  - description: Identifier of the poi row.
    name: entity_key
    type: integer
  - description: '''present'' for a linked poi_translation row whose created_at has a value; ''absent'' when created_at is missing, including a poi row with no linked poi_translation row. A linked poi_translation row whose created_at has a value belongs only to the present state and never to the absent state.'
    name: measure_state
    type: text
  - description: arrival_station of the poi row, copied unchanged.
    name: entity_name
    type: text
  - description: Number of linked poi_translation rows in this entity/state cell; a absent cell holding real poi_translation rows whose created_at is missing COUNTS those rows, and only the placeholder cell of a poi row with no linked poi_translation row at all reports 0.
    name: row_count
    type: bigint
  - description: Number of unique non-missing created_at values in this cell; each unique non-missing value is counted once, however many rows repeat it; 0 whenever the cell holds no created_at value at all — both for a poi row with no linked poi_translation row and for an absent cell whose rows all have a missing created_at.
    name: distinct_amount_count
    type: bigint
  - description: Sum of created_at in this cell; 0 for a no-activity cell that has no rows at all, and 0 when none of the cell's rows carries an created_at value.
    name: total_amount
    type: integer
  - description: Largest created_at in this cell; 0 for a no-activity cell that has no rows at all, and 0 when none of the cell's rows carries an created_at value.
    name: max_amount
    type: integer
  - description: max_amount divided by total_amount as a fraction, rounded to 4 decimal places; 0.0 when total_amount is 0.
    name: max_amount_share
    type: float
  description: Per-(poi, measure state) distribution of linked poi_translation activity in the 030317_start.sql schema.
