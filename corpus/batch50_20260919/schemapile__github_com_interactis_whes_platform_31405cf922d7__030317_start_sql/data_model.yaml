  transformation:
    steps:
    - description: Read source table supplier.
      operation: source
      order: 1
      source_inputs:
      - supplier
    - description: Read source table supplier_translation.
      operation: source
      order: 2
      source_inputs:
      - supplier_translation
    - carried_fields:
      - entity_key
      - entity_name
      description: Carry each id and its address_addition into the measure-state calculation.
      operation: derive
      order: 3
      source_inputs:
      - supplier
    - carried_fields:
      - entity_key
      - entity_name
      - id
      - supplier_id
      condition:
        public_identifiers:
        - supplier_translation
        - supplier_id
        - entity_key
      description: Bring the linked supplier_translation rows into each supplier entity; retain an entity with no linked row so its absent state is visible.
      join_preservation: left
      operation: join
      order: 4
      source_inputs:
      - supplier_translation
    - carried_fields:
      - entity_key
      - entity_name
      description: 'Keep the present measure-state rows: a real supplier_translation row whose created_at has a value.'
      operation: filter
      order: 5
    - carried_fields:
      - entity_key
      - entity_name
      - row_count
      - distinct_amount_count
      - total_amount
      - max_amount
      description: One row per supplier entity that has at least one row in the present measure state, and no row here for an entity with none, reporting row count, how many different non-missing created_at values occur (each different value counted once, however many rows repeat it), total created_at, and largest created_at.
      operation: distinct
      order: 6
    - carried_fields:
      - entity_key
      - entity_name
      - row_count
      - distinct_amount_count
      - total_amount
      - max_amount
      - max_amount_share
      description: max_amount_share is max_amount divided by total_amount as a fraction, rounded to 4 decimal places; 0.0 when total_amount is 0.
      operation: ratio
      order: 7
      semantic_parameters:
        null_result: 0.0 when total_amount is 0
        rounding: ROUND to 4 decimal places
        units: fraction
    - carried_fields:
      - entity_key
      - measure_state
      - entity_name
      - row_count
      - distinct_amount_count
      - total_amount
      - max_amount
      - max_amount_share
      description: Label these measures as the present measure state.
      operation: derive
      order: 8
    - carried_fields:
      - entity_key
      - entity_name
      description: 'Keep the absent measure-state rows: created_at is missing, including the retained placeholder for a supplier row with no supplier_translation rows. A real supplier_translation row whose created_at has a value belongs only to the present state and never to this absent state.'
      operation: filter
      order: 9
    - carried_fields:
      - entity_key
      - entity_name
      - row_count
      - distinct_amount_count
      - total_amount
      - max_amount
      description: One row per supplier entity that has at least one row in the absent measure state, and no row here for an entity with none, reporting row count, how many different non-missing created_at values occur (each different value counted once, however many rows repeat it), total created_at, and largest created_at.
      operation: distinct
      order: 10
    - carried_fields:
      - entity_key
      - entity_name
      - row_count
      - distinct_amount_count
      - total_amount
      - max_amount
      - max_amount_share
      description: max_amount_share is max_amount divided by total_amount as a fraction, rounded to 4 decimal places; 0.0 when total_amount is 0.
      operation: ratio
      order: 11
      semantic_parameters:
        null_result: 0.0 when total_amount is 0
        rounding: ROUND to 4 decimal places
        units: fraction
    - carried_fields:
      - entity_key
      - measure_state
      - entity_name
      - row_count
      - distinct_amount_count
      - total_amount
      - max_amount
      - max_amount_share
      description: Label these measures as the absent measure state.
      operation: derive
      order: 12
    - carried_fields:
      - entity_key
      - measure_state
      - entity_name
      - row_count
      - distinct_amount_count
      - total_amount
      - max_amount
      - max_amount_share
      description: 'Stack the present-state summary and the absent-state summary into one output list: every present-state row and every absent-state row is its own output row, an entity with rows in both states appears twice, once per state, and the two summaries are never matched to each other.'
      operation: union
      order: 13
      semantic_parameters:
        mode: all
    - carried_fields:
      - entity_key
      - measure_state
      description: 'Deterministic output order: entity, then measure state.'
      operation: tie_break
      order: 14
- columns:
  - description: Identifier of the route row. One row per value.
    name: parent_key
    type: integer
  - description: arrival_station of the route row, copied unchanged.
    name: parent_name
    type: text
  - description: The largest created_at itself; 0 when the parent has no route_translation rows, and 0 when none of its rows carries a created_at value.
    name: top_measure
    type: integer
  - description: 'How many route_translation rows are tied at that largest created_at. 1 when exactly one row carries that largest created_at; 0 when there are no rows or when none of the rows carries a created_at value; a row with no created_at value never ties: only a row whose created_at value equals the largest value among the parent''s rows holds the maximum, so the winning row of a parent whose rows all lack a value — the row the tie-break alone selects — is not counted here.'
    name: tied_count
    type: bigint
  - description: 'Number of route_translation rows for this route row; 0 when there are none. Every linked route_translation row counts, whether or not it carries a created_at value. A route row kept with no route_translation row reports 0 here, never 1: its placeholder holds no route_translation row to count.'
    name: child_count
    type: bigint
  - description: Sum of created_at over all of them; 0 when the parent has no route_translation rows, and 0 when none of its rows carries a created_at value (rows with no created_at value add nothing).
    name: total_measure
    type: integer
  - description: The catering of the route_translation row with the LARGEST created_at for this route row. Ties in created_at are broken by taking the SMALLEST catering under a plain case-sensitive comparison of the stored text (the warehouse default order, in which every uppercase letter sorts before every lowercase one) — a row with no catering value sorts after every labelled row; rows tied on both are resolved by the smallest id. A row with no created_at value still ranks, after every row that has one, so a parent holding at least one route_translation row always has a winning row — when NONE of its rows carries a created_at value the winner is the one the tie-break alone selects, not the no-rows default. The literal '(none)' when the parent has no route_translation rows at all, and '(none)' when the winning row has no catering value.
    name: top_label
    type: text
  - description: The id of that same extremal row — the winner under the SAME total order, so it is the identifier of a real route_translation row whenever the parent has any. This includes when none of them carries a created_at value. It is 0 when there are no rows, and only then. It identifies WHICH row won, so a tie resolved the wrong way is visible even when two rows share a label.
    name: top_row_id
    type: integer
  - description: top_measure divided by total_measure as a FRACTION between 0 and 1 (not a percentage), rounded to 4 decimals, 0.0 when total_measure is 0.
    name: top_measure_share
    type: float
  - description: '''empty'' when no row holds a maximum at all — the parent has no route_translation rows, or none of its rows carries a created_at value — ''unique'' when exactly one row holds the maximum, ''tied'' when two or more do. Equivalently, tie_state follows tied_count: ''empty'' when tied_count is 0, ''unique'' when it is 1, ''tied'' when it is 2 or more. A row holds the maximum only when it carries a created_at value equal to the largest created_at value among the parent''s rows; a row with no created_at value never holds the maximum. So a parent whose route_translation rows all lack a created_at value has no row holding the maximum and is ''empty'', with tied_count 0, even though the ranking still selects a winning row for it by the tie-break alone, which top_label and top_row_id name.'
    name: tie_state
    type: text
  description: 'Per-route extremes over linked route_translation rows in the 030317_start.sql schema: WHICH row is largest, not how large it is.'
  grain: One row per route (id), INCLUDING route rows with no linked route_translation rows.
  key_columns:
