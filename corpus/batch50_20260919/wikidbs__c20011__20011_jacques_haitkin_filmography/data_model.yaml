models:
- columns:
  - description: Identifier of the producer row.
    name: entity_key
    type: text
  - description: '''present'' for a linked filmography_details row whose film_duration has a value; ''absent'' when film_duration is missing, including a producer row with no linked filmography_details row. A linked filmography_details row whose film_duration has a value belongs only to the present state and never to the absent state.'
    name: measure_state
    type: text
  - description: biography of the producer row, copied unchanged.
    name: entity_name
    type: text
  - description: Number of linked filmography_details rows in this entity/state cell; a absent cell holding real filmography_details rows whose film_duration is missing COUNTS those rows, and only the placeholder cell of a producer row with no linked filmography_details row at all reports 0.
    name: row_count
    type: bigint
  - description: Number of unique non-missing film_duration values in this cell; each unique non-missing value is counted once, however many rows repeat it; 0 whenever the cell holds no film_duration value at all — both for a producer row with no linked filmography_details row and for an absent cell whose rows all have a missing film_duration.
    name: distinct_amount_count
    type: bigint
  - description: Sum of film_duration in this cell; 0 for a no-activity cell that has no rows at all, and 0 when none of the cell's rows carries an film_duration value.
    name: total_amount
    type: integer
  - description: Largest film_duration in this cell; 0 for a no-activity cell that has no rows at all, and 0 when none of the cell's rows carries an film_duration value.
    name: max_amount
    type: integer
  - description: max_amount divided by total_amount as a fraction, rounded to 4 decimal places; 0.0 when total_amount is 0.
    name: max_amount_share
    type: float
  description: Per-(producer, measure state) distribution of linked filmography_details rows in the JACQUES_HAITKIN_FILMOGRAPHY database.
  grain: One row per (full_name, measure state) pair represented among linked filmography_details rows; the absent state includes missing film_duration values and a no-activity row for a producer row with no links. A linked filmography_details row whose film_duration has a value belongs only to the present state and never to the absent state.
  key_columns:
  - entity_key
  - measure_state
  name: producer_filmography_details_distribution
  source_relationships:
  - child_columns:
    - cast_members
    child_table: filmography_details
    parent_columns:
    - actor_name
    parent_table: filmography_cast_details
    required: true
  - child_columns:
    - film_director
    child_table: filmography_details
    parent_columns:
    - director_name
    parent_table: film_directors
    required: true
  - child_columns:
    - film_genre
    child_table: filmography_details
    parent_columns:
    - genre_name
    parent_table: film_genres
    required: false
  - child_columns:
    - film_producer
    child_table: filmography_details
    parent_columns:
    - full_name
    parent_table: producer
    required: false
  - child_columns:
    - music_composer
    child_table: filmography_details
    parent_columns:
    - composer_name
    parent_table: film_composers
    required: false
  - child_columns:
    - screenwriter
    child_table: filmography_details
    parent_columns:
    - full_name
    parent_table: film_industry_professionals
    required: false
  transformation:
    steps:
    - description: Read source table producer.
      operation: source
      order: 1
      source_inputs:
      - producer
    - description: Read source table filmography_details.
      operation: source
      order: 2
      source_inputs:
      - filmography_details
    - carried_fields:
      - entity_key
      - entity_name
      description: Carry each full_name and its biography into the measure-state calculation.
      operation: derive
      order: 3
      source_inputs:
      - producer
    - carried_fields:
      - entity_key
      - entity_name
      - full_name
      - film_producer
      condition:
        public_identifiers:
        - filmography_details
        - film_producer
        - entity_key
      description: Bring the linked filmography_details rows into each producer entity; retain an entity with no linked row so its absent state is visible.
      join_preservation: left
      operation: join
      order: 4
      source_inputs:
      - filmography_details
    - carried_fields:
      - entity_key
      - entity_name
      description: 'Keep the present measure-state rows: a real filmography_details row whose film_duration has a value.'
      operation: filter
      order: 5
    - carried_fields:
      - entity_key
      - entity_name
      - row_count
      - distinct_amount_count
      - total_amount
      - max_amount
      description: One row per producer entity that has at least one row in the present measure state, and no row here for an entity with none, reporting row count, how many different non-missing film_duration values occur (each different value counted once, however many rows repeat it), total film_duration, and largest film_duration.
      operation: distinct
      order: 6
    - carried_fields:
      - entity_key
      - entity_name
      - row_count
      - distinct_amount_count
      - total_amount
      - max_amount
      - max_amount_share
      description: max_amount_share is max_amount divided by total_amount as a fraction, rounded to 4 decimal places; 0.0 when total_amount is 0.
      operation: ratio
      order: 7
      semantic_parameters:
        null_result: 0.0 when total_amount is 0
        rounding: ROUND to 4 decimal places
        units: fraction
    - carried_fields:
      - entity_key
      - measure_state
      - entity_name
      - row_count
      - distinct_amount_count
      - total_amount
      - max_amount
      - max_amount_share
      description: Label these measures as the present measure state.
      operation: derive
      order: 8
    - carried_fields:
      - entity_key
      - entity_name
      description: 'Keep the absent measure-state rows: film_duration is missing, including the retained placeholder for a producer row with no filmography_details rows. A real filmography_details row whose film_duration has a value belongs only to the present state and never to this absent state.'
      operation: filter
      order: 9
    - carried_fields:
      - entity_key
      - entity_name
      - row_count
      - distinct_amount_count
      - total_amount
      - max_amount
      description: One row per producer entity that has at least one row in the absent measure state, and no row here for an entity with none, reporting row count, how many different non-missing film_duration values occur (each different value counted once, however many rows repeat it), total film_duration, and largest film_duration.
      operation: distinct
      order: 10
    - carried_fields:
      - entity_key
      - entity_name
      - row_count
      - distinct_amount_count
      - total_amount
      - max_amount
      - max_amount_share
      description: max_amount_share is max_amount divided by total_amount as a fraction, rounded to 4 decimal places; 0.0 when total_amount is 0.
      operation: ratio
      order: 11
      semantic_parameters:
        null_result: 0.0 when total_amount is 0
        rounding: ROUND to 4 decimal places
        units: fraction
    - carried_fields:
      - entity_key
      - measure_state
      - entity_name
      - row_count
      - distinct_amount_count
      - total_amount
      - max_amount
      - max_amount_share
      description: Label these measures as the absent measure state.
      operation: derive
      order: 12
    - carried_fields:
      - entity_key
      - measure_state
      - entity_name
      - row_count
      - distinct_amount_count
      - total_amount
      - max_amount
      - max_amount_share
      description: 'Stack the present-state summary and the absent-state summary into one output list: every present-state row and every absent-state row is its own output row, an entity with rows in both states appears twice, once per state, and the two summaries are never matched to each other.'
      operation: union
      order: 13
      semantic_parameters:
        mode: all
    - carried_fields:
      - entity_key
      - measure_state
      description: 'Deterministic output order: entity, then measure state.'
      operation: tie_break
      order: 14
