    name: parent_key
    type: integer
  - description: email of the users row, copied unchanged.
    name: parent_name
    type: text
  - description: 'Number of producers rows for this users row; 0 when there are none. An users row kept with no producers row reports 0 here, never 1: its placeholder holds no producers row to count.'
    name: event_count
    type: bigint
  - description: Sum of user_created over all matching producers rows; 0 when there are no rows.
    name: lifetime_amount
    type: integer
  - description: id of the row with the latest date_created; ties take the smallest id. It is 0 when there are no rows.
    name: latest_row_id
    type: integer
  - description: user_created from that same latest row; 0 when there are no rows.
    name: latest_amount
    type: integer
  - description: email from that same latest row; '(none)' when there are no rows.
    name: latest_label
    type: text
  - description: latest_amount divided by lifetime_amount as a fraction, rounded to 4 decimal places; 0.0 when lifetime_amount is 0.
    name: latest_amount_share
    type: float
