  - description: Identifier of the roles row.
    name: entity_key
    type: integer
  - description: '''present'' for a linked history_users row; ''absent'' only for a roles row with no linked history_users row. user_edited is required on every real history_users row.'
    name: measure_state
    type: text
  - description: code of the roles row, copied unchanged.
    name: entity_name
    type: text
  - description: Number of linked history_users rows in this entity/state cell; 0 for a no-activity absent cell.
    name: row_count
    type: bigint
  - description: Number of unique user_edited values in this cell; each unique value is counted once, however many rows repeat it; 0 for a no-activity absent cell.
    name: distinct_amount_count
    type: bigint
  - description: Sum of user_edited in this cell; 0 for a no-activity absent cell.
    name: total_amount
    type: integer
  - description: Largest user_edited in this cell; 0 for a no-activity absent cell.
    name: max_amount
    type: integer
  - description: max_amount divided by total_amount as a fraction, rounded to 4 decimal places; 0.0 when total_amount is 0.
    name: max_amount_share
    type: float
