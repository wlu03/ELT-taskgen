      - entity_name
      description: Carry each id and its code into the measure-state calculation.
      operation: derive
      order: 3
      source_inputs:
      - roles
    - carried_fields:
      - entity_key
      - entity_name
      - id
      - id_roles
      condition:
        public_identifiers:
        - history_users
        - id_roles
        - entity_key
      description: Bring the linked history_users rows into each roles entity; retain an entity with no linked row so its absent state is visible.
      join_preservation: left
      operation: join
      order: 4
      source_inputs:
      - history_users
    - carried_fields:
      - entity_key
      - entity_name
      description: 'Keep the present measure-state rows: a real history_users row; user_edited is required on every such row.'
      operation: filter
      order: 5
    - carried_fields:
      - entity_key
      - entity_name
      - row_count
      - distinct_amount_count
      - total_amount
      - max_amount
      description: One row per roles entity that has at least one row in the present measure state, and no row here for an entity with none, reporting row count, how many different user_edited values occur (each different value counted once, however many rows repeat it), total user_edited, and largest user_edited.
      operation: distinct
      order: 6
    - carried_fields:
      - entity_key
      - entity_name
      - row_count
      - distinct_amount_count
      - total_amount
      - max_amount
      - max_amount_share
      description: max_amount_share is max_amount divided by total_amount as a fraction, rounded to 4 decimal places; 0.0 when total_amount is 0.
      operation: ratio
      order: 7
      semantic_parameters:
        null_result: 0.0 when total_amount is 0
        rounding: ROUND to 4 decimal places
        units: fraction
    - carried_fields:
      - entity_key
      - measure_state
      - entity_name
      - row_count
      - distinct_amount_count
      - total_amount
      - max_amount
      - max_amount_share
      description: Label these measures as the present measure state.
      operation: derive
      order: 8
    - carried_fields:
      - entity_key
      - entity_name
      description: 'Keep the absent measure-state rows: the retained placeholder for a roles row with no history_users rows; no real row can enter this state because user_edited is required.'
      operation: filter
      order: 9
    - carried_fields:
      - entity_key
      - entity_name
      - row_count
      - distinct_amount_count
      - total_amount
      - max_amount
      description: One row per roles entity with no linked history_users row at all, whose retained placeholder is its one row in the absent measure state, and no row here for an entity that has a linked history_users row, reporting a row count of 0, 0 different user_edited values, a total user_edited of 0 and a largest user_edited of 0.
      operation: distinct
      order: 10
    - carried_fields:
      - entity_key
      - entity_name
      - row_count
      - distinct_amount_count
      - total_amount
      - max_amount
      - max_amount_share
      description: max_amount_share is max_amount divided by total_amount as a fraction, rounded to 4 decimal places; 0.0 when total_amount is 0.
      operation: ratio
      order: 11
      semantic_parameters:
        null_result: 0.0 when total_amount is 0
