- columns:
  - description: Identifier of the products row. One row per value.
    name: parent_key
    type: integer
  - description: name of the products row, copied unchanged.
    name: parent_name
    type: text
  - description: The largest active itself; 0 when the parent has no history_products rows.
    name: top_measure
    type: integer
  - description: How many history_products rows are tied at that largest active. 1 when exactly one row carries that largest active; 0 when there are no rows.
    name: tied_count
    type: bigint
  - description: 'Number of history_products rows for this products row; 0 when there are none. A products row kept with no history_products row reports 0 here, never 1: its placeholder holds no history_products row to count.'
    name: child_count
    type: bigint
  - description: Sum of active over all of them; 0 when the parent has no history_products rows.
    name: total_measure
    type: integer
  - description: The name of the history_products row with the LARGEST active for this products row. Ties in active are broken by taking the SMALLEST name under a plain case-sensitive comparison of the stored text (the warehouse default order, in which every uppercase letter sorts before every lowercase one) — a row with no name value sorts after every labelled row; rows tied on both are resolved by the smallest id. The literal '(none)' when the parent has no history_products rows at all, and '(none)' when the winning row has no name value.
    name: top_label
    type: text
  - description: The id of that same extremal row — the winner under the SAME total order, so it is the identifier of a real history_products row whenever the parent has any. It is 0 when there are no rows, and only then. It identifies WHICH row won, so a tie resolved the wrong way is visible even when two rows share a label.
    name: top_row_id
    type: integer
  - description: top_measure divided by total_measure as a FRACTION between 0 and 1 (not a percentage), rounded to 4 decimals, 0.0 when total_measure is 0.
    name: top_measure_share
    type: float
  - description: '''empty'' when no row holds a maximum at all — the parent has no history_products rows — ''unique'' when exactly one row holds the maximum, ''tied'' when two or more do. Equivalently, tie_state follows tied_count: ''empty'' when tied_count is 0, ''unique'' when it is 1, ''tied'' when it is 2 or more.'
    name: tie_state
    type: text
  description: 'Per-products extremes over linked history_products rows in the 515049_reload-db.sql schema: WHICH row is largest, not how large it is.'
