models:
- name: studio_activity
  description: One record per studio, including studios without films.
  columns:
  - name: studio_id
    description: Identifier of the studio.
  - name: studio_name
    description: Name of the studio.
  - name: films_count
    description: Number of the studio's films; 0 when there are none.
  - name: distinct_genres_count
    description: Number of distinct genres among the studio's films, counting only
      genres listed in the genres table; 0 when there are none.
  - name: release_state_films_count
    description: Number of the studio's films with release_state 'released'; 0 when
      none qualify.
  - name: total_runtime_minutes
    description: Total non-missing runtime_minutes across the studio's films; 0 when
      there are no values.
  - name: release_state_runtime_minutes
    description: Total non-missing runtime_minutes across the studio's films with
      release_state 'released'; 0 when there are no qualifying values.
  - name: max_runtime_minutes
    description: Largest non-missing runtime_minutes among the studio's films; 0 when
      there are no values.
  - name: release_state_runtime_minutes_share
    description: release_state_runtime_minutes divided by total_runtime_minutes as
      a fraction, rounded to 4 decimal places; 0.0 when total_runtime_minutes is 0.
  - name: films_count_band
    description: 'Size band of films_count: ''none'' for 0, ''small'' for 1–2, ''medium''
      for 3–5, and ''large'' for more than 5.'
  - name: has_films
    description: '''yes'' when the studio has at least one film, ''no'' otherwise;
      never NULL.'
